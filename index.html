<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2e6f40">
<title>대형수거앱</title>

<!-- 여기부터 추가된 PWA 코드 -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{
  /* [8_27] 밝은 화면 */
  --bg:#f1f5f9; --panel:#ffffff; --line:#e2e8f0;
  --txt:#0f172a; --dim:#64748b;
  --g:#16a34a; --y:#ca8a04; --r:#dc2626; --o:#ea580c; --done:#64748b; --hold:#9333ea;
  --blue:#2563eb;
  --soft:#eef2ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--bg); color:var(--txt); font-size:15px;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit;cursor:pointer;border:0}

/* ── 헤더 ── */
#hd{
  position:fixed;top:0;left:0;right:0;z-index:60;
  background:#fff;border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 8px) 8px 8px;
  display:flex;gap:6px;align-items:center;
}
.hbtn{
  background:var(--panel);color:var(--txt);border:1px solid var(--line);
  border-radius:9px;padding:8px 8px;font-size:13px;font-weight:700;
  display:flex;align-items:center;gap:3px;white-space:nowrap;flex-shrink:0;
}
.hbtn:active{background:#e2e8f0}
.hbtn.on{background:var(--blue);border-color:var(--blue);color:#fff}
.hbtn.ic{padding:8px 10px;flex-shrink:0}
#worker{margin-left:auto;max-width:18vw;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
#zone{min-width:0;overflow:hidden;text-overflow:ellipsis}

/* ── 오프라인 배지 ── */
#offbar{
  position:fixed;left:0;right:0;z-index:59;
  top:calc(env(safe-area-inset-top) + 53px);
  background:var(--o);color:#fff;font-size:13px;font-weight:800;
  padding:6px 12px;display:none;text-align:center;
}

/* ── 본문 ── */
#map{position:fixed;top:0;left:0;right:0;bottom:0}
#listview{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  top:calc(env(safe-area-inset-top) + 53px);
  background:var(--bg);overflow-y:auto;display:none;
  padding:8px 8px calc(env(safe-area-inset-bottom) + 20px);
  -webkit-overflow-scrolling:touch;
}
/* 리스트 구역 점프 바 — 한 덩어리(.jumpwrap)로 고정한다.
   [9_39] 예전엔 줄마다 따로 sticky를 걸어서, 아파트 단지 줄이 펼쳐지면
   위 줄을 덮어버려 "아파트" 버튼을 다시 못 누르는 문제가 있었다.
   두 줄을 하나의 고정 상자 안에 넣으면 서로 겹칠 수가 없다. */
.jumpwrap{
  position:sticky;top:0;z-index:8;
  background:var(--bg);border-bottom:1px solid var(--line);margin-bottom:2px;
}
.jumpbar{
  display:flex;gap:6px;flex-wrap:wrap;align-items:center;
  background:var(--bg);padding:6px 0 8px;
}
.jumpbar.sub{padding:0 0 8px;border-top:1px dashed var(--line);padding-top:7px;}
.jumpbar button{
  background:#fff;color:var(--txt);border:1px solid var(--line);
  border-radius:999px;padding:7px 12px;font-size:13px;font-weight:800;
}
.jumpbar button:active{background:var(--soft)}
.jumpbar button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.card{
  background:var(--panel);border:1px solid var(--line);border-left-width:5px;
  border-radius:11px;padding:11px 12px;margin-bottom:8px;
  box-shadow:0 1px 2px rgba(15,23,42,.04);
}
.card:active{background:#f8fafc}
.card .r1{display:flex;gap:8px;align-items:baseline}
.card .ad{font-size:16px;font-weight:800;line-height:1.35;word-break:keep-all}
.card .nm{font-size:15px;font-weight:700;color:var(--dim)}
.card .it{font-size:13px;color:#475569;margin-top:4px;line-height:1.5}
.card .bt{font-size:11px;font-weight:800;padding:2px 7px;border-radius:5px;color:#fff;flex-shrink:0}
.card .amt2{font-size:13px;font-weight:800;color:var(--dim);flex-shrink:0;white-space:nowrap}
/* 목록 구역 머리글 — 점프바 아래에 붙음 (점프바 높이는 렌더 후 JS가 --barh로 알려준다) */
.gh{
  position:sticky;top:var(--barh,46px);z-index:5;
  background:var(--bg);
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 4px 7px;margin-top:6px;
  font-size:16px;font-weight:800;
  border-bottom:2px solid var(--line);
}
.gh.sub{
  font-size:13px;font-weight:700;color:var(--dim);
  padding:8px 4px 5px;margin-top:2px;
  border-bottom:1px solid var(--line);top:calc(var(--barh,46px) + 38px);z-index:4;
}
.gh .gn{display:flex;align-items:center;gap:5px;font-size:13px}
.gh .gd{
  font-size:11px;font-weight:800;color:#fff;
  padding:1px 6px;border-radius:6px;
}
.gh b{color:var(--dim);font-size:13px}
.card .mm{
  font-size:12px;color:#b45309;margin-top:5px;
  background:#fff7ed;padding:4px 7px;border-radius:6px;
}
.note{
  color:var(--o);font-size:13px;text-align:center;
  padding:9px;background:#fff7ed;border-radius:9px;margin-bottom:8px;
}

.empty{text-align:center;color:var(--dim);padding:60px 20px;font-size:14px;line-height:1.7}

/* ── 지도 마커 ── */
.pin{
  position:relative;
  display:flex;flex-direction:column;align-items:center;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.45));
}
.pin .bd{
  color:#fff;font-size:17px;font-weight:800;
  padding:8px 14px;border-radius:11px;white-space:nowrap;
  border:3px solid rgba(255,255,255,.9);
}
.pin .tip{
  width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;
  border-top:10px solid rgba(255,255,255,.9);margin-top:-1px;
}
.clu{filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));display:flex;flex-direction:column;align-items:center;}
/* [9_61] 마커 위 합계금액 — 도넛/핀 위에 작게 얹는다 */
.amt-tag{
  background:rgba(15,23,42,.86);color:#fff;
  font-size:12px;font-weight:800;line-height:1;
  padding:3px 7px;border-radius:8px;white-space:nowrap;
  margin-bottom:3px;border:1.5px solid rgba(255,255,255,.85);
}
/* [10_13] 지난 미수거 꼬리표 — 핀 색(처리 상태)은 그대로 두고 며칠 지났는지만 글자로 붙인다 */
.tags{display:flex;gap:4px;align-items:flex-start}
.day-tag{
  background:#b91c1c;color:#fff;font-size:12px;font-weight:900;line-height:1;
  padding:3px 7px;border-radius:8px;white-space:nowrap;margin-bottom:3px;border:1.5px solid #fff;
}
.card.over{background:#fff5f5}
.ctag{background:#b91c1c;color:#fff;font-size:12px;font-weight:900;border-radius:6px;padding:2px 7px;margin-right:6px;flex-shrink:0;white-space:nowrap}
.overbar{margin:8px 10px;padding:9px 12px;background:#fee2e2;color:#991b1b;font-weight:800;font-size:14px;border-radius:10px}
/* [10_13] 빼기번호 검색 */
#pp-btn{margin-left:auto;background:#fff7ed;border-color:#fdba74;color:#c2410c;padding:8px 6px}
/* 빼기 버튼이 들어가 머리줄이 좁은 폰에서 넘치지 않게 — 폭 400px 이하에서만 버튼 사이·안쪽 여백을 조금 줄인다 */
@media (max-width:400px){ #hd{gap:4px;padding-left:6px;padding-right:6px} #hd .hbtn{padding-left:6px;padding-right:6px} }
.pp-row{display:flex;gap:8px}
.pp-row input{flex:1;margin:0 !important;text-transform:uppercase;font-weight:800;letter-spacing:.5px}
.pp-row button{padding:0 16px;border-radius:10px;background:var(--blue);color:#fff;font-weight:900;font-size:15px}
.pp-hint{font-size:12px;color:var(--dim);margin:6px 2px 10px}
.pp-res{border-radius:12px;padding:12px 13px;margin-top:4px;font-size:16px;font-weight:900;line-height:1.45}
.pp-ok{background:#dcfce7;color:#166534}.pp-warn{background:#fee2e2;color:#991b1b}.pp-gray{background:#f1f5f9;color:#334155}
.pp-card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:9px;font-size:14px;font-weight:700;color:#334155;line-height:1.6;background:#fff}
.pp-card b{font-size:16px;color:#0f172a}
.pp-go{display:block;width:100%;margin-top:10px;padding:13px;border-radius:10px;background:#16a34a;color:#fff;font-size:16px;font-weight:900}
.pp-close{display:block;width:100%;margin-top:8px;padding:12px;border-radius:10px;background:#475569;color:#fff;font-size:15px;font-weight:800}
/* 개별 색 점 — 첫 화면 클러스터 숫자 원(48~64px)과 비슷한 크기로 */
.dot-wrap{display:flex;flex-direction:column;align-items:center;}
.dot{
  width:46px;height:46px;border-radius:50%;
  border:4px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:19px;font-weight:900;
}

/* [9_68] 통계 버튼 */
#stat-btn{
  position:fixed;right:16px;z-index:45;
  bottom:calc(env(safe-area-inset-bottom) + 22px);
  width:56px;height:56px;border-radius:50%;border:3px solid #fff;
  background:var(--blue,#2563eb);box-shadow:0 4px 14px rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
}
#stat-btn:active{transform:scale(.94)}

/* ── 바텀시트 ── */
#dim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:none}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:81;
  background:var(--panel);border-radius:18px 18px 0 0;
  max-height:88vh;overflow-y:auto;display:none;
  padding-bottom:calc(env(safe-area-inset-bottom) + 12px);
  -webkit-overflow-scrolling:touch;
}
#sheet.show{display:block;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.grab{width:38px;height:4px;background:var(--line);border-radius:2px;margin:9px auto 4px}
.shead{display:none}
/* [8_27] 뒤로 버튼 — 주소·이름과 같은 행, 전화버튼과 같은 초록색 */
.backbtn{
  background:var(--g);border:0;color:#fff;
  font-size:14px;font-weight:800;padding:10px 14px;border-radius:11px;
  display:flex;align-items:center;gap:4px;flex-shrink:0;white-space:nowrap;
}
.backbtn:active{filter:brightness(.92)}
.sec{padding:11px 15px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.ttl{font-size:19px;font-weight:800}
.sub{font-size:13px;color:var(--dim);margin-top:3px;line-height:1.6}
.ph{color:var(--blue);text-decoration:none;font-weight:700}

/* 상단 헤더 — 주소·이름 왼쪽, 뒤로 버튼 오른쪽 같은 행 */
.hdrow{
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
}
.hdrow .hd-text{min-width:0;flex:1}
.hdrow .adr{font-size:18px;font-weight:800;line-height:1.35;word-break:keep-all}
.hdrow .nm2{font-size:18px;font-weight:800;line-height:1.35;color:var(--dim);margin-top:1px}
.phbtn{
  margin-top:10px;background:var(--g);color:#fff;text-decoration:none;
  font-size:16px;font-weight:800;padding:11px 14px;border-radius:11px;
  white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px;
}

/* 품목 체크 */
.item{
  display:flex;align-items:center;gap:10px;
  padding:11px 10px;border-radius:10px;background:#f8fafc;
  border:2px solid var(--line);margin-bottom:7px;
}
.item.ck{border-color:var(--g);background:rgba(22,163,74,.10)}
.item.no{border-color:var(--r);background:rgba(220,38,38,.08);opacity:.9}
.item.part{border-color:var(--y);background:rgba(202,138,4,.10)}
/* [9_85] 환불된 품목 — 가져오지 않는 물건. 빨간 취소선으로 확실히 구분한다. */
.item.rf{border-color:var(--r);background:rgba(220,38,38,.06);opacity:.75}
.item.rf .bx{background:var(--r);border-color:var(--r);color:#fff}
.item.rf .nmi{text-decoration:line-through;color:var(--r)}
.item.rf .amt{text-decoration:line-through}
.item.rf .nob{background:var(--r);color:#fff}
.item.hold{border-color:var(--hold);background:rgba(147,51,234,.10);opacity:1}
.item .bx{
  width:26px;height:26px;border-radius:7px;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:900;flex-shrink:0;background:#fff;
}
.item.ck .bx{background:var(--g);border-color:var(--g);color:#fff}
.item.no .bx{background:var(--r);border-color:var(--r);color:#fff}
.item.part .bx{background:var(--y);border-color:var(--y);color:#fff}
.item.hold .bx{background:var(--hold);border-color:var(--hold);color:#fff}
.item .nmi{flex:1;font-size:15px;font-weight:700;min-width:0;word-break:keep-all}
.item.no .nmi{text-decoration:line-through}
.item .amt{font-size:13px;color:var(--dim);white-space:nowrap}
.item .nob{
  font-size:11px;font-weight:800;padding:6px 9px;border-radius:7px;
  background:#e2e8f0;color:var(--dim);white-space:nowrap;
}
.item.no .nob{background:var(--r);color:#fff}
.item.part .nob{background:var(--y);color:#fff}
.item.hold .nob{background:var(--hold);color:#fff}
/* [9_26] 개수 2개 이상인 품목의 "몇 개 수거하셨나요?" 입력칸 */
.qtybox{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0;max-width:46%;}
.qtybox .qtylabel{font-size:10px;color:var(--dim);white-space:normal;text-align:right;line-height:1.35;word-break:keep-all;margin-bottom:2px;}   /* [10_14] 긴 안내문은 줄바꿈 — 품목 이름이 세로로 찌그러지지 않게 */
.qtyinp{
  width:58px;height:34px;border:2px solid var(--line);border-radius:8px;
  font-size:16px;font-weight:800;text-align:center;font-family:inherit;
  -moz-appearance:textfield;
}
.qtyinp::-webkit-outer-spin-button,.qtyinp::-webkit-inner-spin-button{margin-left:4px;}

/* 버튼 */
.navrow{display:flex;gap:8px}
.nav{
  flex:1;padding:13px;border-radius:11px;font-size:14px;font-weight:800;
  color:#fff;text-align:center;text-decoration:none;display:block;
}
.nav.k{background:#facc15;color:#3d1d00}
.nav.n{background:#03c75a}
.act{
  width:100%;padding:15px;border-radius:12px;
  font-size:16px;font-weight:800;color:#fff;margin-top:8px;
}
.act.done{background:var(--g)}
.act.hold{background:var(--hold)}
.act.push{background:var(--blue)}
.half{display:flex;gap:8px;margin-top:8px}
.half .act{margin-top:0}

/* 상태 배너 */
.stbar{
  padding:11px 15px;font-size:14px;font-weight:800;
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
}

/* 모달 */
#modal{
  position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.6);
  display:none;align-items:center;justify-content:center;padding:20px;
}
#modal.show{display:flex}
.mbox{
  background:var(--panel);border-radius:15px;padding:18px;
  width:100%;max-width:330px;max-height:78vh;overflow-y:auto;
}
.mbox h3{margin:0 0 13px;font-size:17px}
.opt{
  display:block;width:100%;text-align:left;padding:13px 14px;
  background:#f8fafc;border:1px solid var(--line);border-radius:10px;
  color:var(--txt);font-size:15px;font-weight:700;margin-bottom:7px;
}
.opt:active,.opt.on{background:var(--blue);border-color:var(--blue);color:#fff}
.opt.sm{font-size:14px;padding:11px 13px}
/* 여러 개 고르는 칩 버튼 */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  background:#f8fafc;border:2px solid var(--line);color:var(--dim);
  border-radius:9px;padding:9px 12px;font-size:14px;font-weight:700;
  display:flex;align-items:center;gap:6px;
}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip .cnt{
  font-size:11px;font-weight:800;background:rgba(15,23,42,.08);
  padding:1px 6px;border-radius:6px;
}
#memo{
  width:100%;min-height:62px;resize:vertical;
  padding:11px;border-radius:10px;border:1px solid var(--line);
  background:#f8fafc;color:var(--txt);font-size:15px;font-family:inherit;
}
#memo:focus{outline:none;border-color:var(--blue)}

.mbox input{
  width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);
  background:#f8fafc;color:var(--txt);font-size:16px;margin-bottom:9px;
}
.mrow{display:flex;gap:8px;margin-top:5px}
.mrow button{flex:1;padding:13px;border-radius:10px;font-size:15px;font-weight:800;color:#fff}
.cancel{background:#475569}
.okb{background:var(--blue)}
.allbtn{
  background:var(--blue);color:#fff;font-size:13px;font-weight:800;
  padding:6px 13px;border-radius:9px;flex-shrink:0;
}

#toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 78px);
  transform:translateX(-50%);z-index:95;
  background:#000d;color:#fff;padding:12px 20px;border-radius:11px;
  font-size:14px;font-weight:700;display:none;max-width:86vw;text-align:center;
}
#boot{
  position:fixed;inset:0;z-index:99;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;
}
.spin{
  width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--blue);
  border-radius:50%;animation:sp .8s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<div id="hd">
  <button class="hbtn" id="btn-view" onclick="toggleView()">리스트</button>
  <button class="hbtn" id="datef" onclick="openDate()">날짜별</button>
  <button class="hbtn" id="btn-quote" onclick="toggleQuote()">견적</button>
  <button class="hbtn" id="zone" onclick="showAllWork()">전체</button>
  <button class="hbtn" id="pp-btn" onclick="openPpegiSearch()">🔍빼기</button>
  <button class="hbtn ic" id="worker" onclick="openWorker()">👤</button>
</div>
<div id="offbar"></div>

<div id="map"></div>
<div id="listview"></div>

<!-- [9_68] 통계 버튼 — 지도/리스트 위에 떠 있는 동그란 버튼 -->
<button id="stat-btn" onclick="openStats()" title="분류별 통계">
  <svg viewBox="0 0 24 24" width="28" height="28" fill="#fff">
    <rect x="3"  y="12" width="4.6" height="9"  rx="1.4"/>
    <rect x="9.7" y="6"  width="4.6" height="15" rx="1.4"/>
    <rect x="16.4" y="9"  width="4.6" height="12" rx="1.4"/>
  </svg>
</button>

<div id="dim" onclick="backFromSheet()"></div>
<div id="sheet"></div>

let customHolidays = {};
function isHolidayDate(ds){
  if (customHolidays[ds]===false) return false;
  if (customHolidays[ds]===true)  return true;
  return HOLIDAYS.includes(ds);
}
function toYMD(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
// is5 = 5단지는 토요일도 쉼
function nextWorkday(d, is5){
  let cur = new Date(d);
  for (let i=0;i<20;i++){
    const dow=cur.getDay(), ds=toYMD(cur);
    if (isHolidayDate(ds) || dow===0 || (is5 && dow===6)){ cur=addDays(cur,1); continue; }
    return cur;
  }
  return cur;
}
function daysBetween(a,b){
  const x=new Date(a+'T00:00:00'), y=new Date(b+'T00:00:00');

}

/* ══════════════════════════════════════════════════════════════
   좌표 찾기
   ── 순서가 중요하다 ──
   ① _dong 이 아파트/가락시장이면 → APT_COORDS 직행 (주소 문자열 안 봄)
   ② 그 외(잠실본동·삼전동)만 지번 주소 → 저장된 좌표 → 카카오 API
   전에 마커가 엉킨 이유는 ②를 먼저 태워서, 잠실동 313번지와
   트리지움 313동을 같은 문자열로 봤기 때문이다.
   ══════════════════════════════════════════════════════════════ */
let coordCache = {};   // Firebase work_coords — 한 번 찾은 지번은 재사용

// 아파트 주소에서 동 번호만 뽑는다 (원장 형식 전부 커버)
function dongNoOf(addr){
  const a = String(addr||'').trim().replace(/^\?+/, '');
  if (!a) return null;
  let m = a.match(/(?:^|[^\d])(\d{1,3})\s*동/);
  if (m) return m[1];
  m = a.match(/(?:^|[^\d])(\d{1,3})\s*-\s*\d+/);
  if (m) return m[1];
  m = a.match(/^(\d{1,3})$/);
  if (m) return m[1];
  m = a.match(/동\s*(\d{1,3})(?:\D|$)/);
  if (m) return m[1];
  // "5단지 520" / "트리지움 320" 단지명 뒤 숫자
  m = a.match(/(?:5\s*단지|주공|트리지움|레이크\s*팰?리스|우성\s*4차?|잠실\s*현대|삼전\s*현대|현대|우성)\s*(\d{1,3})(?:\D|$)/i);
  if (m) return m[1];
  m = a.match(/(\d{3})\s*$/);
  if (m){ const n=+m[1]; if((n>=101&&n<=135)||(n>=301&&n<=346)||(n>=501&&n<=530)) return m[1]; }
  return null;
}

// 지번 주소("본 213-36" → "서울 송파구 잠실동 213-36")
function jibunFull(r){
  const a = String(r.주소||'').trim();
  let m = a.match(/^본\s*(\d+(?:-\d+)?)/);
  if (m) return '서울 송파구 잠실동 '+m[1];
  m = a.match(/^삼\s*(\d+(?:-\d+)?)/);
  if (m) return '서울 송파구 삼전동 '+m[1];
  const dong = String(r._dong||'');
  if (/삼전/.test(dong)) return '서울 송파구 삼전동 '+a;
  if (/잠실/.test(dong)) return '서울 송파구 잠실동 '+a;
  return '서울 송파구 '+a;
}

// [9_18] 트리지움·레이크팰리스 "상가" 접수 — 주소나 비고에 '상가'가 있으면 단지 중앙(초등학교 쪽)이 아니라
//   상가 건물로 찍는다. 좌표는 카카오 장소검색으로 한 번 찾아 캐시(단지별 '상가' 한 자리)에 둔다.
const SANGGA_QUERY = {
  '트리지움':     ['트리지움상가', '잠실트리지움 상가'],
  '레이크팰리스': ['레이크팰리스상가', '잠실레이크팰리스 상가'],
};
function isSanggaRow(r){
  const d = String(r._dong||'').trim();
  if (!SANGGA_QUERY[d]) return false;
  const addr = String(r.주소||''), note = String(r.비고||'');
  if (/상가/.test(addr)) return true;                    // 주소에 상가 → 상가
  if (dongNoOf(addr)) return false;                      // 주소에 아파트 동번호가 있으면 아파트 건 (비고의 '상가 앞' 등은 무시)
  return /상가/.test(note);                              // 주소엔 동번호도 상가도 없고 비고에만 상가 → 상가
}
function coordKey(r){
  const d = String(r._dong||''), a = String(r.주소||'').trim();
  if (isSanggaRow(r)) return (d+'|상가').replace(/[.#$/\[\]]/g,'_');   // 단지별 상가 한 자리
  return (d+'|'+a).replace(/[.#$/\[\]]/g,'_');
}

// 지번 좌표를 아직 못 구한 건이 지도에서 사라지지 않도록 붙잡아둘 자리
const DONG_CENTER = {
  '잠실본동': {lat:37.5090, lng:127.0862},
  '삼전동'  : {lat:37.5030, lng:127.0910}
};
function dongCenterOf(dong){
  if (DONG_CENTER[dong]) return DONG_CENTER[dong];
  if (/삼전/.test(dong)) return DONG_CENTER['삼전동'];
  return DONG_CENTER['잠실본동'];
}

// 좌표 확정. 지번을 못 구했으면 동 중심에 ❓로라도 남긴다 (지도에서 빠지면 안 됨)
// 잠실역 5번출구 — 5단지 지하상가·5번출구 배출 시 마커 위치
const JAMSIL_EXIT5 = {lat:37.51318, lng:127.09942, exact:true, label:'잠실역5번출구'};

// [10_14] 아파트 배출위치가 신청 동과 다를 때 — 비고(배출위치) 첫 줄에서 그 단지의 동번호를 읽는다.
//   "동" 글자가 없어도 단지에 있는 세 자리 번호면 인정. 뒤에 호/원이 붙은 숫자, 더 긴 숫자의 일부는 제외.
//   번호가 둘 이상이면(○○동과 ○○동 사이) 그 동들의 가운데. 신청 동 하나뿐이면 해당 없음(null).
function emitOf(r){
  const t = APT_COORDS[String(r && r._dong || '').trim()];
  if (!t || !t.dongs) return null;
  const line = String(r.비고 || '').split('\n')[0];
  const nos = [];
  const re = /(\d+)/g; let m;
  while ((m = re.exec(line))) {
    const n = m[1];
    if (n.length !== 3) continue;
    if (/^\s*(호|원)/.test(line.slice(m.index + 3))) continue;
    if (!t.dongs[n] || nos.includes(n)) continue;
    nos.push(n);
  }
  if (!nos.length) return null;
  const own = dongNoOf(r.주소);
  if (nos.length === 1 && nos[0] === own) return null;
  const pts = nos.map(n => t.dongs[n]);
  return { nos, text: line.trim(),
           pt: { lat: pts.reduce((a,p)=>a+p.lat,0)/pts.length, lng: pts.reduce((a,p)=>a+p.lng,0)/pts.length } };
}
function resolveCoord(r){
  const dong = String(r._dong||'').trim();
  const addr = String(r.주소||'').trim();
  const note = String(r.비고||'');

  // ⓪ 5단지 + 비고에 지하상가·5번출구 → 잠실역 5번출구 마커
  if ((dong === '5단지' || /5\s*단지/.test(addr)) && /지하\s*상가|5\s*번\s*출구|5번출구/.test(note+' '+addr)) {
    return {...JAMSIL_EXIT5};
  }

  // ① 가락시장 — 동 구분이 잘못 잡혀 들어와도 주소로 알아본다.
  //    다음 우편번호는 "가락동 600"으로 주는데 예전엔 이게 잠실동으로 분류돼
  //    엉뚱한 자리에 ❓로 찍혔다.
  if (dong === '가락시장' || /가락시장|가락(?:본|\d)?동|수산시장/.test(dong+' '+addr)){
    return {...APT_COORDS['가락시장'].center, exact:true, label:'수산동'};
  }

  // ①-2 트리지움·레이크팰리스 상가 — 동번호보다 먼저 본다 (상가동은 아파트 동이 아니다)
  if (isSanggaRow(r)){
    const k = coordKey(r);
    if (coordCache[k]) return {...coordCache[k], exact:true, label:'상가'};
    return {...APT_COORDS[dong].center, exact:false, pending:true, label:'❓ '+dong+' 상가'};
  }

  // ② 아파트 — 하드코딩 테이블에서 바로
  if (APT_COORDS[dong]){
    const t = APT_COORDS[dong];
    const em = emitOf(r);   // [10_14] 배출위치에 다른 동이 적혀 있으면 그 동(들 가운데)에 찍는다
    if (em) return { ...em.pt, exact:true, label: em.nos.join('·') + '동' };
    // 주소에 동번호가 없으면 비고(상세위치)도 확인한다.
    // "115동 옆 쓰레기배출장" 처럼 동번호가 비고에만 적히는 경우가 있음(8_25 발견)
    const no = dongNoOf(addr) || dongNoOf(String(r.비고||''));
    if (no && t.dongs[no]) return {...t.dongs[no], exact:true, label:no+'동'};
    // 동 번호가 주소에 없는 건(도로명만 온 접수건 등) — 단지 중앙에 뭉개지 말고
    // 캐시된 지오코딩 결과가 있으면 그걸 쓰고, 없으면 카카오 조회 대기열로 보낸다.
    // (8_24 발견: 여기서 바로 t.center로 떨어지던 것이 레이크팰리스 2건이 겹쳐보인 원인)
    const k = coordKey(r);
    if (coordCache[k]) return {...coordCache[k], exact:true, label:addr||dong};
    return {...t.center, exact:false, pending:true, label:'❓ '+(addr||dong)};
  }

  // ③ 일반 지번 — 저장된 좌표 우선
  const k = coordKey(r);
  if (coordCache[k]) return {...coordCache[k], exact:true, label:addr};

  // ④ 아직 못 구함 — 동 중심에 모아둔다. 조회가 끝나면 제자리로 옮겨간다.
  return {...dongCenterOf(dong), exact:false, pending:true, label:'❓ '+(addr||dong)};
}

// 카카오 좌표 조회 — 지번주소로 먼저, 안 되면 장소명으로 한 번 더
async function kakaoLookup(kind, addr){
  const url = `https://dapi.kakao.com/v2/local/search/${kind}.json?query=`+encodeURIComponent(addr)+'&size=1';
  try{
    const res = await fetch(url,{headers:{Authorization:'KakaoAK '+KAKAO_REST_KEY}});
    if (!res.ok) return null;
    const j = await res.json();
    const d = j.documents && j.documents[0];
    if (!d) return null;
    const lat = +d.y, lng = +d.x;
    // 송파구 밖으로 튀는 결과는 버린다 (동명이지 오매칭 방지)
    if (lat < 37.45 || lat > 37.56 || lng < 127.03 || lng > 127.17) return null;
    return {lat, lng};
  }catch(e){ return null; }
}
async function geocode(addr){
  return (await kakaoLookup('address', addr)) || (await kakaoLookup('keyword', addr));
}

// 좌표를 못 구한 건을 남김없이 처리한다.
// 예전엔 25건에서 잘라놓고 다시 돌지 않아서, 앞쪽(잠실동)이 자리를 다 차지하면
// 뒤쪽(삼전동)은 끝내 조회되지 않았다.
let geocoding = false;
const geocodeFailed = new Set();     // 같은 주소를 무한히 재시도하지 않도록

function pendingRows(){
  return ROWS.filter(r => r._pt && r._pt.pending && !geocodeFailed.has(coordKey(r)));
}

async function fillMissingCoords(){
  if (geocoding) return;
  geocoding = true;
  try{
    let guard = 0;
    while (guard++ < 40){
      const todo = pendingRows().slice(0,20);
      if (!todo.length) break;
      const upd = {};
      for (const r of todo){
        const k = coordKey(r);
        let c = null;
        if (isSanggaRow(r)) {   // [9_18] 상가는 장소명으로 찾는다
          for (const q of SANGGA_QUERY[String(r._dong||'').trim()]) { c = await kakaoLookup('keyword', '서울 송파구 ' + q); if (c) break; }
        } else {
          c = await geocode(jibunFull(r));
        }
        // 아파트 건은 단지 중앙에서 너무 멀리 튄 결과(다른 건물로 오매칭)를 버린다
        const dong = String(r._dong||'').trim();
        if (c && APT_COORDS[dong]){
          const ctr = APT_COORDS[dong].center;
          const dLat = c.lat - ctr.lat, dLng = c.lng - ctr.lng;
          const distM = Math.sqrt(dLat*dLat + dLng*dLng) * 111000; // 대략적인 미터 환산
          if (distM > 600) c = null;
        }
        if (c){ coordCache[k] = c; upd[`${DB_COORD}/${k}`] = c; }
        else  { geocodeFailed.add(k); }
        await new Promise(s=>setTimeout(s,80));
      }
      if (Object.keys(upd).length) db.ref().update(upd).catch(()=>{});
      buildRows(); render();      // 찾은 건부터 바로 제자리로
    }
  } finally { geocoding = false; }
}

let receipts = {};        // receipt_data 전체
let PP_CACHE = null, PP_CACHE_AT = 0, PP_ROW = null;   // [10_13] 빼기번호 검색 자료
let ROWS = [];            // 화면에 쓸 작업 대상
// 담당 구역은 여러 개를 함께 고를 수 있다 (예: 5단지 + 잠실동)
let ZONES = [];
try{ ZONES = JSON.parse(localStorage.getItem('zones')||'[]'); }catch(e){ ZONES = []; }
let SHOW_QUOTE   = localStorage.getItem('show_quote') === '1';
let WORKER = localStorage.getItem('worker') || '';
let VIEW = 'map';
let TODAY = toYMD(new Date());

const APT_LIST  = ['5단지','트리지움','레이크팰리스','우성4차','잠실현대','삼전현대'];
const ZONE_LIST = ['잠실동','삼전동','가락시장', ...APT_LIST];

// 품목 목록 만들기 — _items 우선, 없으면 품목1~3
// [9_46] 환불된 품목을 수거 목록에서 제외한다.
//   원장이 일부환불을 저장하면 "품목명|금액" 문자열 목록(_item환불키)이 남는다.
//   (예전에는 자리번호 배열 _item환불을 썼는데, 원장에서 품목 순서가 바뀌면
//    엉뚱한 품목이 환불로 잡혀서 내용 기준으로 바뀌었다 — 옛 데이터도 계속 지원)
function _wkItemSig(it){ return `${(it&&it.품목)||''}|${(it&&it.금액)||''}`; }
function _wkRefundedSet(r, all){
  const set = new Set();
  const keys = Array.isArray(r && r._item환불키) ? r._item환불키 : null;
  if (!keys || !keys.length) return set;
  const remaining = keys.slice();
  all.forEach(it => {
    const pos = remaining.indexOf(_wkItemSig(it));
    if (pos !== -1) { set.add(it.idx); remaining.splice(pos, 1); }
  });
  return set;
}
function itemsOf(r){
  const rf = Array.isArray(r._item환불) ? r._item환불 : null;   // 구버전 호환
  let all;
  if (Array.isArray(r._items) && r._items.length){
    all = r._items.map((it,i)=>({
      idx:i, 품목:String(it.품목||''), 개수:String(it.개수||''), 금액:String(it.금액||'')
    })).filter(x=>x.품목);
  } else {
    all = [];
    for (let i=1;i<=10;i++){
      const nm = r['품목'+i];
      if (!nm) break;
      all.push({idx:i-1, 품목:String(nm), 개수:String(r['개수'+i]||''), 금액:String(r['금액'+i]||'')});
    }
  }
  const refunded = _wkRefundedSet(r, all);
  // [9_85] 환불된 품목도 목록에 남기되 표시만 다르게 한다(_rf) —
  //   기사가 "2개 중 1개는 환불된 거구나"를 화면에서 바로 알 수 있게.
  //   실제 수거 대상에서 빼는 일은 이 목록을 쓰는 쪽에서 _rf로 걸러낸다.
  return all.map(x => ({ ...x, _rf: refunded.has(x.idx) || !!(rf && rf[x.idx]) }));
}
// 실제로 수거해야 할 품목만 (환불 제외) — 체크·완료 판정에 쓴다
function workItemsOf(r){ return itemsOf(r).filter(x => !x._rf); }
// [9_86] 실제로 수거해서 받는 금액 — 환불된 품목은 뺀다.
//   화면의 금액·합계·통계는 전부 "오늘 실제 수거분" 기준이어야 맞다.
//   환불이 없는 건은 원장에 저장된 총금액을 그대로 쓴다(수기로 총액을 조정한 건 보존).
function workAmtOf(r){
  const items = itemsOf(r);
  const hasRefund = items.some(x => x._rf);
  if (!hasRefund) return parseInt(String(r.총금액||'').replace(/[^\d]/g,'')) || 0;
  return items.filter(x => !x._rf)
    .reduce((s,x) => s + (parseInt(String(x.금액||'').replace(/[^\d]/g,'')) || 0), 0);
}

// 상태 판정
function statusOf(r){
  const w = r._work상태;
  // 사무실에서 확인을 끝내면(_work확인) 더 이상 주황으로 두지 않는다
  // 일부수거(partial)도 메모 없으면 처리완료(회색) — 확인필요는 메모 있을 때만
  const 확인끝 = !!r._work확인;
  const 메모있음 = !!String(r._work메모||'').trim();
  const 확인필요 = (r._work확인필요 || 메모있음) && !확인끝 && 메모있음;
  if (w === 'partial') return 확인필요 ? 'o' : 'done';
  if (w === 'done')    return 확인필요 ? 'o' : 'done';
  if (w === 'hold')    return 확인필요 ? 'o' : 'done';
  if (/긴급/.test(String(r.비고||''))) return 'r';
  // [8_27] 기사앱 배지(_jiseo_app_date) 우선 — 엑셀 배지(_jiseo_date)와 분리
  const base = r._jiseo_app_date || r._jiseo_date || r.수거일자;
  if (!base) return 'g';
  const d = daysBetween(base, TODAY);
  if (d >= 7) return 'r';
  if (d >  3) return 'y';
  return 'g';
}

function zoneOf(r){
  // [8_28] _견적 플래그 또는 비고에 '견적' 표기
  if (r._견적 || /견적/.test(String(r.비고||''))) return '견적';
  const d = String(r._dong||'').trim();
  // [10_16] 특수마대 판단은 원장(isSpecialMaedae)과 똑같이 — 특수마대 표시·동 구분·품목만 본다.
  //   비고·메모는 보지 않는다(비고에 '특수마대로 배출' 같은 메모만 있는 일반 건이 앱에서 사라지던 문제).
  if (r._특수마대 === true || d === '특수마대' || ['품목1','품목2','품목3','품목4','품목5'].some(k => /특수마대/.test(String(r[k]||'')))) return '특수마대';
  if (APT_LIST.includes(d)) return d;
  if (d === '가락시장' || /가락시장|가락(?:본|\d)?동|수산시장/.test(d+' '+String(r.주소||''))) return '가락시장';
  if (/삼전/.test(d)) return '삼전동';
  return '잠실동';
}
// 특수마대·견적도 실제 위치(잠실/삼전/아파트)로 묶기 위한 지리적 구역
function geoZoneOf(r){
  const d = String(r._dong||'').trim();
  const a = String(r.주소||'').trim();
  if (APT_LIST.includes(d)) return d;
  if (APT_COORDS[d]) return d;
  // 주소에서 단지명 추출
  for (const apt of APT_LIST){
    if (a.includes(apt) || a.includes(apt.replace('레이크팰리스','레이크'))) return apt;
  }
  if (/5\s*단지|주공/.test(a)) return '5단지';
  if (/트리지움/.test(a)) return '트리지움';
  if (/레이크/.test(a)) return '레이크팰리스';
  if (/우성/.test(a)) return '우성4차';
  if (/잠실\s*현대/.test(a)) return '잠실현대';
  if (/삼전\s*현대/.test(a)) return '삼전현대';
  if (d === '가락시장' || /가락/.test(d+' '+a)) return '가락시장';
  if (/^삼\s|삼전/.test(a) || /삼전/.test(d)) return '삼전동';
  if (/^본\s/.test(a) || /잠실/.test(d)) return '잠실동';
  if (APT_LIST.includes(d)) return d;
  return '잠실동';
}

// 수거일자 필터.
// 금요일에 토·월 지시서를 함께 만들면 토요일에 월요일 건까지 뜨므로,
// 기본은 "오늘까지"로 두고 앞날 건은 감춘다.
let DATEF = localStorage.getItem('datef') || 'today';
if (DATEF === 'all') { DATEF = 'today'; try { localStorage.setItem('datef', 'today'); } catch (e) {} }   // [9_23] '전체(전부)' 보기 없앰 — 지난 건 전체는 원장에서만 본다

// 날짜값이 2026-08-04 / 2026.8.4 / 2026년 8월 4일 어느 쪽으로 와도 같게 맞춘다
function ymd(v){
  if (v == null || v === '') return '';
  if (typeof v === 'number'){                 // 엑셀 일련번호
    const d = new Date(Date.UTC(1899,11,30) + v*86400000);
    return toYMD(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  }
  const m = String(v).match(/(\d{4})\D{0,3}(\d{1,2})\D{0,3}(\d{1,2})/);
  if (!m) return '';
  return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
}
function pickupOf(r){ return ymd(r.수거일자) || ymd(r._jiseo_app_date) || ymd(r._jiseo_date); }
// [10_13] 수거일이 지난 미처리 건이면 며칠 지났는지(달력 기준), 아니면 0
function overdueDays(r){
  if (!r || r._work상태) return 0;
  const d = pickupOf(r);
  if (!d || !TODAY || d >= TODAY) return 0;
  return Math.max(1, Math.round((new Date(TODAY+'T00:00:00') - new Date(d+'T00:00:00')) / 86400000));
}
function overdueText(n){ return n === 1 ? '어제' : n + '일 전'; }

function inDate(r){
  if (DATEF === 'all')  return true;
  if (DATEF === 'done') return isTodayProcessed(r);   // [8_30] 처리내역: 오늘 처리한 건만, 당일까지만
  const d = pickupOf(r);
  if (!d) return true;                          // 날짜가 없으면 숨기지 않는다
  if (DATEF === 'today'){
    if (d >  TODAY) return false;               // 앞날 건 — 그날 오면 나타남
    if (d === TODAY) return !r._work상태;        // [8_30] 오늘 건이라도 처리했으면 "오늘 할 일"에서 빠진다 → 처리내역으로
    return !r._work상태;                        // 지난 건은 아직 손 안 댄 것만
  }
  // [9_21] 날짜 탭도 처리된 건은 뺀다 — 앱에서 완료했든 사무실에서 완료했든 똑같이. 처리된 건은 처리내역에서 본다.
  return d === DATEF && !r._work상태;
}

// [8_30] 처리내역에 남길지 판단 — 오늘 처리한 건만, 자정 지나면 화면에서 빠진다.
//   (receipts 데이터 자체는 절대 지우지 않는다 — 5년 보존 원칙 그대로. 표시만 숨김)
// [10_1] 처리내역(3일) — 오늘 포함 최근 3작업일(일요일·휴일은 건너뛰고 셈) 안에 처리한 건
function processedSince(){
  let d = new Date(TODAY + 'T00:00:00'), n = 1;
  for (let i = 0; i < 20 && n < 3; i++){
    d = addDays(d, -1);
    if (d.getDay() === 0 || isHolidayDate(toYMD(d))) continue;
    n++;
  }
  return toYMD(d);
}
function isTodayProcessed(r){
  if (!r._work상태) return false;
  const from = processedSince();
  // [9_21] 수거일이 기간 안인데 이미 처리된 건(전날 사무실에서 먼저 완료 등)도 보인다
  const p = pickupOf(r);
  if (p && p >= from && p <= TODAY) return true;
  if (!r._work일시) return false;
  const w = toYMD(new Date(r._work일시));
  return w >= from && w <= TODAY;
}

// 화면에 실제로 보일 건
// 특수마대/견적 ON → 해당 종류만 (다른 구역 숨김)
function visible(r){
  const z = zoneOf(r);
  // [9_76] 폐기물 특수마대는 야간팀이 수거하고 전송 2일 뒤 원장에서 자동 완료되므로
  //   기사앱 목록·지도에는 아예 띄우지 않는다(전송 기록은 원장에 그대로 남는다).
  if (z === '특수마대') return false;
  if (SHOW_QUOTE){
    if (z === '견적') return inDate(r);
    return false;
  }
  // [9_1 수정] 예전엔 토글이 둘 다 꺼진 기본 상태에서도 특수마대·견적 건을 무조건
  //   숨겼다 — 그래서 ①기본 화면에 특수마대/견적이 안 보이고, ②견적 건을 재전송해도
  //   견적 토글에서만 보이고 작업전체맵(기본 화면)에는 나타나지 않는 문제가 있었다.
  //   담당구역(ZONES) 필터가 없으면 inZone()이 항상 true이므로, 여기서 따로 걸러내지
  //   않아도 기본 화면엔 특수마대·견적이 포함되어 전체가 다 보인다.
  //   담당구역을 특정 지역으로 좁혔을 때는 zoneOf()가 '특수마대'/'견적'을 반환해
  //   그 구역 목록에 없으므로 inZone()이 자연스럽게 걸러준다(기존 동작 유지).
  return inZone(r) && inDate(r);
}

function inZone(r){
  if (!ZONES.length) return true;
  return ZONES.includes(zoneOf(r));
}
// [8_28] 구역 버튼(#zone) 라벨은 담당구역만 표시한다.
//   예전엔 견적/특수마대 ON 일 때 여기에도 '견적'이 떠서 상단에 견적 버튼이
//   두 개처럼 보였고, 누르면 담당구역 창이 열려 혼란을 줬다.
//   견적·특수마대 상태는 각 버튼의 .on 클래스로만 표시한다.
function zoneLabel(){
  if (!ZONES.length) return '전체';
  if (ZONES.length <= 2) return ZONES.join('+');
  return ZONES[0]+' 외 '+(ZONES.length-1);
}

// 작업 대상 = 기사앱으로 지시서 나간 건만
// [8_27] 원장 채널 분리 — 수거앱은 _jiseo_app_date 만 본다.
//   엑셀만 나간 건(_jiseo_date 만 있음)은 지도·목록에 올리지 않는다.
// [8_28 수정] 예전엔 견적(_견적) 건을 접수일자만으로도 올렸음 → 원장에서
//   「기사앱 기록만 삭제」해도 견적 토글에 이전 견적이 계속 남는 사고.
//   견적도 일반 건과 같이 _jiseo_app_date 가 있을 때만 표시한다.
function buildRows(){
  ROWS = Object.entries(receipts)
    .filter(([id,r]) => {
      if (!r) return false;
      if (r._취소) return false;   // [8_30] 전체환불 등으로 취소된 건은 아예 제외
      return !!r._jiseo_app_date;
    })
    .map(([id,r]) => {
      const o = {...r, _id:id};
      o._pt = resolveCoord(o);
      o._st = statusOf(o);
      o._zone = zoneOf(o);
      return o;
    });
}

/* ══════════════════════════════════════════════════════════════
   지도 — 3단계
   레벨 6↑  묶음 도넛(색 비율 + 총 갯수)
   레벨 4~5 아파트는 단지 하나, 나머지는 개별
   레벨 3↓  아파트 동까지 전부 개별
   ══════════════════════════════════════════════════════════════ */
let map = null, overlays = [], mapReady = false;

function initMap(){
  const c = new kakao.maps.LatLng(37.5100, 127.0950);
  map = new kakao.maps.Map(document.getElementById('map'), {center:c, level:6});
  kakao.maps.event.addListener(map,'idle', drawMap);
  mapReady = true;
  drawMap();
}

function clearOverlays(){ overlays.forEach(o=>o.setMap(null)); overlays = []; }

// 도넛 — 바깥 링이 색 비율, 안쪽에 갯수
function donut(counts, total){
  const size = total>=50?64 : total>=10?56 : 48;
  const cv = document.createElement('canvas');
  const dpr = window.devicePixelRatio||1;
  cv.width = size*dpr; cv.height = size*dpr;
  cv.style.width = size+'px'; cv.style.height = size+'px';
  const x = cv.getContext('2d');
  x.scale(dpr,dpr);
  const cx=size/2, cy=size/2, R=size/2-2, ring=Math.max(6,size*0.17);

  x.beginPath(); x.arc(cx,cy,R,0,Math.PI*2);
  x.fillStyle='rgba(15,23,42,.30)'; x.fill();

  let a = -Math.PI/2;
  const order = ['r','o','y','hold','g','done'];
  order.forEach(k=>{
    const n = counts[k]||0; if (!n) return;
    const sweep = (n/total)*Math.PI*2;
    x.beginPath();
    x.arc(cx,cy,R-ring/2,a,a+sweep);
    x.strokeStyle=C[k]; x.lineWidth=ring; x.lineCap='butt';
    x.stroke();
    a += sweep;
  });

  x.beginPath(); x.arc(cx,cy,R-ring,0,Math.PI*2);
  x.fillStyle='#fff'; x.fill();
  x.fillStyle='#0f172a';
  x.font='800 '+(total>=100?15:total>=10?17:19)+'px -apple-system,sans-serif';
  x.textAlign='center'; x.textBaseline='middle';
  x.fillText(String(total), cx, cy+0.5);

  return cv;
}

function drawMap(){
  if (!mapReady) return;
  clearOverlays();
  const lv = map.getLevel();
  const rows = ROWS.filter(r => visible(r) && r._pt);

  if (lv >= 4)      drawClusters(rows);      // 잠실·삼전 전체 ~ 삼전동 전체: 뭉침 도넛
  else              drawPins(rows, true);    // 삼전동 반만 보이는 축적부터: 아파트도 개별 동 핀

  updateHeader(rows.length);
}

// 지금 화면에서 1px이 몇 도인지 — 줌이 바뀌어도 묶음 크기가 일정하게 보이도록
function degPerPx(){
  const b = map.getBounds(), sw = b.getSouthWest(), ne = b.getNorthEast();
  const el = document.getElementById('map');
  const w = el.clientWidth || 390, h = el.clientHeight || 700;
  return { lat:(ne.getLat()-sw.getLat())/h, lng:(ne.getLng()-sw.getLng())/w };
}

// 화면상 일정 간격으로 묶어 도넛 하나로 (레벨 4↑ 공통 사용)
function drawClusters(rows){
  const d = degPerPx();
  const cLat = d.lat*95, cLng = d.lng*95;      // 95px 격자로 1차 분류
  const bins = {};
  rows.forEach(r=>{
    const k = Math.floor(r._pt.lat/cLat)+'_'+Math.floor(r._pt.lng/cLng);
    (bins[k] = bins[k] || []).push(r);
  });

  // 격자 경계를 사이에 두고 붙어버린 묶음들을 합친다 — 도넛이 서로 겹치지 않게
  let groups = Object.values(bins).map(grp=>({
    rows:grp,
    lat:grp.reduce((s,r)=>s+r._pt.lat,0)/grp.length,
    lng:grp.reduce((s,r)=>s+r._pt.lng,0)/grp.length
  })).sort((a,b)=>b.rows.length-a.rows.length);

  const merged = [];
  groups.forEach(g=>{
    const near = merged.find(m=>{
      const dy=(m.lat-g.lat)/d.lat, dx=(m.lng-g.lng)/d.lng;
      return Math.hypot(dx,dy) < 78;            // 78px 안이면 같은 묶음
    });
    if (near){
      near.rows = near.rows.concat(g.rows);
      const n = near.rows.length;
      near.lat = near.rows.reduce((s,r)=>s+r._pt.lat,0)/n;
      near.lng = near.rows.reduce((s,r)=>s+r._pt.lng,0)/n;
    } else merged.push(g);
  });

  merged.forEach(g=>{
    const counts = {};
    g.rows.forEach(r=>counts[r._st]=(counts[r._st]||0)+1);
    const box = document.createElement('div');
    box.className='clu';
    // [9_61] 뭉친 건들의 합계금액을 도넛 위에 표시
    const amt = zoneAmt(g.rows);
    if (amt) {
      const tag = document.createElement('div');
      tag.className = 'amt-tag';
      tag.textContent = amt.toLocaleString() + '원';
      box.appendChild(tag);
    }
    box.appendChild(donut(counts, g.rows.length));
    box.onclick = ()=>{
      map.setLevel(Math.max(2, map.getLevel()-2), {anchor:new kakao.maps.LatLng(g.lat,g.lng)});
    };
    const ov = new kakao.maps.CustomOverlay({
      position:new kakao.maps.LatLng(g.lat,g.lng), content:box, yAnchor:0.5, xAnchor:0.5, zIndex:3
    });
    ov.setMap(map); overlays.push(ov);
  });
}

// 라벨 짧게 — "313동"→"313", "본 213-36"→"213-36"
function shortLabel(pt){
  let s = String(pt && pt.label || '');
  if (pt && pt.pending) return '?';
  s = s.replace(/^[본삼]\s*/,'').replace(/동$/,'');
  return s.length > 8 ? s.slice(0,8) : s;
}

// 개별 핀. 멀리서는 색 점만, 가까이 오면 번호를 보여준다.
// 글자가 전부 붙어 있으면 화면이 읽히지 않는다.
function drawPins(rows, withLabel){
  const spots = {};
  rows.forEach(r=>{
    const k = r._pt.lat.toFixed(5)+'_'+r._pt.lng.toFixed(5);
    (spots[k] = spots[k] || []).push(r);
  });
  Object.values(spots).forEach(grp=>{
    const r0 = grp[0];
    const worst = ['r','o','y','hold','g','done'].find(k=>grp.some(r=>r._st===k)) || 'g';
    const box = document.createElement('div');
    const amt = zoneAmt(grp);   // [9_61] 이 지점 건들의 합계금액
    const over = Math.max(0, ...grp.map(overdueDays));   // [10_13] 이 자리에서 가장 오래 밀린 날 수
    const tagHtml = (over || amt)
      ? `<div class="tags">${over ? `<div class="day-tag">${overdueText(over)}</div>` : ''}${amt ? `<div class="amt-tag">${amt.toLocaleString()}원</div>` : ''}</div>` : '';

    if (withLabel){
      box.className = 'pin';
      const label = shortLabel(r0._pt) + (grp.length>1 ? ` ·${grp.length}` : '');
      box.innerHTML =
        tagHtml
        + `<div class="bd" style="background:${C[worst]}">${esc(label)}</div><div class="tip"></div>`;
    } else {
      box.className = 'dot-wrap';
      box.innerHTML =
        tagHtml
        + `<div class="dot" style="background:${C[worst]}">${grp.length>1 ? grp.length : ''}</div>`;
    }

    box.onclick = ()=> grp.length>1 ? openSpot(grp) : openSheet(r0._id);
    const ov = new kakao.maps.CustomOverlay({
      position:new kakao.maps.LatLng(r0._pt.lat, r0._pt.lng),
      content:box,
      yAnchor: withLabel ? 1 : 0.5, xAnchor:0.5, zIndex:5
    });
    ov.setMap(map); overlays.push(ov);
  });
}

/* ══════════════════════════════════════════════════════════════
   목록
   ══════════════════════════════════════════════════════════════ */
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,
    m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
// 이름 가운데 글자 마스킹 — "김복섭"→"김*섭", 2글자면 "김*"
function maskName(s){
  s = String(s||'').trim();
  if (s.length < 2) return s;
  if (s.length === 2) return s[0]+'*';
  return s[0] + '*'.repeat(s.length-2) + s[s.length-1];
}
function addrText(r){
  const a = String(r.주소||'').trim();
  const d = String(r._dong||'');
  if (APT_LIST.includes(d) || d==='가락시장'){
    // 주소 안에 이미 단지명이 들어있으면 중복으로 붙이지 않는다
    return a.startsWith(d) ? a : d+' '+a;
  }
  return a;
}
function itemSummary(r){
  const its = workItemsOf(r);   // [9_85] 목록 카드 요약엔 실제 수거 품목만
  if (!its.length) return '품목 없음';
  return its.map(i=>i.품목 + (i.개수 && i.개수!=='1' ? ' '+i.개수 : '')).join(', ');
}

// 목록은 작업지시서와 같은 차례로 묶는다 — 잠실동 / 삼전동 / 아파트 / 가락시장
const APT_ORDER = ['5단지','트리지움','레이크팰리스','우성4차','잠실현대','삼전현대'];

// [9_90] 목록 정렬 — 오늘 돌 순서(동선)대로 보이도록 주소 오름차순으로만 정렬한다.
//   예전엔 경과일 색(ST_RANK)으로 먼저 묶어서, 색이 바뀌는 지점마다 번지가
//   앞으로 되돌아가 동선이 끊겼다. 급한 건은 카드 왼쪽 색줄로 이미 구분된다.
//   주소는 "5단지 511-403"처럼 아파트명이 붙은 것과 "511-403"처럼 안 붙은 것이
//   섞여 있어 문자열 그대로 비교하면 순서가 뒤엉킨다 → 앞머리를 떼고 비교한다.
const ADDR_SORT_PREFIX = /^(5단지|트리지움|레이크팰리스|레이크|우성4차|잠실현대|삼전현대|가락시장|가락|본|삼)\s*/;
function addrSortKey(r){
  const k = String(r.주소 || '').trim().replace(ADDR_SORT_PREFIX, '').trim();
  const em = emitOf(r);   // [10_14] 실제로 가는 곳(배출 동, 앞 번호) 기준 — 그 동 집들 뒤에 붙는다
  return em ? `${em.nos[0]}-99999 ${k}` : k;
}
function sortRows(a,b){
  return addrSortKey(a).localeCompare(addrSortKey(b), 'ko', { numeric: true });
}

function cardHTML(r){
  const amt = workAmtOf(r);   // [9_86] 실제 수거 금액(환불 제외)
  // [9_41] 0원(무상) 건도 오른쪽 자리를 비워두지 않고 "무상"이라고 적는다.
  const amtTxt = amt ? amt.toLocaleString()+'원' : '무상';
  const over = overdueDays(r);   // [10_13] 지난 미수거 — 주소 왼쪽에 빨간 꼬리표 (순서는 그대로)
  const od = over ? (() => { const d = pickupOf(r).split('-'); return `${+d[1]}/${+d[2]}`; })() : '';
  return `<div class="card${over ? ' over' : ''}" style="border-left-color:${C[r._st]}" onclick="openSheet('${r._id}')">
      <div class="r1">
        ${over ? `<span class="ctag">${overdueText(over)} · ${od}</span>` : ''}
        ${(() => { const em = emitOf(r); return em ? `<span class="ad" style="color:#c2410c">📍${esc(em.text)}</span>` : `<span class="ad">${esc(addrText(r))}</span>`; })()}
        <span style="margin-left:auto;font-size:13px;font-weight:800;color:#334155;white-space:nowrap;flex-shrink:0;">${amtTxt}</span>
        <span class="bt" style="background:${C[r._st]};flex-shrink:0;">${ST_LABEL[r._st]}</span>
      </div>
      <div class="r1" style="margin-top:4px">
        <span class="nm">${esc(r.성명||'-')}</span>${emitOf(r) ? `<span style="font-size:13px;color:#64748b;margin-left:6px;white-space:nowrap">· 신청 ${esc(addrText(r))}</span>` : ''}
      </div>
      <div class="it">${esc(itemSummary(r))}</div>
      ${r._work메모 ? `<div class="mm">📝 ${esc(r._work메모)}</div>` : ''}
    </div>`;
}

function groupHTML(title, rows, sub, anchorId){
  if (!rows.length) return '';
  const cnt = {};
  rows.forEach(r=>cnt[r._st]=(cnt[r._st]||0)+1);
  const dots = ['r','o','y','g','done'].filter(k=>cnt[k])
    .map(k=>`<span class="gd" style="background:${C[k]}">${cnt[k]}</span>`).join('');
  const aid = anchorId || title;
  const totalAmt = rows.reduce((s,r)=>s+(parseInt(String(r.총금액||'').replace(/[^\d]/g,''))||0), 0);
  // [9_39] 이동 기준점(zsec-*)은 반드시 sticky가 아닌 별도 앵커여야 한다.
  //   구역 머리글(.gh)은 sticky라서, 화면 위에 붙어 있는 동안에는 offsetTop이
  //   "붙어 있는 위치"로 잡힌다 → 그걸 기준으로 스크롤하면 제자리에 머물러
  //   "삼전동을 눌러도 잠실동 그대로"인 문제가 났다. 높이 0짜리 앵커로 분리한다.
  return `<div id="zsec-${esc(aid)}" style="height:0;"></div>`
    + `<div class="gh ${sub?'sub':''}">
      <span>${esc(title)}</span><span class="gn"><b style="${sub?'font-size:14px;':'font-size:16px;'}color:var(--txt);font-weight:800;">${rows.length}건${totalAmt?` · ${totalAmt.toLocaleString()}원`:''}</b>${dots}</span>
    </div>` + rows.sort(sortRows).map(cardHTML).join('');
}

// 리스트 상단 구역 버튼 → 해당 구역 머리글로 스크롤
// [9_39] "아파트" 버튼 — 누르면 단지별 버튼 줄이 펼쳐지고 아파트 구역으로 이동.
//   다시 누르면 접힌다. 두 줄이 하나의 고정 상자(.jumpwrap) 안에 들어가므로
//   펼쳐도 위 줄이 절대 가려지지 않는다 → 언제든 다시 눌러 접을 수 있다.
let APT_EXPANDED = false;
function toggleAptExpand(){
  const wasExpanded = APT_EXPANDED;
  APT_EXPANDED = !APT_EXPANDED;
  renderList();
  if (!wasExpanded) jumpZone('아파트');
}

// 단지 줄 오른쪽 "위로" — 목록 맨 위로
function scrollListTop(){
  document.getElementById('listview').scrollTo({ top: 0, behavior: 'smooth' });
}

function jumpZone(key){
  const el = document.getElementById('zsec-'+key);
  if (!el){ toast('이 구역에 표시할 건이 없습니다'); return; }
  const box = document.getElementById('listview');
  const wrap = box.querySelector('.jumpwrap');
  const barH = wrap ? wrap.offsetHeight : 0;   // 고정된 버튼 상자에 가려지지 않게 그만큼 더 올린다
  let target = Math.max(0, el.offsetTop - barH - 8);

  // [9_42] 개별 아파트(하위 구역)로 갈 때는 위에 "아파트" 머리글까지 겹쳐 붙어 있어서
  //   첫 카드의 윗부분이 잘려 보였다. 실제로 얼마나 가려지는지 재서 그만큼 더 올린다.
  //   (측정용으로 잠깐 이동했다가 원위치 → 화면이 그려지기 전이라 눈에 띄지 않는다)
  const orig = box.scrollTop;
  box.scrollTop = target;
  let card = el.nextElementSibling;
  while (card && !card.classList.contains('card')) card = card.nextElementSibling;
  if (card && wrap){
    const wrapBottom = wrap.getBoundingClientRect().bottom;
    let stuckBottom = wrapBottom;
    box.querySelectorAll('.gh').forEach(g => {
      const r = g.getBoundingClientRect();
      // 화면 위쪽에 붙어 있는 머리글들의 최하단을 구한다
      if (r.top < wrapBottom + 60 && r.bottom > stuckBottom) stuckBottom = r.bottom;
    });
    const cardTop = card.getBoundingClientRect().top;
    if (cardTop < stuckBottom + 6) target = Math.max(0, target - (stuckBottom + 6 - cardTop));
  }
  box.scrollTop = orig;

  box.scrollTo({ top: target, behavior: 'smooth' });
  document.querySelectorAll('.jumpbar button').forEach(b=>{
    b.classList.toggle('on', b.dataset.z === key);
  });
}

function zoneAmt(rows){
  return rows.reduce((s,r)=>s+workAmtOf(r), 0);   // [9_86] 환불 제외
}

function renderList(){
  const rows = ROWS.filter(visible);
  const box  = document.getElementById('listview');

  if (!rows.length){
    box.innerHTML = '<div class="empty">이 구역에 작업할 건이 없습니다.<br>구역을 바꾸거나 지도를 확인하세요.</div>';
    return;
  }

  // 특수마대·견적 모드에서는 지리적 구역(geoZoneOf)으로 묶는다
  const byGeo = SHOW_QUOTE;
  // [10_16] 기본 화면에서도 견적 건은 실제 위치(아파트·동) 묶음에 넣는다 — 예전엔 '견적' 묶음이 리스트에 없어 지도에만 보였다.
  const zof = byGeo ? geoZoneOf : (r => { const z = zoneOf(r); return z === '견적' ? geoZoneOf(r) : z; });
  const pick = z => rows.filter(r=>zof(r)===z);
  const aptRows = rows.filter(r=>APT_LIST.includes(zof(r)));

  // 구역 버튼 — 건수와 그 구역 총금액을 같이 보여준다
  // [9_40] 버튼에는 이름만 — 건수·금액은 아래 구역 머리글에서 보면 되므로
  //   버튼줄이 복잡해지지 않게 뺀다.
  const zoneBtn = (label, key, list) => {
    if (!list.length) return `<button type="button" data-z="${esc(key)}" disabled style="opacity:.4;">${esc(label)}</button>`;
    return `<button type="button" data-z="${esc(key)}" onclick="jumpZone('${esc(key)}')">${esc(label)}</button>`;
  };
  const aptAmt = zoneAmt(aptRows);

  let html = '';
  html += `<div class="jumpwrap">
    <div class="jumpbar">
      ${zoneBtn('잠실동', '잠실동', pick('잠실동'))}
      ${zoneBtn('삼전동', '삼전동', pick('삼전동'))}
      <button type="button" data-z="아파트" onclick="toggleAptExpand()" class="${APT_EXPANDED?'on':''}"${aptRows.length?'':' disabled style="opacity:.4;"'}>아파트</button>
      ${zoneBtn('가락', '가락시장', pick('가락시장'))}
    </div>
    ${APT_EXPANDED && aptRows.length ? `<div class="jumpbar sub">
      ${APT_ORDER.map(a => zoneBtn(a, a, pick(a))).join('')}
      <button type="button" onclick="scrollListTop()" style="margin-left:auto;background:var(--soft);">🔝 위로</button>
    </div>` : ''}
  </div>`;

  const wait = pendingRows().length;
  if (wait) html += `<div class="note">📍 위치 확인 중 ${wait}건 — 목록에서는 그대로 처리됩니다</div>`;
  { const ov = rows.filter(r => overdueDays(r) > 0).length;   // [10_13]
    if (ov) html += `<div class="overbar">⏰ 지난 미수거 <b>${ov}건</b></div>`; }

  // 모드 제목
  if (SHOW_QUOTE) html += `<div class="gh"><span>견적</span><span class="gn"><b>${rows.length}</b></span></div>`;

  html += groupHTML('잠실동', pick('잠실동'), byGeo, '잠실동');
  html += groupHTML('삼전동', pick('삼전동'), byGeo, '삼전동');

  if (aptRows.length){
    html += `<div id="zsec-아파트" style="height:0;"></div>`;   // [9_39] 이동 앵커는 sticky가 아닌 별도 요소
    // [9_40] 아파트 총합계는 아래 개별 단지 합계와 확실히 구분되도록 제목처럼 크고 굵게
    if (!byGeo) html += `<div class="gh"><span>아파트</span><span class="gn"><b style="font-size:16px;font-weight:800;color:var(--txt);">${aptRows.length}건${aptAmt?` · ${aptAmt.toLocaleString()}원`:''}</b></span></div>`;   // [10_15] 건수 먼저
    APT_ORDER.forEach(a=>{ html += groupHTML(a, pick(a), true, a); });
  }
  html += groupHTML('가락시장', pick('가락시장'), byGeo, '가락시장');

  box.innerHTML = html;

  // [9_39] 구역 머리글(.gh)이 고정 버튼 상자 바로 아래에 붙도록 실제 높이를 알려준다.
  //   (펼침 여부·화면 폭에 따라 높이가 달라지므로 매 렌더마다 다시 잰다)
  const wrap = box.querySelector('.jumpwrap');
  if (wrap) box.style.setProperty('--barh', wrap.offsetHeight + 'px');
}

/* ══════════════════════════════════════════════════════════════
   상세 바텀시트
   ══════════════════════════════════════════════════════════════ */
let CUR = null;        // 현재 열린 건
let CHECK = {};        // [9_26] {품목index: 실제 수거한 개수(0~전체개수)} — 구버전 true/false도 읽을 때 숫자로 변환
let MEMO = '';         // 현재 건의 메모
// 보류 = 메모 + 사무실 확인필요 (품목 클릭 모달 없음 — 있음/없음 토글만)

function openSpot(grp){
  const groups = {};
  const order = [];
  grp.forEach(r=>{
    const isApt = !!APT_COORDS[r._dong];
    let key = '';
    if (isApt){
      const no = dongNoOf(r.주소);
      key = no ? no+'동' : (String(r.주소||'').trim().slice(0,14) || '동 미확인');
    }
    if (!groups[key]) { groups[key] = []; order.push(key); }
    groups[key].push(r);
  });
  order.sort((a,b)=>{
    const aNum=/^\d+동$/.test(a), bNum=/^\d+동$/.test(b);
    if (aNum&&bNum) return parseInt(a,10)-parseInt(b,10);
    if (aNum) return -1; if (bNum) return 1;
    return a.localeCompare(b,'ko');
  });
  const body = order.map(key=>{
    const rows = groups[key].map(r=>{
      const no = dongNoOf(r.주소);
      const dongLabel = no ? no+'동' : (String(r.주소||'').trim().slice(0,12)||'-');
      return `<button class="opt sm" onclick="closeModal();openSheet('${r._id}')">
       <span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${C[r._st]};margin-right:7px"></span>
       <span style="color:var(--dim);font-weight:700;margin-right:4px">${esc(dongLabel)}</span>
       ${esc(r.성명||'-')} · ${esc(itemSummary(r)).slice(0,18)}</button>`;
    }).join('');
    if (!key) return rows;
    return `<div style="font-size:13px;font-weight:800;color:var(--dim);margin:10px 0 4px 2px">${esc(key)} · ${groups[key].length}건</div>` + rows;
  }).join('');
  showModal(`<h3>이 위치 ${grp.length}건</h3>` + body +
    `<div class="mrow"><button class="cancel" onclick="closeModal()">닫기</button></div>`);
}

// [9_26] 품목의 "전체 개수"(개수 칸이 비어있거나 1이면 1개로 본다)
// [9_28] 개수가 "개수" 필드가 아니라 품목명 끝의 원문자(①②..)로만 표시된 경우가 있다
//   (구청/빼기 파싱건 등) — 그 경우도 실제 전체 개수로 인식해야 숫자입력칸이 뜬다.
const CIRCLED_NUMS_WK = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
function itemFullCount(it){
  const fromField = parseInt(it && it.개수) || 0;
  if (fromField > 0) return fromField;
  const nm = String((it && it.품목) || '');
  const lastCh = nm.slice(-1);
  const ci = CIRCLED_NUMS_WK.indexOf(lastCh);
  if (ci >= 0) return ci + 1;
  const m = nm.match(/\((\d+)\)$/);
  if (m) return parseInt(m[1], 10) || 1;
  return 1;
}

let BASELINE = {};
let SHEET_VIA_PP = null;   // [10_15] 빼기 검색으로 연 건의 id (닫으면 지움)   // [9_27] 재작업 시 "이전 라운드까지 이미 수거된 개수" — 이번 라운드는 나머지만 다룬다

function openSheet(id){
  const r = (PP_ROW && PP_ROW._id === id && PP_ROW._rework) ? PP_ROW   // [10_14] 빼기 검색 → 미수거 처리건 다시 수거
          : (ROWS.find(x=>x._id===id) || (PP_ROW && PP_ROW._id === id ? PP_ROW : null));   // [10_13] 빼기 검색으로 찾은 건(목록에 없는 건)도 연다
  if (!r) return;
  CUR = r;
  CHECK = {};
  BASELINE = {};
  MEMO = String(r._work메모||'');
  const its = workItemsOf(r);   // [9_85] 환불 품목은 체크 대상에서 제외
  its.forEach(i => {
    const full = itemFullCount(i);
    let base = 0;
    // [9_27] 재작업 건 — 지금 이 건이 "처리 안 된 상태로 새로 전송"됐는데(=_work상태 없음)
    //   _work품목에 예전 라운드 숫자가 남아있으면, 그게 "이미 수거한 개수"다.
    //   재전송(editResendAppOnly)이 _work상태만 지우고 _work품목은 남겨두기 때문에 가능하다.
    if (!r._work상태 && Array.isArray(r._work품목)) {
      const v = r._work품목[i.idx];
      if (typeof v === 'number' && v > 0) base = Math.min(v, full);   // [9_22] 전부 가져간 품목(v=full)도 이전 라운드 수거로 본다
      else if (v === true) base = full;   // 구버전 호환 — 이미 다 가져간 걸로 본다
    }
    BASELINE[i.idx] = base;
    CHECK[i.idx] = full;   // 기본값: 이번 라운드에 남은 걸 전부 수거(=전체)
  });
  // 이번 라운드에 이미 처리 기록이 있으면(=r._work상태 done/partial) 그 값 그대로 되살린다
  // — 이 경우는 재작업이 아니라 "방금 처리한 걸 다시 열어본 것"이라 baseline 없이 그대로.
  if (r._work상태 && Array.isArray(r._work품목)){
    r._work품목.forEach((v,i)=>{
      if (v === null || v === undefined) return;
      if (v === false) { CHECK[i] = 0; return; }        // 구버전: 없음
      if (v === true)  return;                          // 구버전: 있음(=전체) — 위에서 이미 꽉 찬 값
      if (typeof v === 'number') CHECK[i] = v;           // 신버전: 실제 수거 개수
    });
  }
  drawSheet();
  document.getElementById('dim').style.display='block';
  document.getElementById('sheet').classList.add('show');
  history.pushState({sheet:true}, '');
}

function closeSheet(){
  if (PP_ROW && PP_ROW._rework) PP_ROW._rework = false;   // [10_14] 다음에 목록에서 열면 평소대로
  document.getElementById('dim').style.display='none';
  document.getElementById('sheet').classList.remove('show');
  CUR = null;
  SHEET_VIA_PP = null;
}
// 뒤로 버튼·dim 클릭은 history.back()을 태워서 하드웨어 뒤로가기와 동작을 통일한다
function backFromSheet(){
  if (history.state && history.state.sheet) history.back();
  else closeSheet();
}

// 있음 ↔ 없음 단순 토글(탭 한 번으로 "이번 라운드 전체"/0을 오간다). 개수 2개 이상인
// 품목은 이걸로 빠르게 전체/0을 오가고, 정확한 부분 수량은 아래 숫자칸으로 따로 입력한다.
function toggleItem(idx){
  MEMO = readMemo();
  const it = CUR ? itemsOf(CUR).find(i=>i.idx===idx) : null;
  if (!it || it._rf) { drawSheet(); return; }   // [9_85] 환불된 품목은 손댈 수 없다
  const full = itemFullCount(it);
  const base = BASELINE[idx] || 0;
  if (base >= full) { drawSheet(); return; }     // [9_22] 재작업 — 지난번에 이미 다 가져간 품목은 잠금
  const cur  = CHECK[idx] || 0;
  CHECK[idx] = (cur > base) ? base : full;   // "이번엔 0개" ↔ "이번엔 남은 거 전부"
  drawSheet();
}
// [9_26][9_27] 숫자칸에 입력한 "이번 라운드 수거 개수"(0~남은개수)를 누적값으로 환산해 반영
function setItemQty(idx, val, remainFull, base){
  let n = parseInt(val);
  if (isNaN(n)) n = 0;
  n = Math.max(0, Math.min(remainFull, n));
  CHECK[idx] = base + n;
  drawSheet();
}

function drawSheet(){
  const r = CUR; if (!r) return;
  const its = itemsOf(r);
  const pt = r._pt;
  const done = r._work상태;
  const total = String(workAmtOf(r) || '');   // [9_86] 실제 수거 금액

  const statusBar = done ? `
    <div class="stbar" style="background:${C[r._st]}22;border-bottom:1px solid var(--line)">
      <span style="color:${C[r._st]}">● ${ST_LABEL[r._st]}</span>
      <span style="color:var(--dim);font-weight:600;font-size:13px">
        ${esc(r._work수거원||'')} ${r._work일시 ? new Date(r._work일시).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : ''}
      </span>
    </div>` : '';

  document.getElementById('sheet').innerHTML = `
    <div class="grab"></div>
    ${statusBar}
    <div class="sec">
      <div class="hdrow">
        <div class="hd-text">
          ${(() => { const em = emitOf(r); return em
            ? `<div class="adr" style="color:#c2410c">📍${esc(em.text)}</div><div class="nm2">${esc(maskName(r.성명))} <span style="font-size:13px;color:#64748b">· 신청 ${esc(addrText(r))}</span></div>`
            : `<div class="adr">${esc(addrText(r))}</div><div class="nm2">${esc(maskName(r.성명))}</div>`; })()}
        </div>
        <button type="button" class="backbtn" onclick="backFromSheet()">← 뒤로</button>
      </div>
      ${r.전화번호 ? `<a class="phbtn" href="tel:${esc(r.전화번호)}">📞 ${esc(r.전화번호)}</a>` : ''}
      ${(() => { const em = emitOf(r); const nt = em ? String(r.비고||'').split('\n').slice(1).join(' ').replace(/^\((빼|인)\)$/, '').trim() : String(r.비고||'');   // [10_14] 배출위치는 위 제목으로 올라감 — 나머지 줄만
        return nt ? `<div style="margin-top:7px;color:#b45309;font-size:13px">📝 ${esc(nt)}</div>` : ''; })()}
    </div>

    <div class="sec">
      <div style="font-size:13px;color:var(--dim);margin-bottom:9px;font-weight:700">
        품목 ${its.filter(x=>!x._rf).length}개${(()=>{ /* [9_15] 무상 품목 제외는 '취소', 유상은 '환불'로 나눠 적는다 */
          const isFree = x => !(parseInt(String(x.금액||'').replace(/[^0-9]/g,''))||0);
          const rfN = its.filter(x=>x._rf && !isFree(x)).length, cnN = its.filter(x=>x._rf && isFree(x)).length;
          const p=[]; if(rfN) p.push(`환불 ${rfN}개`); if(cnN) p.push(`취소 ${cnN}개`);
          return p.length ? ` <span style="color:var(--r)">· ${p.join(' · ')} 제외</span>` : ''; })()}${done ? ' · 처리된 건입니다' : ' · 탭하면 있음/없음이 바뀝니다 (개수가 여럿이면 숫자로 직접 입력)'}
      </div>
      ${its.map(i=>{
        const full = itemFullCount(i);
        // [9_85] 환불된 품목 — 가져오지 않는 물건이므로 빨간 취소선으로만 보여주고
        //   체크·수량입력은 막는다(실수로 실어오지 않게).
        if (i._rf) {
          return `
        <div class="item rf">
          <div class="bx">↩</div>
          <div class="nmi">${esc(i.품목)}${full > 1 ? ` <span style="font-size:13px">${full}개</span>` : ''}</div>
          <div class="amt">${esc(i.금액||'')}</div>
          <div class="nob">${(parseInt(String(i.금액||'').replace(/[^0-9]/g,''))||0) ? '환불' : '취소'}</div>
        </div>`;
        }
        // [9_21] 처리된 건: 탭·수량입력 없이 결과만 — ✅ 수거완료 / 미수거 / n/m개 수거
        if (done) {
          const got = Math.max(0, Math.min(full, CHECK[i.idx] ?? full));
          const lab = got >= full ? '✅ 수거완료' : (got <= 0 ? '미수거' : `${got}/${full}개 수거`);
          const col = got >= full ? 'var(--g)' : (got <= 0 ? 'var(--r)' : 'var(--o)');
          const cls2 = got >= full ? 'ck' : (got <= 0 ? 'no' : 'part');
          return `
        <div class="item ${cls2}" style="cursor:default;">
          <div class="bx">${got >= full ? '✓' : (got <= 0 ? '✕' : '△')}</div>
          <div class="nmi">${esc(i.품목)}${full > 1 ? ` <span style="color:var(--dim);font-size:13px">${full}개</span>` : ''}</div>
          <div class="amt">${esc(i.금액||'')}</div>
          <div class="nob" style="background:transparent;color:${col};font-weight:900;white-space:nowrap;">${lab}</div>
        </div>`;
        }
        const base = BASELINE[i.idx] || 0;
        // [9_22] 재작업 건에서 지난번에 이미 다 가져간 품목 — 회색으로 잠가 "수거완료"만 보여준다
        if (!done && base >= full) {
          return `
        <div class="item ck" style="cursor:default;opacity:.6;">
          <div class="bx">✓</div>
          <div class="nmi">${esc(i.품목)}${full > 1 ? ` <span style="color:var(--dim);font-size:13px">${full}개</span>` : ''}</div>
          <div class="amt">${esc(i.금액||'')}</div>
          <div class="nob" style="background:transparent;color:var(--g);font-weight:900;white-space:nowrap;">지난번 수거완료</div>
        </div>`;
        }
        const remainFull = full - base;                 // [9_27] 이번 라운드에 남은 개수
        const cum  = CHECK[i.idx] ?? full;               // 누적(=지금까지 전부) 수거 개수
        const val  = Math.max(0, cum - base);            // 이번 라운드 수거 개수(표시용)
        const cls  = val <= 0 ? 'no' : (val >= remainFull ? 'ck' : 'part');
        const boxTxt = val <= 0 ? '✕' : (val >= remainFull ? '✓' : '△');
        const nobTxt = val <= 0 ? '없음' : (val >= remainFull ? '있음' : `${val}/${remainFull}개`);
        const countTag = base > 0 ? `${remainFull}개 남음(총 ${full}개)` : (full > 1 ? `${full}개` : '');
        const qtyLabel = base > 0
          ? `총 ${full}개 중 ${base}개는 이미 수거함 · 남은 ${remainFull}개 중 몇 개 수거하셨나요?`
          : '몇 개 수거하셨나요?';
        // 개수 1개 품목이거나, 재작업이라 남은 게 1개뿐이면: 기존처럼 행 전체 탭으로 있음/없음만.
        // 남은 개수가 2개 이상이면: 탭은 빠른 전체/0 전환용으로 두고, 정확한 수량은 숫자칸으로 입력.
        return `
        <div class="item ${cls}">
          <div class="bx" onclick="toggleItem(${i.idx})">${boxTxt}</div>
          <div class="nmi" onclick="toggleItem(${i.idx})">${esc(i.품목)}${countTag ? ` <span style="color:var(--dim);font-size:13px">${countTag}</span>`:''}</div>
          <div class="amt">${esc(i.금액||'')}</div>
          ${remainFull > 1
            ? `<div class="qtybox" onclick="event.stopPropagation()">
                 <span class="qtylabel">${qtyLabel}</span>
                 <input type="number" inputmode="numeric" min="0" max="${remainFull}" value="${val}" class="qtyinp"
                   onchange="setItemQty(${i.idx}, this.value, ${remainFull}, ${base})"
                   onclick="event.stopPropagation()">
               </div>`
            : `<div class="nob" onclick="toggleItem(${i.idx})">${nobTxt}</div>`}
        </div>`;
      }).join('') || '<div style="color:var(--dim);font-size:14px">등록된 품목이 없습니다</div>'}
      ${total ? `<div style="text-align:right;font-size:14px;font-weight:800;margin-top:7px">합계 ${(+total).toLocaleString()}원</div>` : ''}
    </div>

    <div class="sec">
      <div style="font-size:13px;color:var(--dim);font-weight:700;margin-bottom:8px">📝 메모 — 사무실로 전달됩니다</div>
      <div class="chips" style="margin-bottom:8px">
        ${['품목 더 나옴','차량 막힘','품목이 다름','구분 불가'].map(t=>
          `<button class="chip" onclick="addMemo('${t}')">${t}</button>`).join('')}
      </div>
      <textarea id="memo" placeholder="직접 입력">${esc(MEMO)}</textarea>
    </div>

    <div class="sec">
      ${pt && pt.pending ? `<div style="color:var(--o);font-size:13px;margin-bottom:9px">
         📍 정확한 위치를 찾는 중입니다 — 지도 핀은 동 중심에 표시됩니다</div>` : ''}
      <div class="navrow">
        <a class="nav k" onclick="goNavi('kakao')">카카오내비</a>
        <a class="nav n" onclick="goNavi('naver')">네이버지도</a>
      </div>
    </div>

    <div class="sec">
      ${r._work상태
        ? `<button class="act" style="background:#f59e0b;color:#fff;" onclick="undoFinishWork()">🔄 완료 취소 — 다시 미완료로</button>
           <div style="font-size:12px;color:var(--dim);text-align:center;margin-top:4px;">전체 초기화, 단 재작업 건은 이번 처리만</div>`
        : `<button class="act done" onclick="finishWork()">✅ 작업완료</button>
      ${r._jiseo_app_date ? `<button class="act push" onclick="askPush()">📅 미루기 — 다음 작업일로</button>` : ''}`}
    </div>`;
}

// [9_33] 실수로 "작업완료"를 눌러버린 경우 — 그 자리에서 바로 미완료 상태로 되돌린다.
//   Firebase 실시간 반영이라 원장(디지털원장)에도, 다른 기사 화면에도 즉시 "미처리"로
//   다시 뜬다. _work품목까지 전부 지워서 완전히 처음 상태로 돌아간다(재작업 이어하기가
//   아니라 "안 누른 걸로 하기"이므로 이전 라운드 개수를 남길 이유가 없다).
function undoFinishWork(){
  const r = CUR; if (!r) return;
  if (!r._work상태) { toast('이미 미완료 상태입니다'); return; }
  const when = r._work일시 ? new Date(r._work일시).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
  // [10_15] 재작업 회차(사무실 재작업 전송 / 빼기 검색 재수거)는 이번 처리만 되돌리고 지난번 수거 기록은 남긴다.
  //   처음 처리한 건은 예전처럼 전체 초기화.
  const snap = r._work되돌림;
  const roundOnly = !!(snap && snap.at && snap.at === r._work일시);
  if (!confirm(roundOnly
      ? `이번 처리만 취소합니다. 지난번 수거 기록은 그대로 남습니다.${when?`\n(이번 처리 시각: ${when})`:''}\n\n계속할까요?`
      : `완료 처리를 취소하고 다시 미완료 상태로 되돌립니다.${when?`\n(처리 시각: ${when})`:''}\n\n계속할까요?`)) return;
  const patch = roundOnly ? {
    _work상태: snap.상태 || null, _work일시: snap.일시 || null, _work수거원: snap.수거원 || null,
    _work품목: snap.품목 || null, _work미수거: snap.미수거 || null, _work메모: snap.메모 || null,
    _work이전: snap.이전 || null,
    _work확인필요: null, _work확인: null, _work보류: null, _work보류사유: null,
    _work경로: null, _work되돌림: null,
  } : {
    _work상태: null, _work일시: null, _work수거원: null, _work품목: null,
    _work미수거: null, _work메모: null, _work확인필요: null, _work확인: null,
    _work보류: null, _work보류사유: null,
    _work경로: null, _work되돌림: null,
  };
  const u = {};
  Object.entries(patch).forEach(([k,v]) => { u[`${DB_RECEIPT}/${r._id}/${k}`] = v; });
  applyLocal(r._id, patch);
  saveWork(u);
  closeSheet();
  toast('✅ 완료 취소했습니다 — 다시 미완료로 표시됩니다');
}

// 빠른 문구 — 이어 붙이고 커서는 맨 뒤로
function addMemo(t){
  const el = document.getElementById('memo');
  MEMO = (el.value||'').trim();
  MEMO = MEMO ? (MEMO.includes(t) ? MEMO : MEMO+', '+t) : t;
  el.value = MEMO;
  el.focus(); el.setSelectionRange(el.value.length, el.value.length);
}
function readMemo(){
  const el = document.getElementById('memo');
  return el ? (el.value||'').trim() : MEMO;
}

/* ══════════════════════════════════════════════════════════════
   네비게이션 — 앱이 있으면 앱, 없으면 웹으로
   ══════════════════════════════════════════════════════════════ */
function goNavi(kind){
  const r = CUR; if (!r || !r._pt) return;
  const {lat,lng} = r._pt;
  const nm = (addrText(r)||'수거지').replace(/,/g,' ');
  let scheme, web;
  if (kind==='kakao'){
    scheme = `kakaomap://route?ep=${lat},${lng}&by=CAR`;
    web    = `https://map.kakao.com/link/to/${encodeURIComponent(nm)},${lat},${lng}`;
  } else {
    scheme = `nmap://route/car?dlat=${lat}&dlng=${lng}&dname=${encodeURIComponent(nm)}&appname=work.app`;
    web    = `https://map.naver.com/p/directions/-/${lng},${lat},${encodeURIComponent(nm)}/-/car`;
  }
  const t = setTimeout(()=>{ window.open(web,'_blank'); }, 1200);
  window.addEventListener('pagehide', ()=>clearTimeout(t), {once:true});
  location.href = scheme;
}

/* ══════════════════════════════════════════════════════════════
   저장 — 오프라인이면 쌓아두고 연결되면 자동으로 올린다
   ══════════════════════════════════════════════════════════════ */
const QKEY = 'pending_work';
function queue(){ try{ return JSON.parse(localStorage.getItem(QKEY)||'[]'); }catch(e){ return []; } }
function setQueue(q){ localStorage.setItem(QKEY, JSON.stringify(q)); showOffbar(); }

function showOffbar(){
  const n = queue().length;
  const bar = document.getElementById('offbar');
  if (!n){ bar.style.display='none'; return; }
  bar.style.display='block';
  bar.textContent = navigator.onLine
    ? `⏳ ${n}건 올리는 중…`
    : `📴 오프라인 · ${n}건 저장됨 (연결되면 자동 전송)`;
}

// 실제 쓰기. 실패하면 큐로
function saveWork(updates){
  const q = queue();
  q.push({updates, at:Date.now()});
  setQueue(q);
  flushQueue();
}

let flushing = false;
async function flushQueue(){
  if (flushing || !navigator.onLine) return;
  flushing = true;
  let q = queue();
  while (q.length){
    const job = q[0];
    try{
      await db.ref().update(job.updates);
      q.shift(); setQueue(q);
    }catch(e){
      break;   // 연결이 끊긴 것 — 다음 기회에
    }
    q = queue();
  }
  flushing = false;
  showOffbar();
}
window.addEventListener('online', ()=>{ showOffbar(); flushQueue(); });
window.addEventListener('offline', showOffbar);
setInterval(flushQueue, 15000);

// [8_30] 자정을 넘기면 TODAY를 갱신하고 화면을 다시 그린다 — 새 데이터가
//   안 들어와도(밤새 앱을 켜둔 채로 방치) 처리내역이 자동으로 비워지도록.
function refreshTodayIfChanged(){
  const now = toYMD(new Date());
  if (now !== TODAY){
    TODAY = now;
    buildRows(); render();
  }
}
setInterval(refreshTodayIfChanged, 60000);

// [9_7] 종료하지 않고 화면만 꺼둔(잠금·백그라운드) 채 방치한 경우 —
//   모바일 브라우저가 그동안 타이머·소켓을 절전 상태로 멈춰서, 화면을 다시 켜도
//   실제로는 최대 60초(위 setInterval 주기)까지 어제 상태가 그대로 보일 수 있고,
//   드물게는 Firebase 재연결이 늦어져 그보다 더 걸릴 수 있다.
//   → 화면이 다시 보이는 순간 날짜를 즉시 재확인하고, Firebase 연결도 한 번
//     끊었다 붙여서 새 데이터를 바로 당겨오게 한다.
function onAppVisible(){
  refreshTodayIfChanged();
  if (typeof db !== 'undefined' && DATA_Q && maybeForceRefresh()) return;   // [10_15] 하루 두 번 새로받기
  try{
    db.goOffline();
    db.goOnline();      // 재연결을 강제해 절전 중 놓친 변경분을 즉시 다시 받는다
  }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{ if (!document.hidden) onAppVisible(); });
window.addEventListener('focus', onAppVisible);
window.addEventListener('pageshow', onAppVisible);   // 일부 모바일 브라우저는 focus 없이 pageshow만 쏨

/* ══════════════════════════════════════════════════════════════
   작업 처리
   ══════════════════════════════════════════════════════════════ */
function requireWorker(){
  if (WORKER) return true;
  openWorker();
  toast('먼저 수거원을 선택하세요');
  return false;
}

// [9_18] 메모가 있는 채로 작업완료를 누르면 먼저 "실제로 수거했는지"를 묻는다.
//   - 수거했음  → 지금까지처럼 품목 확인 후 완료 처리 (메모 있으니 사무실 확인필요)
//   - 수거 안 함 → 상태는 미처리 그대로 두고 메모만 저장 (오늘 할 일에 그대로 남는다)
//   메모가 없으면 묻지 않고 종전 흐름 그대로.
function finishWork(){
  if (!requireWorker()) return;
  const r = CUR; if (!r) return;
  if (readMemo() && !finishWork._skipAsk) {
    showModal(`
      <h3>실제로 수거하셨나요?</h3>
      <div style="font-size:13px;color:var(--dim);margin:-4px 0 12px">메모가 적혀 있습니다. 수거 여부에 따라 처리가 달라집니다.</div>
      <button class="opt on" onclick="closeModal();finishWorkConfirmed()">✅ 수거했음 — 품목 확인 후 완료</button>
      <button class="opt" onclick="closeModal();saveMemoOnly()">📝 수거 안 함 — 메모만 저장 (미처리 유지)</button>
      <div class="mrow"><button class="cancel" onclick="closeModal()">취소</button></div>`);
    return;
  }
  finishWork._skipAsk = false;
  const its  = workItemsOf(r);   // [9_85] 환불 품목 제외 — 수거 판정 대상만
  // [9_26] 이제 CHECK는 "몇 개 수거했는지" 숫자다 — 전체 개수보다 모자라면 miss.
  const fullyMiss  = its.filter(i => (CHECK[i.idx]||0) <= 0);
  const partialHit = its.filter(i => { const c=CHECK[i.idx]||0, f=itemFullCount(i); return c>0 && c<f; });
  const miss = its.filter(i => (CHECK[i.idx]||0) < itemFullCount(i));   // 완전미수거+부분미수거 합
  const memo = readMemo();
  const partial = miss.length > 0;

  let msg;
  if (fullyMiss.length && fullyMiss.length === its.length)
    msg = '품목이 전부 없습니다.\n처리완료로 저장됩니다. (메모 있으면 확인필요)';
  else if (partial) {
    const lines = [];
    if (fullyMiss.length)  lines.push(fullyMiss.map(i=>i.품목).join(', ') + ' 없음');
    if (partialHit.length) lines.push(partialHit.map(i=>{
      const base = BASELINE[i.idx] || 0;
      const full = itemFullCount(i);
      const remainFull = full - base;
      const thisRound = Math.max(0, (CHECK[i.idx]||0) - base);
      return base > 0
        ? `${i.품목} (남은 ${remainFull}개 중 ${thisRound}개만)`
        : `${i.품목} ${full}개 중 ${CHECK[i.idx]}개만`;
    }).join(', '));
    msg = lines.join('\n') + '\n나머지는 수거로 처리합니다.';
  }
  else
    msg = `전체 ${its.length}개 품목 수거 완료로 처리합니다.`;
  if (memo) msg += `\n\n메모: ${memo}`;
  if (!confirm(msg)) return;

  const st = partial ? 'partial' : 'done';
  // 원본 _items 인덱스 유지 (환불 자리 포함) — 원장 itemStatusOf 매칭용
  const totalLen = Math.max(
    Array.isArray(r._items) ? r._items.length : 0,
    (() => { let n=0; for(let i=1;i<=10;i++){ if(!r['품목'+i]) break; n=i; } return n; })()
  );
  const items = new Array(totalLen).fill(null);
  its.forEach(i => { items[i.idx] = CHECK[i.idx] != null ? CHECK[i.idx] : 0; });   // [9_26] 실제 수거 개수(숫자)로 저장
  // 환불 자리: 0 유지 (수거 아님)
  const rf = Array.isArray(r._item환불) ? r._item환불 : null;
  if (rf) rf.forEach((v,i)=>{ if (v) items[i] = 0; });
  // 확인필요 = 메모 있을 때만 (일부수거만으로는 처리완료)
  const need = !!memo;
  const now = Date.now();
  // [10_15] 재작업 회차인지 — 빼기 검색으로 다시 수거(지난번 처리 기록 있음) / 사무실 재작업 전송(지난번 개수·기록이 남아 있음)
  const viaPp = SHEET_VIA_PP === r._id;
  const ppPrev = (viaPp && r._rework && r._ppPrev && r._ppPrev.상태) ? r._ppPrev : null;
  const baseAny = Object.values(BASELINE).some(v => v > 0);
  const isRework = !!ppPrev || baseAny || !!r._work이전;
  const undoSnap = isRework ? {
    at: now,
    상태: ppPrev ? ppPrev.상태 : null,
    일시: ppPrev ? ppPrev.일시 : null,
    수거원: ppPrev ? ppPrev.수거원 : null,
    미수거: ppPrev ? ppPrev.미수거 : null,
    메모: ppPrev ? ppPrev.메모 : null,
    품목: ppPrev ? ppPrev.품목 : (Array.isArray(r._work품목) ? r._work품목 : null),
    이전: ppPrev ? (ppPrev.이전 || null) : (r._work이전 || null),
  } : null;
  const patch = {
    _work상태:st, _work일시:now, _work수거원:WORKER, _work품목:items,
    _work경로: viaPp ? '빼기검색' : null,
    _work되돌림: undoSnap,
    _work보류: null,
    _work보류사유: null,
    _work미수거: miss.map(i => {
      const c = CHECK[i.idx]||0, f = itemFullCount(i);
      return c<=0 ? i.품목 : `${i.품목}(${f-c}개 부족)`;
    }).join(', ') || null,
    _work메모: memo || null,
    _work확인필요: need ? true : null,
    _work확인: need ? null : undefined
  };
  // 빼기 검색으로 다시 수거한 건 — 지난번 처리 기록을 "지난번"으로 남긴다(원장 수거상태 칸 ↩ 지난번 줄)
  if (ppPrev) patch._work이전 = { 일시: ppPrev.일시 || null, 수거원: ppPrev.수거원 || '', 미수거: ppPrev.미수거 || '', 상태: ppPrev.상태 || '' };
  const u = {};
  Object.entries(patch).forEach(([k,v])=>{
    if (v !== undefined) u[`${DB_RECEIPT}/${r._id}/${k}`] = v;
  });

  applyLocal(r._id, patch);
  saveWork(u);
  closeSheet();
  toast(need ? '🟠 메모 있음 — 사무실 확인 필요' : (partial ? '✅ 일부수거 처리완료' : '✅ 수거완료'));
}

// [9_18] "수거했음"을 고른 경우 — 묻지 않고 종전 완료 흐름으로
function finishWorkConfirmed(){ finishWork._skipAsk = true; finishWork(); }

// [9_18] "수거 안 함" — 품목·상태는 그대로 두고 메모만 저장한다.
//   _work상태를 건드리지 않으므로 이 건은 오늘 할 일에 그대로 남고,
//   원장 접수목록에는 미처리인데 메모가 붙은 건으로 보인다.
function saveMemoOnly(){
  const r = CUR; if (!r) return;
  const memo = readMemo();
  if (!memo) { toast('메모를 적어 주세요'); return; }
  const note = `${TODAY} ${WORKER} ${memo}`;
  const patch = { _work메모: note, _work확인필요: true };
  const u = {};
  Object.entries(patch).forEach(([k,v]) => { u[`${DB_RECEIPT}/${r._id}/${k}`] = v; });
  applyLocal(r._id, patch);
  saveWork(u);
  closeSheet();
  toast('📝 메모 저장 — 수거는 미처리로 남습니다');
}

// 미루기 — 다음 작업일로 수거일자·작업지시일을 함께 옮긴다
function askPush(){
  if (!requireWorker()) return;
  const r = CUR; if (!r || !r._jiseo_app_date) return;   // [10_13] 전송전 건(빼기 검색으로 연 건)은 미루기 없음 — 사무실 전송을 거치지 않게
  const is5 = String(r._dong||'')==='5단지';
  const nd  = toYMD(nextWorkday(addDays(new Date(),1), is5));
  const d2  = toYMD(nextWorkday(addDays(new Date(nd+'T00:00:00'),1), is5));
  const fmt = s=>{
    const dd=new Date(s+'T00:00:00');
    return `${dd.getMonth()+1}월 ${dd.getDate()}일(${'일월화수목금토'[dd.getDay()]})`;
  };
  showModal(`
    <h3>언제로 미룰까요</h3>
    <button class="opt on" onclick="doPush('${nd}')">다음 작업일 · ${fmt(nd)}</button>
    <button class="opt" onclick="doPush('${d2}')">그 다음 · ${fmt(d2)}</button>
    <div style="font-size:12px;color:var(--dim);margin:10px 0 6px">직접 고르기</div>
    <input type="date" id="pushdate" min="${TODAY}" value="${nd}">
    <div class="mrow">
      <button class="cancel" onclick="closeModal()">취소</button>
      <button class="okb" onclick="doPush(document.getElementById('pushdate').value)">이 날짜로</button>
    </div>`);
}

function doPush(date){
  const r = CUR; if (!r || !date) return;
  closeModal();
  const u = {};
  // [8_27] 수거일자 + 기사앱 배지(_jiseo_app_date)를 같이 옮긴다.
  //   엑셀 배지(_jiseo_date)는 원장 엑셀 채널이므로 여기서 건드리지 않는다.
  u[`${DB_RECEIPT}/${r._id}/수거일자`]        = date;
  u[`${DB_RECEIPT}/${r._id}/_jiseo_app_date`] = date;
  // [9_18] 미루기는 날짜만 옮기고 작업 흔적은 남기지 않는다 — 미룬 날 그 건은 아무 표시 없이 처음 상태로.
  //   예전 라운드의 _work품목이 남아 있으면 수거앱이 그걸 "이미 수거함"으로 보고 품목을 잠그고(회색 완료),
  //   원장 품목 옆에도 완료가 찍혔다 → 미루기 때 같이 비운다.
  u[`${DB_RECEIPT}/${r._id}/_work상태`]       = null;
  u[`${DB_RECEIPT}/${r._id}/_work품목`]       = null;
  u[`${DB_RECEIPT}/${r._id}/_work일시`]       = null;
  u[`${DB_RECEIPT}/${r._id}/_work수거원`]     = null;
  u[`${DB_RECEIPT}/${r._id}/_work미수거`]     = null;
  u[`${DB_RECEIPT}/${r._id}/_work보류`]       = null;
  u[`${DB_RECEIPT}/${r._id}/_work보류사유`]   = null;
  u[`${DB_RECEIPT}/${r._id}/_work미룸`]       = (r._work미룸||0)+1;
  const memo = readMemo();
  const note = (memo ? memo+' / ' : '') + `${TODAY} ${WORKER} 미룸 → ${date}`;
  u[`${DB_RECEIPT}/${r._id}/_work메모`]       = note;
  u[`${DB_RECEIPT}/${r._id}/_work확인필요`]   = memo ? true : null;

  applyLocal(r._id, {수거일자:date,_jiseo_app_date:date,
                     _work상태:null,_work품목:null,_work일시:null,_work수거원:null,
                     _work미수거:null,_work보류:null,_work보류사유:null,
                     _work미룸:(r._work미룸||0)+1,_work메모:note,
                     _work확인필요: memo ? true : null});
  saveWork(u);
  pushToJiseo(r, date);
  closeSheet();
  const dd=new Date(date+'T00:00:00');
  toast(`📅 ${dd.getMonth()+1}/${dd.getDate()} 작업지시서로 옮김`);
}

// 미룬 건을 그 날짜 작업지시서에도 넣어둔다 (원장앱 지시서 구조 그대로)
function pushToJiseo(r, date){
  const dong  = r._dong || '잠실본동';
  const sheet = (dong==='5단지'||dong==='트리지움'||dong==='레이크팰리스') ? '아파트' : dong;
  const row   = {...r, 수거일자:date};
  delete row._id; delete row._pt; delete row._st; delete row._zone;
  const path = (sheet==='아파트')
    ? `${DB_JISEO}/${date}/아파트/${dong}`
    : `${DB_JISEO}/${date}/${sheet}`;
  db.ref(path).once('value').then(s=>{
    const arr = s.val() || [];
    const list = Array.isArray(arr) ? arr : Object.values(arr);
    const dup = list.some(x => x && x.성명===r.성명 && x.주소===r.주소);
    if (!dup){ list.push(row); db.ref(path).set(list).catch(()=>{}); }
  }).catch(()=>{});
}

// 화면을 먼저 바꿔준다 — 오프라인이어도 즉시 반영된 것처럼 보이게
function applyLocal(id, patch){
  if (receipts[id]) Object.assign(receipts[id], patch);
  if (PP_CACHE && PP_CACHE[id]) Object.assign(PP_CACHE[id], patch);   // [10_13] 빼기 검색 자료도 같이 맞춘다
  if (PP_ROW && PP_ROW._id === id) Object.assign(PP_ROW, patch);
  buildRows(); render();
}
