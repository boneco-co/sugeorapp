<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="수거앱">
<meta name="theme-color" content="#1a56db">
<title>수거 작업 앱</title>
<script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=b8908c96799936ef733a0445f1bd6abc&libraries=services,clusterer"></script>
<style>
:root{
  --blue:#1a56db;--blue-d:#1344b8;--blue-l:#e8f0fe;
  --red:#dc2626;--red-l:#fee2e2;
  --yellow:#d97706;--yellow-l:#fef3c7;
  --green:#16a34a;--green-l:#dcfce7;
  --purple:#7c3aed;--purple-l:#ede9fe;
  --gray:#6b7280;--gray-l:#f3f4f6;
  --text:#111827;--text2:#6b7280;
  --white:#fff;--bg:#f0f4f8;--border:#e5e7eb;
  --font:'Noto Sans KR',-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--text);}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

/* ── 헤더 ── */
.hdr{background:var(--blue);padding:max(14px,env(safe-area-inset-top)) 14px 10px;flex-shrink:0;}
.hdr-row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.hdr-title{font-size:19px;font-weight:700;color:#fff;}
.hdr-stats{display:flex;gap:7px;}
.stat{background:rgba(255,255,255,.18);border-radius:10px;padding:5px 12px;text-align:center;}
.stat-n{font-size:20px;font-weight:900;color:#fff;line-height:1;}
.stat-l{font-size:10px;color:rgba(255,255,255,.8);margin-top:1px;}

/* 필터 버튼 */
.filter-row{display:flex;gap:6px;}
.fb{flex:1;padding:10px 6px;border-radius:11px;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);font-family:var(--font);font-size:13px;font-weight:700;color:rgba(255,255,255,.8);cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .15s;}
.fb .fi{font-size:18px;}
.fb.on-all{background:#fff;border-color:#fff;color:var(--blue);}
.fb.on-heavy{background:var(--red);border-color:var(--red);color:#fff;}
.fb.on-light{background:var(--green);border-color:var(--green);color:#fff;}
.fb:active{transform:scale(.95);}

/* ── 뷰 토글 ── */
.view-toggle{display:flex;background:rgba(255,255,255,.15);border-radius:10px;padding:3px;margin-top:8px;}
.vt-btn{flex:1;padding:7px;border-radius:8px;border:none;font-family:var(--font);font-size:12px;font-weight:700;color:rgba(255,255,255,.7);background:transparent;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:5px;}
.vt-btn.on{background:#fff;color:var(--blue);}

/* ── 콘텐츠 ── */
.content{flex:1;overflow:hidden;position:relative;}
.view{position:absolute;inset:0;display:none;flex-direction:column;}
.view.on{display:flex;}

/* ── 리스트 뷰 ── */
.list-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.list-scroll::-webkit-scrollbar{display:none;}

/* 민원 배너 */
.complaint-banner{background:var(--red);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.cb-icon{font-size:22px;}
.cb-text{font-size:13px;font-weight:700;}
.cb-sub{font-size:11px;opacity:.85;margin-top:1px;}

/* 동/단지 그룹 헤더 */
.group-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px 6px;background:var(--bg);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;
}
.gh-left{display:flex;align-items:center;gap:8px;}
.gh-area{font-size:15px;font-weight:700;}
.gh-cnt{font-size:11px;background:var(--blue-l);color:var(--blue);padding:2px 8px;border-radius:10px;font-weight:700;}
.gh-amt{font-size:12px;color:var(--text2);font-family:monospace;}

/* 리스트 행 */
.list-row{
  background:var(--white);border-bottom:1px solid var(--border);
  padding:12px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;
  transition:background .1s;
}
.list-row:active{background:var(--blue-l);}
.list-row.complaint-row{border-left:4px solid var(--red);}
.list-row.rollover-row{border-left:4px solid var(--purple);}

/* 경과일 도트 */
.day-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}

.lr-main{flex:1;min-width:0;}
.lr-top{display:flex;align-items:center;gap:7px;margin-bottom:3px;flex-wrap:wrap;}
.lr-name{font-size:16px;font-weight:700;}
.lr-source{font-size:10px;background:var(--gray-l);color:var(--gray);padding:1px 6px;border-radius:8px;font-weight:600;}
.lr-item{font-size:13px;color:var(--text2);}
.lr-addr{font-size:12px;color:var(--text2);margin-top:2px;}
.lr-right{text-align:right;flex-shrink:0;}
.lr-amt{font-size:14px;font-weight:700;color:var(--blue);font-family:monospace;}
.lr-day{font-size:10px;font-weight:700;margin-top:2px;}
.lr-arrow{font-size:18px;color:var(--gray);margin-left:4px;}

/* ── 지도 뷰 ── */
.map-view{position:relative;flex:1;}
#kakao-map{width:100%;height:100%;}

.map-legend{position:absolute;bottom:16px;left:12px;background:rgba(255,255,255,.96);border-radius:12px;padding:10px 14px;box-shadow:0 2px 12px rgba(0,0,0,.15);font-size:12px;z-index:10;}
.lg-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.lg-row:last-child{margin-bottom:0;}
.lg-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}

.map-zoom{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;z-index:10;}
.zoom-btn{width:42px;height:42px;background:#fff;border-radius:10px;border:1px solid var(--border);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.12);font-weight:700;color:var(--text);}
.zoom-btn:active{background:var(--blue-l);}

/* ── 상세 화면 (슬라이드 오버) ── */
.detail-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;
  display:none;align-items:flex-end;
  backdrop-filter:blur(3px);
}
.detail-overlay.on{display:flex;animation:su .25s ease;}
@keyframes su{from{opacity:0}to{opacity:1}}

.detail-sheet{
  background:var(--white);border-radius:24px 24px 0 0;width:100%;
  max-height:92vh;overflow-y:auto;
  padding:0 0 max(30px,env(safe-area-inset-bottom));
}
.ds-handle-wrap{padding:12px 0 0;text-align:center;}
.ds-handle{width:40px;height:4px;background:var(--border);border-radius:2px;display:inline-block;}

/* 상세 헤더 */
.ds-hdr{padding:12px 16px 14px;border-bottom:1px solid var(--border);}
.ds-hdr-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;}
.ds-name{font-size:22px;font-weight:900;}
.ds-close{background:none;border:none;color:var(--gray);font-size:22px;cursor:pointer;padding:2px;}
.ds-item{font-size:16px;font-weight:700;color:var(--blue);margin-bottom:5px;}
.ds-addr{font-size:14px;color:var(--text2);line-height:1.5;}

/* 상세 메타 */
.ds-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.ds-tag{font-size:11px;padding:3px 9px;border-radius:10px;font-weight:700;}
.dt-source{background:var(--gray-l);color:var(--gray);}
.dt-day-ok{background:var(--green-l);color:var(--green);}
.dt-day-warn{background:var(--yellow-l);color:var(--yellow);}
.dt-day-urgent{background:var(--red-l);color:var(--red);}
.dt-complaint{background:var(--red);color:#fff;}
.dt-rollover{background:var(--purple-l);color:var(--purple);}
.dt-grade-a{background:var(--red-l);color:var(--red);}
.dt-grade-b{background:var(--yellow-l);color:var(--yellow);}
.dt-grade-c{background:var(--green-l);color:var(--green);}

/* 상세 메모 */
.ds-memo{background:var(--gray-l);border-radius:10px;padding:10px 14px;margin:12px 16px;font-size:14px;color:var(--text2);line-height:1.5;}

/* 민원 경고 */
.ds-complaint{background:var(--red);color:#fff;margin:0 16px 12px;border-radius:10px;padding:12px 14px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;}

/* 길찾기 버튼 */
.ds-navi{width:calc(100% - 32px);margin:0 16px 10px;padding:15px;border-radius:12px;border:none;background:var(--blue);color:#fff;font-family:var(--font);font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;}
.ds-navi:active{background:var(--blue-d);}

/* 결과 버튼 */
.ds-res{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 16px 10px;}
.rb{padding:13px 5px;border-radius:12px;border:2px solid;font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;user-select:none;-webkit-user-select:none;position:relative;overflow:hidden;}
.rb .ri{font-size:22px;}
.rb .hint{font-size:10px;opacity:.65;}
.rb-done{background:var(--green-l);border-color:var(--green);color:var(--green);}
.rb-partial{background:var(--yellow-l);border-color:var(--yellow);color:var(--yellow);}
.rb-absent{background:var(--red-l);border-color:var(--red);color:var(--red);}
.rb .pp{position:absolute;bottom:0;left:0;height:4px;background:currentColor;width:0%;transition:width 2s linear;opacity:.4;}
.rb.pressing .pp{width:100%;}

.ds-delay{width:calc(100% - 32px);margin:0 16px;padding:12px;border-radius:12px;border:2px solid var(--border);background:var(--gray-l);color:var(--gray);font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}

/* ── 모달 (사진/이월) ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);}
.overlay.on{display:flex;animation:su .25s ease;}
.msheet{background:var(--white);border-radius:24px 24px 0 0;width:100%;max-height:85vh;overflow-y:auto;padding:18px 16px max(30px,env(safe-area-inset-bottom));}
.mhandle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px;}
.mtitle{font-size:20px;font-weight:700;margin-bottom:4px;}
.mitem{font-size:15px;color:var(--blue);font-weight:600;margin-bottom:14px;}
.photo-zone{border:3px dashed var(--border);border-radius:16px;padding:22px;text-align:center;margin-bottom:14px;cursor:pointer;background:var(--gray-l);transition:all .2s;}
.photo-zone.ok{border-color:var(--green);border-style:solid;background:var(--green-l);}
.pz-icon{font-size:36px;margin-bottom:6px;}
.pz-text{font-size:16px;font-weight:700;color:var(--text2);}
.pz-sub{font-size:13px;color:var(--text2);margin-top:3px;}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;justify-content:center;}
.thumb{width:65px;height:65px;border-radius:10px;background:var(--white);border:2px solid var(--green);display:flex;align-items:center;justify-content:center;font-size:26px;}
.delay-info{background:var(--yellow-l);border-radius:12px;padding:14px;margin-bottom:14px;}
.di-label{font-size:13px;font-weight:700;color:var(--yellow);margin-bottom:5px;}
.di-date{font-size:22px;font-weight:900;color:var(--yellow);}
.di-reason{font-size:12px;color:var(--yellow);margin-top:4px;opacity:.85;}
.mwarn{background:var(--red-l);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--red);font-weight:600;margin-bottom:12px;display:none;}
.mwarn.on{display:block;}
.mconfirm{width:100%;padding:17px;border-radius:14px;border:none;font-family:var(--font);font-size:17px;font-weight:700;cursor:pointer;margin-top:6px;}
.mc-partial{background:var(--yellow);color:#fff;}
.mc-absent{background:var(--red);color:#fff;}
.mc-delay{background:var(--gray);color:#fff;}

/* 핀 시트 */
.pin-sheet{position:absolute;bottom:0;left:0;right:0;z-index:20;background:var(--white);border-radius:20px 20px 0 0;padding:14px 16px max(20px,env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.15);transform:translateY(100%);transition:transform .3s ease;}
.pin-sheet.open{transform:translateY(0);}
.pin-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 12px;}
.ps-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.ps-name{font-size:18px;font-weight:900;}
.ps-close{background:none;border:none;color:var(--gray);font-size:20px;cursor:pointer;}
.ps-item{font-size:14px;color:var(--blue);font-weight:600;margin-bottom:4px;}
.ps-addr{font-size:13px;color:var(--text2);margin-bottom:12px;}
.ps-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.ps-btn{padding:12px;border-radius:10px;border:none;font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;}
.ps-navi{background:var(--blue);color:#fff;}
.ps-detail{background:var(--gray-l);border:1.5px solid var(--border);color:var(--text);}

/* 토스트 */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 20px;border-radius:12px;font-size:15px;font-weight:600;z-index:999;display:none;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.3);}
</style>
</head>
<body>
<div class="app">

  <!-- 헤더 -->
  <div class="hdr">
    <div class="hdr-row1">
      <div class="hdr-title">🚛 오늘 수거 작업</div>
      <div class="hdr-stats">
        <div class="stat"><div class="stat-n" id="s-remain">0</div><div class="stat-l">남은 건</div></div>
        <div class="stat"><div class="stat-n" id="s-done">0</div><div class="stat-l">완료</div></div>
      </div>
    </div>
    <div class="filter-row">
      <button class="fb on-all" id="fb-all"   onclick="setFilter('all')">  <span class="fi">📋</span>전체</button>
      <button class="fb"        id="fb-heavy" onclick="setFilter('heavy')"><span class="fi">🧊</span>무거운 것</button>
      <button class="fb"        id="fb-light" onclick="setFilter('light')"><span class="fi">🪑</span>가벼운 것</button>
    </div>
    <div class="view-toggle">
      <button class="vt-btn on" id="vt-list" onclick="goView('list')">📋 목록</button>
      <button class="vt-btn"    id="vt-map"  onclick="goView('map')">🗺 지도</button>
    </div>
  </div>

  <!-- 콘텐츠 -->
  <div class="content">

    <!-- 리스트 뷰 -->
    <div class="view on" id="view-list">
      <div id="complaint-banner" style="display:none;" class="complaint-banner">
        <div class="cb-icon">🚨</div>
        <div><div class="cb-text" id="complaint-text"></div><div class="cb-sub">상세 탭하여 확인</div></div>
      </div>
      <div class="list-scroll" id="list-scroll"></div>
    </div>

    <!-- 지도 뷰 -->
    <div class="view" id="view-map">
      <div class="map-view">
        <div id="kakao-map"></div>
        <div class="map-zoom">
          <button class="zoom-btn" onclick="zoomMap(1)">＋</button>
          <button class="zoom-btn" onclick="zoomMap(-1)">－</button>
        </div>
        <div class="map-legend">
          <div style="font-size:10px;font-weight:700;color:var(--text2);margin-bottom:5px;">경과일</div>
          <div class="lg-row"><div class="lg-dot" style="background:#16a34a"></div> D+1 오늘</div>
          <div class="lg-row"><div class="lg-dot" style="background:#d97706"></div> D+2 주의</div>
          <div class="lg-row"><div class="lg-dot" style="background:#dc2626"></div> D+3↑ 긴급/민원</div>
          <div class="lg-row"><div class="lg-dot" style="background:#7c3aed"></div> 이월</div>
        </div>
        <!-- 핀 클릭 시트 -->
        <div class="pin-sheet" id="pin-sheet">
          <div class="pin-handle"></div>
          <div class="ps-row">
            <div>
              <div class="ps-name" id="ps-name"></div>
              <div class="ps-item" id="ps-item"></div>
              <div class="ps-addr" id="ps-addr"></div>
            </div>
            <button class="ps-close" onclick="closePinSheet()">✕</button>
          </div>
          <div class="ps-btns">
            <button class="ps-btn ps-navi" id="ps-navi-btn">🗺 길찾기</button>
            <button class="ps-btn ps-detail" onclick="openDetailFromPin()">📋 상세 보기</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 상세 오버레이 -->
<div class="detail-overlay" id="detail-overlay">
  <div class="detail-sheet" id="detail-sheet">
    <div class="ds-handle-wrap"><div class="ds-handle"></div></div>
    <div class="ds-hdr">
      <div class="ds-hdr-top">
        <div>
          <div class="ds-name" id="ds-name"></div>
        </div>
        <button class="ds-close" onclick="closeDetail()">✕</button>
      </div>
      <div class="ds-item" id="ds-item"></div>
      <div class="ds-addr" id="ds-addr"></div>
      <div class="ds-meta" id="ds-meta"></div>
    </div>
    <div class="ds-complaint" id="ds-complaint" style="display:none">
      <span>🚨</span><span>민원 건 — 각별히 주의 · 처리 후 사무실 보고</span>
    </div>
    <div class="ds-memo" id="ds-memo" style="display:none"></div>
    <button class="ds-navi" id="ds-navi-btn">🗺 카카오맵으로 길찾기</button>
    <div class="ds-res">
      <button class="rb rb-done" id="ds-done-btn"
        onpointerdown="startPress(this)" onpointerup="cancelPress()" onpointerleave="cancelPress()">
        <span class="ri">✅</span><span>완료</span><span class="hint">2초 길게</span>
        <div class="pp"></div>
      </button>
      <button class="rb rb-partial" onclick="openModal('partial')">
        <span class="ri">📦</span><span>일부만</span><span class="hint">있음</span>
        <div class="pp"></div>
      </button>
      <button class="rb rb-absent" onclick="openModal('absent')">
        <span class="ri">❌</span><span>물건</span><span class="hint">없음</span>
        <div class="pp"></div>
      </button>
    </div>
    <button class="ds-delay" onclick="openModal('delay')">📅 내일로 미루기</button>
  </div>
</div>

<!-- 부분수거 모달 -->
<div class="overlay" id="ov-partial">
  <div class="msheet">
    <div class="mhandle"></div>
    <div class="mtitle">📦 일부만 있음</div>
    <div class="mitem" id="mp-item"></div>
    <div class="photo-zone" id="mp-zone" onclick="takePhoto('partial')">
      <div class="pz-icon">📷</div><div class="pz-text">현장 사진 촬영 (필수)</div>
      <div class="pz-sub">탭하여 사진 찍기</div><div class="thumbs" id="mp-thumbs"></div>
    </div>
    <div class="mwarn" id="mp-warn">📸 사진을 먼저 찍어주세요</div>
    <button class="mconfirm mc-partial" onclick="confirmModal('partial')">📦 일부 수거 확정 → 사무실 전송</button>
  </div>
</div>

<!-- 물건없음 모달 -->
<div class="overlay" id="ov-absent">
  <div class="msheet">
    <div class="mhandle"></div>
    <div class="mtitle">❌ 물건이 없음</div>
    <div class="mitem" id="ma-item"></div>
    <div style="background:var(--red-l);border-radius:12px;padding:12px;font-size:14px;color:var(--red);margin-bottom:14px;line-height:1.6;">현장 바닥 사진을 찍어주세요.<br>사무실에 바로 전송됩니다.</div>
    <div class="photo-zone" id="ma-zone" onclick="takePhoto('absent')">
      <div class="pz-icon">📷</div><div class="pz-text">현장 증빙 사진 (필수)</div>

function isHoliday(d){return CONFIG.holidays.includes(fmt(d));}
function isWorkday(d){return d.getDay()!==0&&!(isHoliday(d)&&!CONFIG.holidayWork);}
function nextWorkday(from){const d=new Date(from);d.setDate(d.getDate()+1);while(!isWorkday(d))d.setDate(d.getDate()+1);return d;}
function calcDelay(job){
  const today=new Date();
  if(job.addr.includes('5단지')||job.addr.includes('주공')){
    const d=new Date(today);d.setDate(d.getDate()+1);
    while(d.getDay()!==1)d.setDate(d.getDate()+1);
    while(!isWorkday(d))d.setDate(d.getDate()+7);
    return{date:d,reason:'잠실주공 5단지 — 월요일 수거 원칙'};
  }
  const next=nextWorkday(today);const dow=today.getDay();
  return{date:next,reason:dow===5?'금요일 → 월요일 이월':dow===6?'토요일 → 월요일 이월':'익일 수거'};
}
function fmt(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function fmtKr(d){const W=['일','월','화','수','목','금','토'];return`${d.getMonth()+1}월 ${d.getDate()}일 (${W[d.getDay()]}요일)`;}

function getDays(paidDate){if(!paidDate)return 0;return Math.floor((new Date()-new Date(paidDate))/(1000*60*60*24));}
function getPinColor(job){
  if(job.complaint)return'#dc2626';
  if(job.rollover) return'#7c3aed';
  const d=getDays(job.paidDate);
  return d>=3?'#dc2626':d>=2?'#d97706':'#16a34a';
}
function getDayTag(job){
  if(job.complaint)return{cls:'dt-complaint',txt:'🚨 민원'};
  if(job.rollover) return{cls:'dt-rollover',txt:'🔴 이월'};
  const d=getDays(job.paidDate);
  if(d>=3)return{cls:'dt-day-urgent',txt:`D+${d} 🚨`};
  if(d>=2)return{cls:'dt-day-warn',  txt:`D+${d} ⚠️`};
  return{cls:'dt-day-ok',txt:'D+1 오늘'};
}

function resolveAptCoord(addr){
  // 트리지움/레이크팰리스/잠실주공 APT_COORDS 조회
  for(const [aptName,dongMap] of Object.entries(APT_COORDS)){
    if(addr.includes(aptName)){
      const m=addr.match(/(\d{2,3})동/);
      if(m&&dongMap[m[1]+'동']) return dongMap[m[1]+'동'];
      return APT_CENTER[aptName];
    }
  }
  if(addr.includes('주공')||addr.includes('5단지')){
    const m=addr.match(/(\d{3})동/);
    if(m&&APT_COORDS['잠실주공'][m[1]+'동']) return APT_COORDS['잠실주공'][m[1]+'동'];
    return APT_CENTER['잠실주공'];
  }
  return null; // 일반 주소 → 지오코딩 필요
}

// 카카오 지오코딩 (Promise 래퍼)
function geocodeAddr(addr){
  return new Promise(resolve=>{
    const gc=new kakao.maps.services.Geocoder();
    // 송파구 prefix 붙여서 정확도 향상
    const query = addr.includes('송파')||addr.includes('잠실')||addr.includes('삼전')||addr.includes('방이')||addr.includes('문정')
      ? '서울 송파구 '+addr
      : addr;
    gc.addressSearch(query,(result,status)=>{
      if(status===kakao.maps.services.Status.OK&&result.length>0){
        resolve({lat:parseFloat(result[0].y),lng:parseFloat(result[0].x)});
      } else {
        // 좌표검색으로 재시도
        gc.coord2Address && resolve(null);
        resolve(null);
      }
    });
  });
}

const COORD_CACHE_KEY='sugeor_coords_v1';
function loadCoordCache(){try{return JSON.parse(localStorage.getItem(COORD_CACHE_KEY)||'{}');}catch{return{};}}
function saveCoordCache(cache){try{localStorage.setItem(COORD_CACHE_KEY,JSON.stringify(cache));}catch{}}

let JOBS=[];
let coordCache=loadCoordCache();

// 모든 주소 지오코딩 후 JOBS 초기화
async function initJobs(){
  const raw=RAW_DATA
    .filter(j=>!CONFIG.wrongAreas.some(kw=>j.addr.includes(kw)))
    .filter(j=>!MAEDE.some(k=>j.item.includes(k)));

  // 배치 지오코딩 (아파트는 즉시, 일반주소는 API)
  for(const j of raw){
    // 1. 아파트 → APT_COORDS 즉시
    const aptCoord=resolveAptCoord(j.addr);
    if(aptCoord){
      j.lat=aptCoord.lat; j.lng=aptCoord.lng;
      continue;
    }
    // 2. 캐시 확인
    if(coordCache[j.addr]){
      j.lat=coordCache[j.addr].lat; j.lng=coordCache[j.addr].lng;
      continue;
    }
    // 3. 카카오 지오코딩
    const coord=await geocodeAddr(j.addr);
    if(coord){
      j.lat=coord.lat; j.lng=coord.lng;
      coordCache[j.addr]=coord;
    }
  }
  saveCoordCache(coordCache);

  JOBS=raw.map(j=>({
    ...j,
    grade:getGrade(j.item),
    done:false,result:null,
    area:getArea({addr:j.addr}),
    lat:j.lat||null,
    lng:j.lng||null,
  }));
}

function setFilter(f){
  curFilter=f;
  document.getElementById('fb-all').className='fb'+(f==='all'?' on-all':'');
  document.getElementById('fb-heavy').className='fb'+(f==='heavy'?' on-heavy':'');
  document.getElementById('fb-light').className='fb'+(f==='light'?' on-light':'');
  renderList();if(kakaoMap)renderPins();
}
function filteredJobs(){
  const a=JOBS.filter(j=>!j.done);
  if(curFilter==='heavy')return a.filter(j=>j.grade==='A');
  if(curFilter==='light')return a.filter(j=>j.grade==='C');
  return a;
}

// ══ 뷰 전환 ══
function goView(v){
  curView=v;
  document.getElementById('vt-list').classList.toggle('on',v==='list');
  document.getElementById('vt-map').classList.toggle('on',v==='map');
  document.getElementById('view-list').classList.toggle('on',v==='list');
  document.getElementById('view-map').classList.toggle('on',v==='map');
  if(v==='map'){if(typeof kakao!=='undefined'&&kakao.maps)initMap();else setTimeout(initMap,600);}
}

// ══ 리스트 렌더 (동/단지별 그룹) ══
function renderList(){
  const scroll=document.getElementById('list-scroll');
  const list=filteredJobs();
  const done=JOBS.filter(j=>j.done);
  // 민원 배너
  const complaints=list.filter(j=>j.complaint);
  const banner=document.getElementById('complaint-banner');
  if(complaints.length){
    banner.style.display='flex';
    document.getElementById('complaint-text').textContent=`민원 건 ${complaints.length}건 — ${complaints.map(c=>c.name+'님').join(' · ')}`;
  } else banner.style.display='none';
  if(!list.length&&!done.length){
    scroll.innerHTML='<div style="text-align:center;padding:60px 20px;"><div style="font-size:48px;margin-bottom:12px">🎉</div><div style="font-size:22px;font-weight:700;color:var(--green)">오늘 작업 완료!</div></div>';
    updateStats();return;
  }
  // 그룹핑: 민원→이월→동/단지별
  const grouped={};
  list.forEach(j=>{
    const key=j.complaint?'🚨 민원':j.rollover?'🔴 이월':j.area;
    if(!grouped[key])grouped[key]=[];
    grouped[key].push(j);
  });
  // 정렬: 민원, 이월 먼저 → 나머지 알파벳순
  const order=['🚨 민원','🔴 이월'];
  const keys=[...order.filter(k=>grouped[k]),...Object.keys(grouped).filter(k=>!order.includes(k)).sort()];
  let html='';
  keys.forEach(key=>{
    const group=grouped[key];
    const totalAmt=group.reduce((s,j)=>s+j.amount,0);
    const bgColor=key==='🚨 민원'?'#fee2e2':key==='🔴 이월'?'#ede9fe':'var(--bg)';
    html+=`<div class="group-hdr" style="background:${bgColor};">
      <div class="gh-left"><span class="gh-area">${key}</span><span class="gh-cnt">${group.length}건</span></div>
      <span class="gh-amt">${totalAmt.toLocaleString()}원</span>
    </div>`;
    group.forEach(j=>{
      const dayTag=getDayTag(j);
      const dotColor=getPinColor(j);
      const rowCls=j.complaint?'list-row complaint-row':j.rollover?'list-row rollover-row':'list-row';
      html+=`<div class="${rowCls}" onclick="openDetail('${j.id}')">
        <div class="day-dot" style="background:${dotColor}"></div>
        <div class="lr-main">
          <div class="lr-top"><span class="lr-name">${j.name}</span><span class="lr-source">${SOURCE_TAG[j.source]||''}</span></div>
          <div class="lr-item">${j.item}</div>
          <div class="lr-addr">📍 ${j.addr}</div>
        </div>
        <div class="lr-right">
          <div class="lr-amt">${j.amount.toLocaleString()}원</div>
          <div class="lr-day" style="color:${dotColor}">${dayTag.txt}</div>
        </div>
        <div class="lr-arrow">›</div>
      </div>`;
    });
  });
  // 완료 건
  if(done.length){
    html+=`<div class="group-hdr"><div class="gh-left"><span class="gh-area">✅ 완료</span><span class="gh-cnt">${done.length}건</span></div></div>`;
    done.forEach(j=>{
      html+=`<div class="list-row" style="opacity:.5;">
        <div class="day-dot" style="background:#6b7280"></div>
        <div class="lr-main">
          <div class="lr-top"><span class="lr-name">${j.name}</span></div>
          <div class="lr-item">${j.item}</div>
          <div class="lr-addr">📍 ${j.addr}</div>
        </div>
        <div class="lr-right">
          <div class="lr-amt">${j.amount.toLocaleString()}원</div>
          <div class="lr-day" style="color:#6b7280">${j.result==='complete'?'✅ 완료':j.result==='partial'?'📦 일부':j.result==='absent'?'❌ 없음':'📅 이월'}</div>
        </div>
      </div>`;
    });
  }
  scroll.innerHTML=html;
  updateStats();
}

// ══ 상세 화면 ══
function openDetail(id){
  curJobId=id;
  const j=JOBS.find(x=>x.id===id);if(!j)return;
  document.getElementById('ds-name').textContent=j.name;
  document.getElementById('ds-item').textContent=j.item;
  document.getElementById('ds-addr').textContent='📍 '+j.addr;
  const dayTag=getDayTag(j);
  const gradeLabel={A:'🧊 무거운 것',B:'📦 중간',C:'🪑 가벼운 것'};
  const gradeCls={A:'dt-grade-a',B:'dt-grade-b',C:'dt-grade-c'};
  document.getElementById('ds-meta').innerHTML=`
    <span class="ds-tag dt-source">${SOURCE_TAG[j.source]||''}</span>
    <span class="ds-tag ${dayTag.cls}">${dayTag.txt}</span>
    <span class="ds-tag ${gradeCls[j.grade]}">${gradeLabel[j.grade]}</span>
    ${j.rollover?'<span class="ds-tag dt-rollover">🔴 이월 건</span>':''}
  `;
  document.getElementById('ds-complaint').style.display=j.complaint?'flex':'none';
  const memoEl=document.getElementById('ds-memo');
  if(j.memo){memoEl.textContent='💬 '+j.memo;memoEl.style.display='block';}
  else memoEl.style.display='none';
  document.getElementById('ds-navi-btn').onclick=()=>openNavi(j.id);
  document.getElementById('detail-overlay').classList.add('on');
  document.getElementById('detail-sheet').scrollTop=0;
}
function closeDetail(){document.getElementById('detail-overlay').classList.remove('on');}

// ══ 카카오맵 ══
function initMap(){
  if(kakaoMap){renderPins();return;}
  // 카카오맵 라이브러리 로드 대기 및 초기화
  const start=()=>{
    if(kakaoMap) return;
    kakaoMap=new kakao.maps.Map(document.getElementById('kakao-map'),{
      center:new kakao.maps.LatLng(37.5091,127.0875),level:5
    });
    clusterer=new kakao.maps.MarkerClusterer({
      map:kakaoMap,averageCenter:true,minLevel:4,minClusterSize:2,
      styles:[
        {width:'46px',height:'46px',background:'rgba(26,86,219,.88)',border:'3px solid #fff',borderRadius:'50%',color:'#fff',fontFamily:'Noto Sans KR,sans-serif',fontSize:'16px',fontWeight:'700',lineHeight:'40px',textAlign:'center',boxShadow:'0 3px 10px rgba(0,0,0,.3)'},
        {width:'56px',height:'56px',background:'rgba(220,38,38,.88)',border:'3px solid #fff',borderRadius:'50%',color:'#fff',fontFamily:'Noto Sans KR,sans-serif',fontSize:'17px',fontWeight:'700',lineHeight:'50px',textAlign:'center',boxShadow:'0 3px 10px rgba(0,0,0,.3)'},
        {width:'66px',height:'66px',background:'rgba(109,40,217,.88)',border:'3px solid #fff',borderRadius:'50%',color:'#fff',fontFamily:'Noto Sans KR,sans-serif',fontSize:'18px',fontWeight:'700',lineHeight:'60px',textAlign:'center',boxShadow:'0 3px 10px rgba(0,0,0,.3)'},
      ]
    });
    kakao.maps.event.addListener(kakaoMap,'click',()=>closePinSheet());
    renderPins();
  };
  if(typeof kakao!=='undefined'&&kakao.maps&&kakao.maps.Map) start();
  else if(typeof kakao!=='undefined'&&kakao.maps) kakao.maps.load(start);
  else setTimeout(initMap,500);
}

const PIN_LBL={A:'重',B:'中',C:'小'};
function renderPins(){
  customOverlays.forEach(o=>o.setMap(null));customOverlays=[];
  if(clusterer)clusterer.clear();
  const list=filteredJobs();
  const kakaoMarkers=[];
  const bounds=new kakao.maps.LatLngBounds();
  let hasCoord=false;

  list.forEach(job=>{
    if(!job.lat||!job.lng) return; // 좌표 없으면 핀 생략
    const color=getPinColor(job);
    const size=job.grade==='A'?15:job.grade==='B'?12:10;
    const pos=new kakao.maps.LatLng(job.lat,job.lng);
    bounds.extend(pos);hasCoord=true;

    // 클러스터러용 숨김 마커
    const mk=new kakao.maps.Marker({position:pos});mk.setMap(null);kakaoMarkers.push(mk);

    // 커스텀 핀
    const wrap=document.createElement('div');wrap.style.cssText='cursor:pointer;';
    const d=size*2+6;
    const inner=job.complaint
      ?`<div style="width:${d}px;height:${d}px;background:${color};border:3px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:${size}px;box-shadow:0 2px 10px rgba(0,0,0,.35);animation:cpulse 1s infinite;">🚨</div>`
      :`<div style="width:${d}px;height:${d}px;background:${color};border:3px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:${size-1}px;color:#fff;font-weight:900;box-shadow:0 2px 10px rgba(0,0,0,.35);">${PIN_LBL[job.grade]}</div>`;
    wrap.innerHTML=inner;

    const overlay=new kakao.maps.CustomOverlay({
      position:pos,content:wrap,yAnchor:1.3,zIndex:job.complaint?5:3
    });
    overlay.setMap(kakaoMap);customOverlays.push(overlay);
    wrap.addEventListener('click',e=>{e.stopPropagation();openPinSheet(job.id);});
  });

  clusterer.addMarkers(kakaoMarkers);
  if(hasCoord) kakaoMap.setBounds(bounds,50);
}

function zoomMap(d){if(kakaoMap)kakaoMap.setLevel(kakaoMap.getLevel()-d);}

// ── 핀 시트 ──
function openPinSheet(id){
  selectedPinJobId=id;
  const j=JOBS.find(x=>x.id===id);if(!j)return;
  document.getElementById('ps-name').textContent=j.name;
  document.getElementById('ps-item').textContent=j.item;
  document.getElementById('ps-addr').textContent='📍 '+j.addr+(j.memo?' · '+j.memo:'');
  document.getElementById('ps-navi-btn').onclick=()=>openNavi(id);
  document.getElementById('pin-sheet').classList.add('open');
}
function closePinSheet(){document.getElementById('pin-sheet').classList.remove('open');selectedPinJobId=null;}
function openDetailFromPin(){
  const id=selectedPinJobId;closePinSheet();
  setTimeout(()=>openDetail(id),300);
}

// ══ 길찾기 ══
function openNavi(id){
  const j=JOBS.find(x=>x.id===id);if(!j)return;
  const addr=encodeURIComponent(j.addr);
  window.location=`kakaomap://search?q=${addr}`;
  setTimeout(()=>window.open(`https://map.kakao.com/?q=${addr}`,'_blank'),1500);
}

// ══ 길게 누르기 ══
function startPress(btn){
  if(pressTimer)cancelPress();
  btn.classList.add('pressing');
  pressTimer=setTimeout(()=>{btn.classList.remove('pressing');markDone(curJobId,'complete');},2000);
}
function cancelPress(){
  if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}
  document.querySelectorAll('.rb.pressing').forEach(b=>b.classList.remove('pressing'));
}
function markDone(id,result){
  const j=JOBS.find(x=>x.id===id);if(!j)return;
  j.done=true;j.result=result;
  closeDetail();
  const msg=result==='complete'?`✅ ${j.name}님 수거 완료!`:result==='partial'?`📦 ${j.name}님 일부 수거 전송됨`:result==='absent'?`❌ ${j.name}님 물건없음 전송됨`:`📅 ${j.name}님 이월 처리됨`;
  showToast(msg);renderList();updateStats();if(kakaoMap)renderPins();
}

// ══ 모달 ══
function openModal(type){
  const j=JOBS.find(x=>x.id===curJobId);if(!j)return;
  curModal=type;photos={partial:[],absent:[]};
  if(type==='partial'){
    document.getElementById('mp-item').textContent=j.item+' — '+j.addr;
    document.getElementById('mp-thumbs').innerHTML='';
    document.getElementById('mp-zone').className='photo-zone';
    document.getElementById('mp-warn').classList.remove('on');
    document.getElementById('ov-partial').classList.add('on');
  } else if(type==='absent'){
    document.getElementById('ma-item').textContent=j.item+' — '+j.addr;
    document.getElementById('ma-thumbs').innerHTML='';
    document.getElementById('ma-zone').className='photo-zone';
    document.getElementById('ma-warn').classList.remove('on');
    document.getElementById('ov-absent').classList.add('on');
  } else if(type==='delay'){
    document.getElementById('md-item').textContent=j.item+' — '+j.addr;
    const{date,reason}=calcDelay(j);
    document.getElementById('md-date').textContent=fmtKr(date);
    document.getElementById('md-reason').textContent=reason;
    document.getElementById('ov-delay').classList.add('on');
  }
}
function closeModal(){['ov-partial','ov-absent','ov-delay'].forEach(id=>document.getElementById(id).classList.remove('on'));curModal=null;}
const EMOJIS=['📸','🖼️','📷','🗃️'];
function takePhoto(type){
  const emoji=EMOJIS[photos[type].length%4];
  const ts=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  photos[type].push({emoji,ts});
  const el=document.getElementById(type==='partial'?'mp-thumbs':'ma-thumbs');
  const d=document.createElement('div');d.className='thumb';
  d.innerHTML=`<div style="text-align:center"><div>${emoji}</div><div style="font-size:9px;color:#6b7280">${ts}</div></div>`;
  el.appendChild(d);
  const zone=document.getElementById(type==='partial'?'mp-zone':'ma-zone');
  zone.className='photo-zone ok';zone.querySelector('.pz-text').textContent=`사진 ${photos[type].length}장 촬영됨`;zone.querySelector('.pz-sub').textContent='탭하여 추가 촬영';
  document.getElementById(type==='partial'?'mp-warn':'ma-warn').classList.remove('on');
  showToast(`📸 ${photos[type].length}장 저장됨`);
}
function confirmModal(type){
  if((type==='partial'||type==='absent')&&photos[type].length===0){
    document.getElementById(type==='partial'?'mp-warn':'ma-warn').classList.add('on');return;
  }
  const id=curJobId;closeModal();markDone(id,type);
}

// ══ 통계 ══
function updateStats(){
  document.getElementById('s-remain').textContent=JOBS.filter(j=>!j.done).length;
  document.getElementById('s-done').textContent=JOBS.filter(j=>j.done).length;
}

// ══ 토스트 ══
let tt;
function showToast(msg,dur=2500){
  const el=document.getElementById('toast');
  el.textContent=msg;el.style.display='block';
  clearTimeout(tt);tt=setTimeout(()=>el.style.display='none',dur);
}

</script>
