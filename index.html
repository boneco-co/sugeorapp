<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>수거 작업 앱</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<!-- 카카오 SDK -->
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.6.0/kakao.min.js"></script>

<style>
:root {
  --blue:#1a56db; --blue-d:#1344b8; --blue-l:#e8f0fe;
  --green:#16a34a; --green-l:#dcfce7;
  --red:#dc2626; --red-l:#fee2e2;
  --yellow:#d97706; --yellow-l:#fef3c7;
  --purple:#7c3aed; --purple-l:#ede9fe;
  --orange:#ea580c; --orange-l:#fff7ed;
  --gray:#6b7280; --gray-l:#f3f4f6;
  --border:#e5e7eb; --text:#111827; --white:#fff;
  --font:'Noto Sans KR',-apple-system,sans-serif;
  --safe-top: env(safe-area-inset-top);
  --safe-bottom: env(safe-area-inset-bottom);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:var(--font); background:#f0f4f8; color:var(--text); min-height:100vh; }

/* ── 헤더 ── */
.hdr {
  background:var(--blue);
  padding:calc(12px + var(--safe-top)) 16px 12px;
  display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:100;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.hdr-title { font-size:17px; font-weight:900; color:#fff; display:flex; align-items:center; gap:8px; }
.conn-dot { width:8px; height:8px; border-radius:50%; background:#9ca3af; }
.conn-dot.online { background:#4ade80; box-shadow:0 0 0 3px rgba(74,222,128,.3); }
.conn-dot.offline { background:#f87171; }
.hdr-date { font-size:12px; color:rgba(255,255,255,.8); }

/* ── 날짜 탭 ── */
.date-tabs {
  display:flex; gap:8px; padding:14px 16px;
  background:var(--white);
  border-bottom:1px solid var(--border);
  position:sticky; top:56px; z-index:90;
}
.date-tab {
  flex:1; padding:10px 8px; border-radius:12px;
  border:2px solid var(--border); background:var(--gray-l);
  font-size:13px; font-weight:800; cursor:pointer;
  font-family:var(--font); color:var(--gray);
  text-align:center; transition:all .15s;
  display:flex; flex-direction:column; align-items:center; gap:2px;
}
.date-tab.on { background:var(--blue); border-color:var(--blue); color:#fff; }
.date-tab .cnt { font-size:11px; font-weight:400; opacity:.8; }

/* ── 통계바 ── */
.stats-bar {
  padding:10px 16px;
  display:flex; gap:8px; flex-wrap:wrap;
  background:var(--white);
  border-bottom:1px solid var(--border);
}
.stat-chip {
  padding:4px 12px; border-radius:20px;
  font-size:12px; font-weight:700;
  display:flex; align-items:center; gap:4px;
}

/* ── 섹션 헤더 ── */
.section-hdr {
  padding:10px 16px 6px;
  font-size:12px; font-weight:800; color:var(--gray);
  text-transform:uppercase; letter-spacing:.5px;
}

/* ── 작업 카드 ── */
.work-list { padding:0 12px 100px; display:flex; flex-direction:column; gap:8px; }
.work-card {
  background:var(--white); border-radius:16px;
  padding:14px 16px; box-shadow:0 2px 8px rgba(0,0,0,.07);
  display:flex; align-items:center; gap:12px;
  cursor:pointer; transition:all .15s; border:2px solid transparent;
  position:relative; overflow:hidden;
}
.work-card:active { transform:scale(.98); }
.work-card.done  { border-color:var(--green);  background:var(--green-l); }
.work-card.none  { border-color:var(--red);    background:var(--red-l); opacity:.7; }
.work-card.partial { border-color:var(--yellow); background:var(--yellow-l); }
.work-card.delayed { border-color:var(--purple); background:var(--purple-l); }

.card-num {
  width:32px; height:32px; border-radius:50%;
  background:var(--blue-l); color:var(--blue);
  font-size:13px; font-weight:900;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.card-body { flex:1; min-width:0; }
.card-name { font-size:15px; font-weight:800; margin-bottom:3px; }
.card-addr { font-size:12px; color:var(--gray); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card-items { font-size:12px; color:var(--blue); margin-top:3px; font-weight:600; }
.card-right { display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex-shrink:0; }
.card-amount { font-size:13px; font-weight:800; color:var(--text); }
.card-status { font-size:11px; padding:3px 8px; border-radius:10px; font-weight:700; }
.status-pending  { background:var(--gray-l); color:var(--gray); }
.status-done     { background:var(--green-l); color:var(--green); }
.status-none     { background:var(--red-l); color:var(--red); }
.status-partial  { background:var(--yellow-l); color:var(--yellow); }
.status-delayed  { background:var(--purple-l); color:var(--purple); }
.card-worker { font-size:12px; color:var(--purple); font-weight:700; }

/* ── 빈 화면 ── */
.empty { text-align:center; padding:60px 20px; color:var(--gray); }
.empty-icon { font-size:48px; margin-bottom:12px; }
.empty-text { font-size:16px; font-weight:700; }
.empty-sub  { font-size:13px; margin-top:6px; }

/* ── 상세 패널 (바텀시트) ── */
.detail-overlay {
  position:fixed; inset:0; z-index:200;
  background:rgba(0,0,0,.5);
  display:none; align-items:flex-end; justify-content:center;
}
.detail-overlay.show { display:flex; }
.detail-sheet {
  background:var(--white);
  border-radius:24px 24px 0 0;
  width:100%; max-width:600px;
  max-height:92vh; overflow-y:auto;
  padding:0 0 calc(20px + var(--safe-bottom));
  animation:slideUp .25s ease-out;
}
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }

.sheet-handle {
  width:40px; height:4px; border-radius:2px;
  background:var(--border); margin:12px auto 0;
}
.sheet-header {
  padding:16px 20px 12px;
  border-bottom:1px solid var(--border);
  display:flex; justify-content:space-between; align-items:center;
}
.sheet-name { font-size:20px; font-weight:900; }
.sheet-close {
  width:32px; height:32px; border-radius:50%;
  background:var(--gray-l); border:none; font-size:18px;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
}

.sheet-section { padding:14px 20px; border-bottom:1px solid var(--gray-l); }
.sheet-label { font-size:11px; font-weight:700; color:var(--gray); margin-bottom:6px; text-transform:uppercase; }
.sheet-value { font-size:15px; font-weight:600; }
.sheet-value.addr { color:var(--blue); }
.sheet-value.phone { color:var(--blue); }

.item-row { display:flex; justify-content:space-between; align-items:center; padding:5px 0; }
.item-name { font-size:14px; font-weight:600; }
.item-price { font-size:14px; font-weight:700; color:var(--blue); }
.total-row {
  display:flex; justify-content:space-between;
  padding:10px 0 0; border-top:2px solid var(--border);
  margin-top:6px;
}
.total-label { font-size:14px; font-weight:800; }
.total-price { font-size:16px; font-weight:900; color:var(--blue); }

/* ── 카카오 길찾기 버튼 ── */
.kakao-btn {
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; padding:14px; margin:0 20px;
  width:calc(100% - 40px);
  background:#FEE500; border:none; border-radius:14px;
  font-size:15px; font-weight:800; cursor:pointer;
  font-family:var(--font); color:#3C1E1E;
}
.kakao-btn:hover { background:#fdd835; }
.kakao-btn:active { transform:scale(.98); }

/* ── 수거원 선택 ── */
.worker-btns { display:flex; gap:8px; flex-wrap:wrap; }
.worker-btn {
  padding:10px 20px; border-radius:12px;
  border:2px solid var(--border); background:var(--white);
  font-size:15px; font-weight:800; cursor:pointer;
  font-family:var(--font); transition:all .15s;
}
.worker-btn.on { background:var(--purple); border-color:var(--purple); color:#fff; }

/* ── 수거결과 버튼 ── */
.result-btns { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.result-btn {
  padding:14px; border:none; border-radius:14px;
  font-size:14px; font-weight:800; cursor:pointer;
  font-family:var(--font); transition:all .15s;
  display:flex; align-items:center; justify-content:center; gap:6px;
}
.result-btn:active { transform:scale(.97); }
.btn-done    { background:var(--green); color:#fff; }
.btn-none    { background:var(--red); color:#fff; }
.btn-partial { background:var(--yellow); color:#fff; }
.btn-delay   { background:var(--purple); color:#fff; }

/* ── 미루기 모달 ── */
.modal-overlay {
  position:fixed; inset:0; z-index:300;
  background:rgba(0,0,0,.5);
  display:none; align-items:center; justify-content:center;
  padding:20px;
}
.modal-overlay.show { display:flex; }
.modal-box {
  background:var(--white); border-radius:20px;
  padding:24px; width:100%; max-width:380px;
  box-shadow:0 24px 60px rgba(0,0,0,.25);
}
.modal-title { font-size:17px; font-weight:900; margin-bottom:6px; }
.modal-sub   { font-size:13px; color:var(--gray); margin-bottom:20px; }
.modal-row   { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); }
.modal-key   { font-size:13px; color:var(--gray); font-weight:700; }
.modal-val   { font-size:14px; font-weight:800; }
.modal-val.new { color:var(--purple); }
.modal-btns  { display:flex; gap:10px; margin-top:20px; }
.modal-btn   { flex:1; padding:12px; border:none; border-radius:12px; font-size:14px; font-weight:800; cursor:pointer; font-family:var(--font); }
.modal-btn.cancel { background:var(--gray-l); color:var(--gray); }
.modal-btn.confirm { background:var(--purple); color:#fff; }

/* ── 일부수거 모달 ── */
.partial-item { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
.partial-item:last-child { border-bottom:none; }
.partial-item label { flex:1; font-size:14px; font-weight:600; cursor:pointer; }
.partial-item .price { font-size:12px; color:var(--gray); }
.partial-memo {
  width:100%; border:2px solid var(--border); border-radius:10px;
  padding:10px; font-size:14px; font-family:var(--font);
  margin-top:12px; resize:vertical; min-height:60px; outline:none;
}
.partial-memo:focus { border-color:var(--green); }

/* ── 로딩 ── */
.loading-overlay {
  position:fixed; inset:0; background:rgba(255,255,255,.9);
  z-index:500; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:12px;
}
.loading-overlay.hidden { display:none; }
.spinner {
  width:36px; height:36px; border:4px solid var(--border);
  border-top-color:var(--blue); border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin { to{transform:rotate(360deg)} }

/* ── 토스트 ── */
.toast {
  position:fixed; bottom:calc(30px + var(--safe-bottom)); left:50%;
  transform:translateX(-50%);
  background:#111827; color:#fff; padding:11px 22px;
  border-radius:12px; font-size:14px; font-weight:700;
  z-index:999; display:none; white-space:nowrap;
  box-shadow:0 4px 16px rgba(0,0,0,.3);
}
</style>
</head>
<body>

<!-- 헤더 -->
<div class="hdr">
  <div class="hdr-title">
    <span class="conn-dot" id="conn-dot"></span>
    🚛 수거 작업
  </div>
  <div class="hdr-date" id="hdr-date"></div>
</div>

<!-- 날짜 탭 -->
<div class="date-tabs">
  <button class="date-tab on" id="tab-today" onclick="switchDate('today')">
    📅 오늘
    <span class="cnt" id="today-cnt">0건</span>
  </button>
  <button class="date-tab" id="tab-tomorrow" onclick="switchDate('tomorrow')">
    📅 내일
    <span class="cnt" id="tomorrow-cnt">0건</span>
  </button>
</div>

<!-- 통계바 -->
<div class="stats-bar" id="stats-bar" style="display:none;">
  <div class="stat-chip" style="background:var(--gray-l);color:var(--gray);">
    전체 <span id="stat-total">0</span>
  </div>
  <div class="stat-chip" style="background:var(--green-l);color:var(--green);">
    ✅ <span id="stat-done">0</span>
  </div>
  <div class="stat-chip" style="background:var(--red-l);color:var(--red);">
    ❌ <span id="stat-none">0</span>
  </div>
  <div class="stat-chip" style="background:var(--yellow-l);color:var(--yellow);">
    ⚠️ <span id="stat-partial">0</span>
  </div>
  <div class="stat-chip" style="background:var(--purple-l);color:var(--purple);">
    📅 <span id="stat-delayed">0</span>
  </div>
</div>

<!-- 작업 목록 -->
<div class="work-list" id="work-list"></div>

<!-- ── 상세 바텀시트 ── -->
<div class="detail-overlay" id="detail-overlay" onclick="if(event.target===this)closeDetail()">
  <div class="detail-sheet">
    <div class="sheet-handle"></div>

    <div class="sheet-header">
      <div class="sheet-name" id="d-name">홍길동</div>
      <button class="sheet-close" onclick="closeDetail()">✕</button>
    </div>

    <!-- 주소 -->
    <div class="sheet-section">
      <div class="sheet-label">📍 주소</div>
      <div class="sheet-value addr" id="d-addr"></div>
    </div>

    <!-- 전화번호 -->
    <div class="sheet-section">
      <div class="sheet-label">📞 전화번호</div>
      <div class="sheet-value phone" id="d-phone"></div>
    </div>

    <!-- 품목 -->
    <div class="sheet-section">
      <div class="sheet-label">📦 수거 품목</div>
      <div id="d-items"></div>
    </div>

    <!-- 비고 -->
    <div class="sheet-section" id="d-note-section" style="display:none;">
      <div class="sheet-label">📝 비고</div>
      <div class="sheet-value" id="d-note" style="color:var(--orange);"></div>
    </div>

    <!-- 수거일 -->
    <div class="sheet-section">
      <div class="sheet-label">🗓 수거 예정일</div>
      <div class="sheet-value" id="d-date"></div>
    </div>

    <!-- 카카오맵 -->
    <div class="sheet-section">
      <button class="kakao-btn" onclick="openKakao()">
        🗺️ 카카오맵으로 길찾기
      </button>
    </div>

    <!-- 수거원 -->
    <div class="sheet-section">
      <div class="sheet-label">👷 수거원</div>
      <div class="worker-btns" id="d-workers">
        <button class="worker-btn" onclick="selectWorker('박')">박</button>
        <button class="worker-btn" onclick="selectWorker('허')">허</button>
        <button class="worker-btn" onclick="selectWorker('이')">이</button>
        <button class="worker-btn" onclick="selectWorker('김')">김</button>
        <button class="worker-btn" onclick="selectWorker('금')">금</button>
      </div>
    </div>

    <!-- 수거결과 -->
    <div class="sheet-section">
      <div class="sheet-label">📋 수거 결과</div>
      <div class="result-btns">
        <button class="result-btn btn-done"    onclick="setResult('done')">✅ 수거완료</button>
        <button class="result-btn btn-none"    onclick="setResult('none')">❌ 없음</button>
        <button class="result-btn btn-partial" onclick="setResult('partial')">⚠️ 일부수거</button>
        <button class="result-btn btn-delay"   onclick="setResult('delay')">📅 미루기</button>
      </div>
    </div>
  </div>
</div>

<!-- ── 미루기 모달 ── -->
<div class="modal-overlay" id="delay-modal" onclick="if(event.target===this)closeDelayModal()">
  <div class="modal-box">
    <div class="modal-title">📅 수거일 미루기</div>
    <div class="modal-sub" id="delay-name"></div>
    <div class="modal-row">
      <span class="modal-key">현재 수거일</span>
      <span class="modal-val" id="delay-cur"></span>
    </div>
    <div class="modal-row">
      <span class="modal-key">변경될 수거일</span>
      <span class="modal-val new" id="delay-new"></span>
    </div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeDelayModal()">취소</button>
      <button class="modal-btn confirm" onclick="confirmDelay()">확인 저장</button>
    </div>
  </div>
</div>

<!-- ── 일부수거 모달 ── -->
<div class="modal-overlay" id="partial-modal" onclick="if(event.target===this)closePartialModal()">
  <div class="modal-box">
    <div class="modal-title">⚠️ 일부수거 처리</div>
    <div class="modal-sub">수거된 품목에 체크하세요</div>
    <div id="partial-items-list"></div>
    <textarea class="partial-memo" id="partial-memo" placeholder="메모 (예: 냉장고만 수거, 엘리베이터 불가 등)"></textarea>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closePartialModal()">취소</button>
      <button class="modal-btn confirm" style="background:var(--yellow);" onclick="confirmPartial()">저장</button>
    </div>
  </div>
</div>

<!-- 로딩 -->
<div class="loading-overlay" id="loading-overlay">
  <div class="spinner"></div>
  <div style="font-size:14px;font-weight:700;color:var(--gray);">불러오는 중…</div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════
//  ⚙️ 설정 — 여기만 수정하세요
// ══════════════════════════════════════════
const firebaseConfig = {
  apiKey:            "AIzaSyD4hPKN8cdtnsVACdvBxDfoR33mAOYEuco",
  authDomain:        "boneco-wonjang.firebaseapp.com",
  databaseURL:       "https://boneco-wonjang-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "boneco-wonjang",
  storageBucket:     "boneco-wonjang.firebasestorage.app",
  messagingSenderId: "463413861191",
  appId:             "1:463413861191:web:c6a68b67fe000baae64a62"
};
const KAKAO_JS_KEY = "b8908c96799936ef733a0445f1bd6abc";
const JISEO_PATH   = "jiseo_data";   // Firebase 작업지시서 경로

// 공휴일 목록 (YYYY-MM-DD 형식으로 추가)
const HOLIDAYS = [
  "2026-01-01","2026-01-28","2026-01-29","2026-01-30",
  "2026-03-01","2026-05-05","2026-05-25","2026-06-06",
  "2026-08-15","2026-09-24","2026-09-25","2026-09-26",
  "2026-10-03","2026-10-09","2026-12-25"
];

// 5단지 판별 키워드
const APT5_KEYS = ["5단지"];
// ══════════════════════════════════════════

// ── Firebase 초기화 ──
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
Kakao.init(KAKAO_JS_KEY);

// ── 상태 ──
let jiseoData  = {};
let curDate    = 'today';
let curRow     = null;   // 현재 상세보기 중인 행 데이터
let curDateStr = '';     // 현재 보고 있는 날짜 (YYYY-MM-DD)
let delayNewDate = '';   // 미루기 새 날짜

// ── 초기화 ──
window.addEventListener('DOMContentLoaded', () => {
  // 헤더 날짜
  document.getElementById('hdr-date').textContent =
    new Date().toLocaleDateString('ko-KR', {month:'long', day:'numeric', weekday:'short'});

  // 연결 상태
  db.ref('.info/connected').on('value', snap => {
    document.getElementById('conn-dot').className = 'conn-dot ' + (snap.val() ? 'online' : 'offline');
  });

  // 작업지시서 실시간 구독
  showLoading();
  db.ref(JISEO_PATH).on('value', snap => {
    jiseoData = snap.val() || {};
    hideLoading();
    renderList();
  }, () => { hideLoading(); showToast('❌ 데이터 로드 실패'); });
});

// ── 날짜 탭 전환 ──
function switchDate(tab) {
  curDate = tab;
  document.getElementById('tab-today').classList.toggle('on', tab === 'today');
  document.getElementById('tab-tomorrow').classList.toggle('on', tab === 'tomorrow');
  renderList();
}

// ── 오늘/내일 날짜 계산 ──
function getTodayStr()    { return new Date().toISOString().slice(0,10); }
function getTomorrowStr() {
  const d = new Date(); d.setDate(d.getDate() + 1);
  return d.toISOString().slice(0,10);
}

// ── 수거일이 오늘/내일인 건들 모아오기 ──
function getWorkRows(targetDate) {
  const rows = [];
  Object.keys(jiseoData).sort().forEach(d => {
    const dd = jiseoData[d] || {};
    ['잠실본동','삼전동'].forEach(s => {
      (dd[s]||[]).forEach((r,i) => {
        if ((r.수거일자||'').slice(0,10) === targetDate)
          rows.push({...r, _jDate:d, _sheet:s, _sheetIdx:i, _aptSub:''});
      });
    });
    if (dd['아파트']) {
      Object.entries(dd['아파트']).forEach(([sub, list]) => {
        list.forEach((r,i) => {
          if ((r.수거일자||'').slice(0,10) === targetDate)
            rows.push({...r, _jDate:d, _sheet:'아파트', _aptSub:sub, _sheetIdx:i});
        });
      });
    }
  });
  return rows;
}

// ── 리스트 렌더 ──
function renderList() {
  const today    = getTodayStr();
  const tomorrow = getTomorrowStr();
  const todayRows    = getWorkRows(today);
  const tomorrowRows = getWorkRows(tomorrow);

  document.getElementById('today-cnt').textContent    = todayRows.length + '건';
  document.getElementById('tomorrow-cnt').textContent = tomorrowRows.length + '건';

  const rows = curDate === 'today' ? todayRows : tomorrowRows;
  curDateStr = curDate === 'today' ? today : tomorrow;

  const list = document.getElementById('work-list');
  const statsBar = document.getElementById('stats-bar');

  if (!rows.length) {
    statsBar.style.display = 'none';
    list.innerHTML = `<div class="empty">
      <div class="empty-icon">✅</div>
      <div class="empty-text">${curDate==='today'?'오늘':'내일'} 작업이 없습니다</div>
      <div class="empty-sub">수고하셨습니다!</div>
    </div>`;
    return;
  }

  // 통계
  statsBar.style.display = 'flex';
  const cnt = { done:0, none:0, partial:0, delayed:0 };
  rows.forEach(r => {
    if (r._result === 'done')    cnt.done++;
    else if (r._result === 'none')    cnt.none++;
    else if (r._result === 'partial') cnt.partial++;
    else if (r._result === 'delay')   cnt.delayed++;
  });
  document.getElementById('stat-total').textContent   = rows.length;
  document.getElementById('stat-done').textContent    = cnt.done;
  document.getElementById('stat-none').textContent    = cnt.none;
  document.getElementById('stat-partial').textContent = cnt.partial;
  document.getElementById('stat-delayed').textContent = cnt.delayed;

  // 섹션별 분류
  const sections = {};
  rows.forEach((r, i) => {
    const sec = r._sheet === '잠실본동' ? '잠실동'
               : r._sheet === '삼전동'  ? '삼전동'
               : `아파트 · ${r._aptSub||''}`;
    if (!sections[sec]) sections[sec] = [];
    sections[sec].push({...r, _listIdx:i});
  });

  let html = '';
  Object.entries(sections).forEach(([sec, secRows]) => {
    html += `<div class="section-hdr">${sec} · ${secRows.length}건</div>`;
    secRows.forEach((r, si) => {
      const res = r._result || '';
      const statusClass = res==='done'?'done':res==='none'?'none':res==='partial'?'partial':res==='delay'?'delayed':'';
      const statusLabel = res==='done'?'✅수거완료':res==='none'?'❌없음':res==='partial'?'⚠️일부수거':res==='delay'?'📅미루기':'미처리';
      const statusStyle = res==='done'?'status-done':res==='none'?'status-none':res==='partial'?'status-partial':res==='delay'?'status-delayed':'status-pending';

      // 품목 요약
      const items = r._items
        ? (Array.isArray(r._items) ? r._items : Object.values(r._items))
        : [{품목:r.품목1||'',금액:r.금액1||''},{품목:r.품목2||'',금액:r.금액2||''}].filter(it=>it.품목);
      const itemSummary = items.map(it=>it.품목).filter(Boolean).slice(0,2).join(' · ') + (items.length>2?` 외 ${items.length-2}건`:'');

      html += `<div class="work-card ${statusClass}" onclick="openDetail(${JSON.stringify(JSON.stringify(r))})">
        <div class="card-num">${si+1}</div>
        <div class="card-body">
          <div class="card-name">${r.성명||'(이름없음)'}</div>
          <div class="card-addr">${r.주소||''}</div>
          <div class="card-items">${itemSummary}</div>
        </div>
        <div class="card-right">
          <div class="card-amount">${r.총금액||''}</div>
          <div class="card-status ${statusStyle}">${statusLabel}</div>
          ${r.수거원 ? `<div class="card-worker">👷 ${r.수거원}</div>` : ''}
        </div>
      </div>`;
    });
  });

  list.innerHTML = html;
}

// ── 상세 열기 ──
function openDetail(rJson) {
  curRow = JSON.parse(rJson);

  document.getElementById('d-name').textContent  = curRow.성명 || '(이름없음)';
  document.getElementById('d-addr').textContent  = curRow.주소 || '';
  document.getElementById('d-phone').textContent = curRow.전화번호 || '';
  document.getElementById('d-date').textContent  = curRow.수거일자 || '';

  // 비고
  const noteEl = document.getElementById('d-note-section');
  if (curRow.비고) {
    document.getElementById('d-note').textContent = curRow.비고;
    noteEl.style.display = '';
  } else {
    noteEl.style.display = 'none';
  }

  // 품목
  const rawItems = curRow._items;
  const items = rawItems
    ? (Array.isArray(rawItems) ? rawItems : Object.values(rawItems))
    : [{품목:curRow.품목1||'',금액:curRow.금액1||''},{품목:curRow.품목2||'',금액:curRow.금액2||''},{품목:curRow.품목3||'',금액:curRow.금액3||''}].filter(it=>it.품목);

  let itemHtml = items.map(it=>`
    <div class="item-row">
      <span class="item-name">${it.품목}</span>
      <span class="item-price">${it.금액||'면제'}</span>
    </div>`).join('');
  itemHtml += `<div class="total-row">
    <span class="total-label">총금액</span>
    <span class="total-price">${curRow.총금액||''}</span>
  </div>`;
  document.getElementById('d-items').innerHTML = itemHtml;

  // 수거원 표시
  document.querySelectorAll('.worker-btn').forEach(btn => {
    btn.classList.toggle('on', btn.textContent === curRow.수거원);
  });

  document.getElementById('detail-overlay').classList.add('show');
}

function closeDetail() {
  document.getElementById('detail-overlay').classList.remove('show');
}

// ── 카카오맵 길찾기 ──
function openKakao() {
  if (!curRow) return;
  const addr = encodeURIComponent(curRow.주소||'');
  const name = encodeURIComponent(curRow.성명||'목적지');

  // 카카오맵 앱 → 없으면 웹으로
  const kakaoUrl = `kakaomap://route?ep=${addr}&by=CAR`;
  const webUrl   = `https://map.kakao.com/link/to/${name},${addr}`;

  const iframe = document.createElement('iframe');
  iframe.style.display = 'none';
  iframe.src = kakaoUrl;
  document.body.appendChild(iframe);
  setTimeout(() => {
    document.body.removeChild(iframe);
    window.open(webUrl, '_blank');
  }, 1200);
}

// ── 수거원 선택 ──
function selectWorker(name) {
  if (!curRow) return;
  curRow.수거원 = name;
  document.querySelectorAll('.worker-btn').forEach(btn => {
    btn.classList.toggle('on', btn.textContent === name);
  });
  saveField('수거원', name);
  showToast(`👷 수거원 [${name}] 선택됨`);
}

// ── 수거결과 설정 ──
function setResult(result) {
  if (!curRow) return;
  if (result === 'delay')   { openDelayModal(); return; }
  if (result === 'partial') { openPartialModal(); return; }

  const today = getTodayStr();
  const updates = { _result: result };
  if (result === 'done') updates.수거일자 = today;
  if (result === 'none') updates.수거일자 = '';

  Object.entries(updates).forEach(([k, v]) => { curRow[k] = v; saveField(k, v); });

  const label = result==='done' ? '✅ 수거완료' : '❌ 없음';
  showToast(`${label} 저장 완료`);
  closeDetail();
  renderList();
}

// ── Firebase 필드 저장 ──
function saveField(field, value) {
  if (!curRow) return;
  const base = curRow._aptSub
    ? `${JISEO_PATH}/${curRow._jDate}/아파트/${curRow._aptSub}/${curRow._sheetIdx}`
    : `${JISEO_PATH}/${curRow._jDate}/${curRow._sheet}/${curRow._sheetIdx}`;
  db.ref(`${base}/${field}`).set(value).catch(err => showToast('❌ 저장 실패: ' + err.message));
}

function saveMultiField(obj) {
  if (!curRow) return;
  const base = curRow._aptSub
    ? `${JISEO_PATH}/${curRow._jDate}/아파트/${curRow._aptSub}/${curRow._sheetIdx}`
    : `${JISEO_PATH}/${curRow._jDate}/${curRow._sheet}/${curRow._sheetIdx}`;
  const updates = {};
  Object.entries(obj).forEach(([k,v]) => updates[`${base}/${k}`] = v);
  db.ref().update(updates).catch(err => showToast('❌ 저장 실패: ' + err.message));
}

// ── 수거일 계산 ──
function calcNextWorkDate(dateStr, is5danji) {
  const d = new Date(dateStr);
  d.setDate(d.getDate() + 1);

  for (let i = 0; i < 14; i++) {
    const dow = d.getDay(); // 0=일, 6=토
    const ds  = d.toISOString().slice(0,10);
    const isHoliday = HOLIDAYS.includes(ds);
    const isSun = dow === 0;
    const isSat = dow === 6;

    if (isHoliday || isSun || (is5danji && isSat)) {
      d.setDate(d.getDate() + 1);
      continue;
    }
    return ds;
  }
  return d.toISOString().slice(0,10);
}

// ── 미루기 모달 ──
function openDelayModal() {
  if (!curRow) return;
  const curDateS  = (curRow.수거일자||'').slice(0,10);
  const is5danji  = APT5_KEYS.some(k => (curRow._aptSub||curRow.주소||'').includes(k));
  delayNewDate    = calcNextWorkDate(curDateS || getTodayStr(), is5danji);

  const fmtDate = s => {
    if (!s) return '-';
    const d   = new Date(s);
    const dow = ['일','월','화','수','목','금','토'][d.getDay()];
    return `${s.slice(5,7)}/${s.slice(8,10)} (${dow})`;
  };

  document.getElementById('delay-name').textContent = curRow.성명 || '';
  document.getElementById('delay-cur').textContent  = fmtDate(curDateS);
  document.getElementById('delay-new').textContent  = fmtDate(delayNewDate);

  document.getElementById('delay-modal').classList.add('show');
}
function closeDelayModal() {
  document.getElementById('delay-modal').classList.remove('show');
}
function confirmDelay() {
  if (!curRow || !delayNewDate) return;
  saveMultiField({ 수거일자: delayNewDate, _result: 'delay' });
  curRow.수거일자 = delayNewDate;
  curRow._result  = 'delay';
  closeDelayModal();
  closeDetail();
  renderList();
  showToast(`📅 ${delayNewDate}으로 미뤄졌습니다`);
}

// ── 일부수거 모달 ──
function openPartialModal() {
  if (!curRow) return;
  const rawItems = curRow._items;
  const items = rawItems
    ? (Array.isArray(rawItems) ? rawItems : Object.values(rawItems))
    : [{품목:curRow.품목1||'',금액:curRow.금액1||''},{품목:curRow.품목2||'',금액:curRow.금액2||''},{품목:curRow.품목3||'',금액:curRow.금액3||''}].filter(it=>it.품목);

  const collected = curRow._collected
    ? (Array.isArray(curRow._collected) ? curRow._collected : Object.values(curRow._collected))
    : [];

  document.getElementById('partial-items-list').innerHTML = items.length
    ? items.map((it,i) => `<div class="partial-item">
        <input type="checkbox" id="pchk-${i}" ${collected.includes(i)?'checked':''}>
        <label for="pchk-${i}">${it.품목||'품목없음'}<span class="price"> — ${it.금액||'면제'}</span></label>
      </div>`).join('')
    : '<div style="color:var(--gray);font-size:13px;padding:8px 0;">품목 정보가 없습니다. 메모에 직접 입력해주세요.</div>';

  document.getElementById('partial-memo').value = curRow._memo || '';
  document.getElementById('partial-modal').classList.add('show');
}
function closePartialModal() {
  document.getElementById('partial-modal').classList.remove('show');
}
function confirmPartial() {
  if (!curRow) return;
  const memo = document.getElementById('partial-memo').value.trim();
  const collected = [...document.querySelectorAll('[id^="pchk-"]')]
    .map((cb,i) => cb.checked ? i : -1).filter(v => v >= 0);
  saveMultiField({ _result:'partial', _memo:memo, _collected:collected });
  curRow._result = 'partial'; curRow._memo = memo; curRow._collected = collected;
  closePartialModal(); closeDetail(); renderList();
  showToast('⚠️ 일부수거 저장 완료');
}

// ── 유틸 ──
function showLoading() { document.getElementById('loading-overlay').classList.remove('hidden'); }
function hideLoading() { document.getElementById('loading-overlay').classList.add('hidden'); }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.style.display = 'none', 3000);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeDetail(); closeDelayModal(); closePartialModal();
  }
});
</script>
