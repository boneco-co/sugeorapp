// [9_69] 품목 분류표 — 송파구 「대형생활폐기물 수집·운반수수료 품목별 부과기준」의
//   공식 분류(가전제품류 / 가구류 / 생활류 / 기타류)를 그대로 옮긴 것.
//   ※ 공식 표의 '생활류'는 화면에 '생활용품류'로 표기한다.
//   품목명 일부로 맞춘다(축약·규격표기가 붙어 있어도 잡히게).
const ITEM_CATEGORY = {
  가전제품류: ['DVD','비디오','VTR','TV','가스레인지','가스오븐','가습기','게임기','오락기','공기청정기',
    '김치냉장고','냉장고','노트북','녹즙기','다리미','라지에터','모뎀','믹서','발마사지','보온밥통','복사기',
    '영업용프린터','선풍기','세탁기','스캐너','식기건조기','식기세척기','안마기','안마의자','온수기','에어컨',
    '에어컨실외기','오디오','온풍기','자동판매기','전기밥솥','전기판넬','전기히터','전자레인지','전자시계',
    '전화기','휴대폰','정수기','청소기','카세트','커피포트','컴퓨터','컴퓨터복합기','컴퓨터오락기','컴퓨터키보드',
    '탈수기','토스터','팩시밀리','팬히터','프린터','헤어드라이어','환풍기','휴대폰충전기'],
  가구류: ['TV받침','거실장','거울','렌지대','수납장','목욕탕수건함','문갑','문짝','서랍장','쇼파','소파',
    '안락의자','스탠드옷걸이','식탁','신발장','싱크대','쌀통','쓰레기통','아이스박스','의자','장롱','장식장',
    '찬장','진열대','창문','책상','책장','책꽂이','침대','컬러박스','공간박스','탁구대','탁자','캐비넷','캐비닛',
    '파티션','화장대','경대','상판','옷장'],
  생활용품류: ['가방','빨래건조대','게시판','화이트보드','고무통','교자상','밥상','금고','난로','다리미판','도마',
    '돗자리','대자리','놀이매트','마네킹','바둑판','방석','배기후드','베개','벽시계','병풍','보행기','블라인드',
    '비닐옷장','비키니옷장','비데','수도호스','스키','액자','어항','수족관','올갠','우산','유리','유모차','이불',
    '인형','자전거','장난감','장판','재봉틀','전기담요','조명기구','천막','카시트','카페트','카펫','커튼','커튼봉',
    '킥보드','라켓','텐트','피아노','항아리','행거','헬스기구','화환','휠체어','간판','토퍼','매트리스','매트','쿠션','선반'],
  기타류: ['기름탱크','물탱크','변기','보일러','세면대','욕조','타이어','화분','소화기'],
};
function categoryOf(nameRaw) {
  const n = String(nameRaw || '').replace(/\s+/g, '');
  // 가장 긴(=구체적인) 낱말이 이기게 한다 — "TV받침"이 'TV'가 아니라 'TV받침'으로,
  // "다리미판"이 '다리미'가 아니라 '다리미판'으로 잡히도록.
  let best = '', cat = '기타류';
  for (const [c, keys] of Object.entries(ITEM_CATEGORY)) {
    for (const k of keys) {
      const kk = k.replace(/\s+/g, '');
      if (kk.length > best.length && n.includes(kk)) { best = kk; cat = c; }
    }
  }
  return cat;
}
const CAT_ORDER = ['가전제품류','가구류','생활용품류','기타류'];

// 화면에 보이는 건들을 분류별로 집계한다 (건수 = 품목 개수 합, 금액 = 품목 금액 합)
function tallyByCategory(rows) {
  const t = {}; CAT_ORDER.forEach(c => t[c] = { cnt: 0, amt: 0 });
  let cases = 0, total = 0;
  rows.forEach(r => {
    cases++;
    itemsOf(r).forEach(it => {
      if (it._rf) return;   // [9_86] 환불된 품목은 실제 수거분이 아니라 통계에서 뺀다
      const c = categoryOf(it.품목);
      const q = itemFullCount(it);
      const a = parseInt(String(it.금액 || '').replace(/[^\d]/g, '')) || 0;
      t[c].cnt += q; t[c].amt += a; total += a;
    });
  });
  return { t, cases, total };
}
function statTableHtml(title, rows, headBg) {
  const { t, cases, total } = tallyByCategory(rows);
  if (!cases) return '';
  const body = CAT_ORDER.filter(c => t[c].cnt).map(c => `
    <tr>
      <td style="padding:7px 10px;border-top:1px solid #e2e8f0;">${c}</td>
      <td style="padding:7px 10px;border-top:1px solid #e2e8f0;text-align:right;">${t[c].cnt}개</td>
      <td style="padding:7px 10px;border-top:1px solid #e2e8f0;text-align:right;font-weight:800;">${t[c].amt.toLocaleString()}원</td>
    </tr>`).join('');
  return `
  <div style="border:2px solid ${headBg};border-radius:12px;overflow:hidden;margin-bottom:12px;">
    <div style="background:${headBg};color:#fff;font-weight:800;padding:9px 12px;display:flex;justify-content:space-between;gap:8px;">
      <span>${esc(title)}</span><span>${cases}건 / ${total.toLocaleString()}원</span>
    </div>
    <table style="width:100%;border-collapse:collapse;font-size:13px;background:#fff;">
      <thead><tr style="background:#f1f5f9;font-weight:800;">
        <th style="padding:7px 10px;text-align:left;">분류</th>
        <th style="padding:7px 10px;text-align:right;">건수</th>
        <th style="padding:7px 10px;text-align:right;">금액</th>
      </tr></thead>
      <tbody>${body}</tbody>
    </table>
  </div>`;
}
function openStats() {
  const rows = ROWS.filter(visible);
  if (!rows.length) { toast('표시할 건이 없습니다'); return; }
  // [9_75] 제목줄은 스크롤해도 위에 붙어 있고, 오른쪽에 동그란 ✕ 닫기 버튼을 둔다.
  let html = `<div style="position:sticky;top:-18px;z-index:5;background:var(--panel,#fff);
        margin:-18px -18px 4px;padding:18px 18px 10px;

      <button onclick="closeModal()" title="닫기"
        style="width:34px;height:34px;border-radius:50%;border:none;background:#e2e8f0;color:#334155;
               font-size:18px;font-weight:900;cursor:pointer;flex-shrink:0;line-height:1;">✕</button>
    </div>`;
  html += statTableHtml('합계', rows, '#2563eb');
  // 동/단지별 — [9_75] 머리글 색을 합계와 같은 파랑으로 통일
  const zof = SHOW_QUOTE ? geoZoneOf : zoneOf;
  const zones = ['잠실동','삼전동', ...APT_ORDER, '가락시장'];
  zones.forEach(z => {
    const sub = rows.filter(r => zof(r) === z);
    if (sub.length) html += statTableHtml(z, sub, '#2563eb');
  });
  showModal(html);
}

// ══ [10_13] 빼기번호 검색 ══
//   번호를 치면 원장 예약번호 칸에서 접수번호를 찾아 그 1건만 받아 상태를 알려 주고, 수거할 건은 바로 수거처리 창을 연다.
//   · 목록에 있는 건(최근 7일 전송건)은 먼저 그 자료에서 찾고, 없을 때만 원장 2주 치를 한 번 받는다(30분 동안 다시 받지 않음)
//   · 수거처리는 기존 품목 체크 창 그대로 — 저장하면 원장에 바로 반영된다(사무실 '현장에서 수거함'과 같은 기록)
const PP_DAYS = 14;
function ppNorm(s){ return String(s || '').toUpperCase().replace(/빼기/g, '').replace(/[^0-9A-Z]/g, ''); }
function ppIdsOf(r){ return [r && r._빼기id, ...((r && Array.isArray(r._빼기ids)) ? r._빼기ids : [])].filter(Boolean).map(ppNorm); }
function openPpegiSearch(){
  showModal(`<h3>🔍 빼기번호 검색</h3>
    <div class="pp-row"><input id="pp-q" placeholder="예: 1013-3ZS9" autocomplete="off" autocapitalize="characters" spellcheck="false"
      oninput="this.value=this.value.toUpperCase()" onkeydown="if(event.key==='Enter')ppSearch()"><button type="button" onclick="ppSearch()">검색</button></div>
    <div class="pp-hint">"빼기" 글자·가운데 "-"는 안 쳐도 됩니다 · 최근 2주 접수건에서 찾습니다</div>
    <div id="pp-out"></div>
    <button type="button" class="pp-close" onclick="closeModal()">닫기</button>`);
  setTimeout(() => document.getElementById('pp-q')?.focus(), 50);
}
// [10_13b] 원장 2주치를 받지 않는다 — 예약번호 칸(ppegi_keys/번호) 하나만 읽고, 거기 적힌 접수번호로 그 1건만 받는다.
//   원장이 빼기 업로드 때 '올린날짜|접수번호'를 적어 둔다. 예전 업로드분(날짜만)은 그 날짜 앞뒤 하루치만 받아서 찾는다.
//   결과: { old:true } 2주 지난 건 / null 못 찾음 / [id, rec] 찾음
// [10_14] 예약번호 칸 이름이 엑셀 그대로(소문자·띄어쓰기 등)라 글자 그대로 찾으면 못 찾는 일이 있었다(1006-msb9).
//   → 30일치 예약번호 목록(수십 KB)을 30분에 한 번만 받아, 대소문자·"-"·띄어쓰기를 무시하고 맞춘다.
let PP_KEYS = null, PP_KEYS_AT = 0;
function ppIdMatch(id, q){ return id === q || (q.length >= 6 && id.includes(q)); }
async function ppKeyFind(q){
  const pick = () => Object.entries(PP_KEYS || {}).find(([w]) => ppIdMatch(ppNorm(w), q));
  const fresh = PP_KEYS && Date.now() - PP_KEYS_AT < 30 * 60000;
  let hit = fresh ? pick() : null;
  if (!hit && !(fresh && Date.now() - PP_KEYS_AT < 60000)) {   // 없으면(또는 오래됐으면) 다시 받아 한 번 더
    const s = await db.ref('ppegi_keys').once('value');
    PP_KEYS = s.val() || {}; PP_KEYS_AT = Date.now();
    hit = pick();
  }
  return hit || null;
}
async function ppLoad(q){
  const kh = await ppKeyFind(q);
  if (!kh) return null;
  const qq = ppNorm(kh[0]);   // 원장에 실제 저장된 예약번호(정리한 모양)로 접수건을 맞춘다
  const v = kh[1];
  if (typeof v !== 'string') return null;
  const [day, key] = v.split('|');
  const d0 = new Date(day.slice(0, 10) + 'T00:00:00');
  if (isNaN(d0)) return null;
  if (Date.now() - d0.getTime() > PP_DAYS * 86400000) return { old: true };
  let got = {};
  if (key) {
    const s = await db.ref(DB_RECEIPT + '/' + key).once('value');
    if (s.exists()) got[key] = s.val();
  } else {
    const from = String(d0.getTime() - 86400000), to = String(d0.getTime() + 2 * 86400000);
    const s = await db.ref(DB_RECEIPT).orderByKey().startAt(from).endAt(to).once('value');
    got = s.val() || {};
  }
  PP_CACHE = got; PP_CACHE_AT = Date.now();
  // [10_14] 번호칸에 접수번호가 적혀 있으면 그 건이 바로 답이다(예전 건은 접수에 작업번호만 있어 번호로 맞출 수 없다)
  if (key && got[key]) return [key, got[key]];
  return Object.entries(got).find(([id, r]) => r && ppIdsOf(r).some(x => ppIdMatch(x, qq) || ppIdMatch(x, q))) || null;
}
async function ppSearch(){
  const q = ppNorm(document.getElementById('pp-q')?.value);
  const out = document.getElementById('pp-out'); if (!out) return;
  if (q.length < 4) { out.innerHTML = `<div class="pp-res pp-gray">빼기번호를 넣어 주세요</div>`; return; }
  const find = obj => Object.entries(obj || {}).find(([id, r]) => r && ppIdsOf(r).some(x => ppIdMatch(x, q)));
  let hit = find(receipts);
  if (!hit) {
    out.innerHTML = `<div class="pp-res pp-gray">찾는 중…</div>`;
    try { hit = await ppLoad(q); }
    catch (e) { out.innerHTML = `<div class="pp-res pp-warn">연결이 안 됩니다. 잠시 후 다시 검색하세요</div>`; return; }
    if (hit && hit.old) { PP_ROW = null; out.innerHTML = `<div class="pp-res pp-warn">오래된 건입니다. 사무실 확인하세요</div>`; return; }
  }
  if (!hit) { PP_ROW = null; out.innerHTML = `<div class="pp-res pp-warn">접수전이거나 오래된 건입니다. 사무실 확인하세요</div>`; return; }
  const [id, raw] = hit;
  const r = { ...(receipts[id] || raw), _id: id };
  const md = v => { const d = String(v || '').slice(0, 10).split('-'); return d.length === 3 ? `${+d[1]}/${+d[2]}` : ''; };
  const pk = pickupOf(r);
  let cls = 'pp-ok', msg, when = pk ? `수거일 ${md(pk)}` : '수거일 없음', can = true;
  if (r._취소) { cls = 'pp-gray'; msg = '이미 처리된 건입니다. 사무실 확인하세요'; when += ' · 취소된 건'; can = false; }
  else if (r._work상태 && String(r._work미수거 || '').trim()) {
    // [10_14] "없음"으로 처리완료(일부수거)된 건 — 남은 품목은 아직 현장에 있다 → 다시 수거
    msg = '미수거 처리건입니다. 수거하세요';
    const t = r._work일시 ? new Date(r._work일시) : null;
    when += ` · 지난번 없음: ${r._work미수거}${r._work수거원 || t ? ` (${[r._work수거원, t ? `${t.getMonth()+1}/${t.getDate()}` : ''].filter(Boolean).join(' ')})` : ''}`;
  }
  else if (r._work상태) {
    cls = 'pp-gray'; msg = '이미 처리된 건입니다. 사무실 확인하세요'; can = false;
    const t = r._work일시 ? new Date(r._work일시) : null;
    when += ` · ${r._work상태 === 'partial' ? '일부수거' : '수거완료'}${r._work수거원 || t ? ` (${[r._work수거원, t ? `${t.getMonth()+1}/${t.getDate()}` : ''].filter(Boolean).join(' ')})` : ''}`;
  }
  else if (!r._jiseo_app_date) { msg = '전송전입니다. 수거하세요'; when += ' · 아직 기사앱 전송 전'; }
  else if (pk && pk < TODAY) { msg = '미수거건입니다. 수거하세요'; when += ` · ${overdueDays(r)}일 지남`; }
  else { msg = '전송건입니다. 수거하세요'; if (pk === TODAY) when += ' (오늘)'; }
  const amt = workAmtOf(r);
  out.innerHTML = `<div class="pp-res ${cls}">${msg}</div>
    <div class="pp-card"><b>${esc(addrText(r))}</b> · ${esc(maskName(r.성명) || '-')}<br>${esc(itemSummary(r))} · ${amt ? amt.toLocaleString() + '원' : '무상'}<br>${esc(when)}</div>
    ${can ? `<button type="button" class="pp-go" onclick="ppCollect('${id}')">✅ 수거처리</button>` : ''}`;
  PP_ROW = can ? r : null;
  if (PP_ROW && PP_ROW._work상태) {
    // [10_14] 재작업처럼 연다 — 이번 회차 기록만 비우고 _work품목(지난번 가져간 개수)은 남겨 잠근다(사무실 재작업 전송과 같은 방식)
    PP_ROW = { ...PP_ROW, _work상태: null, _work일시: null, _work수거원: null, _work미수거: null, _rework: true,
      _ppPrev: { 상태: r._work상태 || null, 일시: r._work일시 || null, 수거원: r._work수거원 || null, 미수거: r._work미수거 || null,
                 메모: r._work메모 || null, 품목: Array.isArray(r._work품목) ? r._work품목 : null, 이전: r._work이전 || null } };   // [10_15] 완료 취소 시 되돌릴 지난번 기록
  }
}
function ppCollect(id){
  if (!PP_ROW || PP_ROW._id !== id) return;
  const inRows = ROWS.find(x => x._id === id);
  if (!inRows || PP_ROW._rework) { PP_ROW._pt = resolveCoord(PP_ROW); PP_ROW._st = statusOf(PP_ROW); PP_ROW._zone = zoneOf(PP_ROW); }
  closeModal();
  openSheet(id);
  SHEET_VIA_PP = id;   // [10_15] 빼기번호 검색으로 연 건 — 완료 시 원장에 "🔍빼기 현장수거" 표시
}

function showModal(html){
  document.getElementById('mbox').innerHTML = html;
  document.getElementById('modal').classList.add('show');
}

document.getElementById('modal').onclick = e=>{ if (e.target.id==='modal') closeModal(); };

// 앞으로 지시가 나가 있는 날짜들을 모아 보여준다 (금요일의 토·월 같은 경우)
function futureDates(){
  const set = new Set();
  ROWS.forEach(r=>{ const d = pickupOf(r); if (d && d > TODAY) set.add(d); });
  return [...set].sort().slice(0,7);
}
function dateLabel(v){
  if (v === 'today') return '오늘까지';
  if (v === 'done')  return '처리내역(3일)';
  if (v === 'all')   return '전체';
  const d = new Date(v+'T00:00:00');
  return `${d.getMonth()+1}/${d.getDate()}(${'일월화수목금토'[d.getDay()]})`;
}
function countDate(v){
  const save = DATEF; DATEF = v;
  const n = ROWS.filter(visible).length;
  DATEF = save; return n;
}

function openDate(){
  const fut = futureDates();
  const opt = (v,desc)=>`<button class="opt ${DATEF===v?'on':''}" onclick="setDate('${v}')">
      ${dateLabel(v)}${desc?` <span style="font-size:12px;color:var(--dim);font-weight:600">${desc}</span>`:''}
      <span style="float:right;color:#94a3b8;font-weight:700">${countDate(v)}</span></button>`;
  showModal(`<h3>수거일</h3>
    ${opt('today','오늘 + 지난 미완료')}
    ${fut.length ? `<div style="font-size:12px;color:var(--dim);margin:12px 0 6px">앞으로 지시된 날</div>`
                 + fut.map(d=>opt(d)).join('') : ''}
    <div style="font-size:12px;color:var(--dim);margin:12px 0 6px">처리내역</div>
    ${opt('done','최근 3작업일 처리한 건')}
    <div class="mrow"><button class="cancel" onclick="closeModal()">닫기</button></div>`);
}

function setDate(v){
  DATEF = v; localStorage.setItem('datef', v);
  closeModal(); render(); fitZone();
}

function countIn(zone){ return ROWS.filter(r=>zoneOf(r)===zone && inDate(r)).length; }

// [10_1] showCnt=false → 숫자 없이 구역 이름만 (첫 접속 수거원 화면에서 사용)
function zoneChips(sel, showCnt = true){
  const row = z=>`<button class="chip zchip ${sel.includes(z)?'on':''}" data-z="${z}" onclick="toggleChip(this)">
      ${z}${showCnt ? `<span class="cnt">${countIn(z)}</span>` : ''}</button>`;
  return `
    <div class="chips">${['잠실동','삼전동','가락시장'].map(row).join('')}</div>
    <div style="font-size:12px;color:var(--dim);margin:11px 0 6px">잠실3동 아파트</div>
    <div class="chips">${APT_LIST.map(row).join('')}</div>`;
}
function toggleChip(el){ el.classList.toggle('on'); }
function clearZoneChips(){
  document.querySelectorAll('.zchip.on').forEach(el=>el.classList.remove('on'));
}
// 구역 칩(.zchip)만 읽는다. 수거원 이름 칩도 .chip 이라 예전엔 이름이 구역에 섞여 들어갔다.

function setZones(list){
  ZONES = list || [];
  localStorage.setItem('zones', JSON.stringify(ZONES));
  SHOW_QUOTE = false;
  localStorage.setItem('show_special','0');
  localStorage.setItem('show_quote','0');
  closeModal(); render(); fitZone();
}

function fitZone(){
  if (VIEW!=='map' || !map) return;
  const rows = ROWS.filter(r=>visible(r) && r._pt);
  if (!rows.length) return;
  const b = new kakao.maps.LatLngBounds();
  rows.forEach(r=>b.extend(new kakao.maps.LatLng(r._pt.lat, r._pt.lng)));
  map.setBounds(b, 50, 50, 50, 50);
}

// 수거원 — 지시서에 쓰인 이름을 모아 보여주고, 없으면 직접 입력
let WORKER_NAMES = [];
// [10_1] 수거원 이름 목록 정리 — 최근 30일 안에 실제로 처리한 이름만 보인다.
//   사무실 직접입력·야간팀(자동)·종이지시서 같은 표시용 이름은 뺀다.
//   예전 기록은 그대로 두고 화면 목록만 정리. 지금 이 폰의 수거원 이름은 항상 보인다.
const WORKER_EXCLUDE = new Set(['사무실 직접입력','야간팀(자동)','종이지시서','종이지시서참고']);
function collectWorkers(){
  const set = new Set();
  const cutoff = Date.now() - 30*24*60*60*1000;
  Object.values(receipts).forEach(r=>{
    if (!r || !r._work일시) return;
    const t = new Date(r._work일시).getTime();
    if (!(t >= cutoff)) return;
    const n = String(r._work수거원 || r.수거원 || '').trim();
    if (n) set.add(n);
  });
  if (WORKER) set.add(String(WORKER).trim());
  WORKER_NAMES = [...set].filter(n => n && !WORKER_EXCLUDE.has(n)).sort();
}

// 이름과 담당 구역을 한 화면에서 받는다 — 첫 실행 때만 뜨고 다음부턴 자동
function openWorker(){
  collectWorkers();
  showModal(`
    <h3>수거원</h3>
    ${WORKER_NAMES.length ? `<div class="chips" style="margin-bottom:9px">
      ${WORKER_NAMES.map(n=>`<button class="chip ${WORKER===n?'on':''}"
         onclick="document.getElementById('wname').value='${esc(n)}';
                  [...this.parentNode.children].forEach(c=>c.classList.remove('on'));
                  this.classList.add('on')">${esc(n)}</button>`).join('')}
    </div>` : ''}
    <input id="wname" placeholder="이름을 입력하세요" value="${esc(WORKER)}" autocomplete="off">

    <div style="display:flex;align-items:center;justify-content:space-between;margin:16px 0 7px">
      <div style="font-size:13px;font-weight:800">담당 구역
        <span style="font-size:12px;color:var(--dim);font-weight:600">여러 개 선택 · 안 고르면 전체</span></div>
      <button type="button" class="allbtn" onclick="clearZoneChips()">전체</button>
    </div>
    ${zoneChips(ZONES, false)}

    <div class="mrow">
      <button class="okb" style="flex:1" onclick="saveLogin()">시작하기</button>
    </div>`);
}

function saveLogin(){
  const n = (document.getElementById('wname').value||'').trim();
  if (!n){ toast('이름을 입력하세요'); return; }
  WORKER = n;
  localStorage.setItem('worker', n);
  const list = new Set(WORKER_NAMES); list.add(n);
  localStorage.setItem('workers', JSON.stringify([...list]));

  ZONES = readChips();
  localStorage.setItem('zones', JSON.stringify(ZONES));

  closeModal(); render(); fitZone();
  toast('👤 '+n+' · '+zoneLabel());
}

let toastT = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.display='block';
  clearTimeout(toastT);
  toastT = setTimeout(()=>el.style.display='none', 2200);
}

function loadKakaoMap(){
  return new Promise((ok,fail)=>{
    if (KAKAO_JS_KEY === 'YOUR_KAKAO_JS_KEY'){ fail('nokey'); return; }
    const s = document.createElement('script');
    s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_JS_KEY}&autoload=false`;
    s.onload  = ()=> kakao.maps.load(ok);
    s.onerror = ()=> fail('load');
    document.head.appendChild(s);
  });
}

// 마지막으로 받은 데이터를 기기에 남겨둔다.
// 지하 주차장처럼 신호가 없는 곳에서 앱을 열어도 목록이 바로 보여야 한다.
const CACHE = 'work_cache';
function saveCache(){
  try{
    // [8_27] 기사앱 배지(_jiseo_app_date) 기준으로 캐시 — 엑셀만 나간 건은 넣지 않음
    localStorage.setItem(CACHE, JSON.stringify({
      at:Date.now(), coords:coordCache, holi:customHolidays,
      rows:Object.fromEntries(Object.entries(receipts).filter(([k,r])=>r && r._jiseo_app_date))
    }));
  }catch(e){}
}
function loadCache(){
  try{
    const c = JSON.parse(localStorage.getItem(CACHE)||'null');
    if (!c) return false;
    coordCache = c.coords||{};
    customHolidays = c.holi||{};
    receipts = c.rows||{};
    buildRows(); collectWorkers(); render();
    return ROWS.length>0;
  }catch(e){ return false; }
}

// [8_28] 하루 첫 보안코드 통과 시 — 어제(이전) 작업 캐시를 비운다.
//   · work_cache 만 삭제 (목록이 어제 상태로 먼저 뜨는 것 방지)
//   · pending_work 큐는 미전송 처리가 있을 수 있어 절대 지우지 않음
//   · 수거원·담당구역 설정은 유지
//   · 날짜 필터는 "오늘까지"로 되돌려, 어제 고른 특정 날짜에 묶이지 않게 함
const FRESH_BOOT_KEY = 'work_fresh_boot';
function clearStaleDayCache(){
  try{ localStorage.removeItem(CACHE); }catch(e){}
  try{ localStorage.setItem('datef', 'today'); }catch(e){}
  try{ localStorage.setItem(FRESH_BOOT_KEY, '1'); }catch(e){}
  try{ DATEF = 'today'; }catch(e){}
  receipts = {};
  ROWS = [];
}

function withTimeout(promise, ms){
  return Promise.race([promise, new Promise((_,rej)=>setTimeout(()=>rej('timeout'), ms))]);
}

function hideBoot(){ document.getElementById('boot').style.display='none'; }

function mapFallback(){
  document.getElementById('map').innerHTML = `
    <div style="display:flex;height:100%;align-items:center;justify-content:center;padding:30px;text-align:center">
      <div>
        <div style="font-size:34px">🗺</div>
        <div style="font-size:15px;font-weight:800;margin:12px 0 8px">지도를 열지 못했습니다</div>
        <div style="font-size:13px;color:#94a3b8;line-height:1.7">
          이 주소가 카카오 개발자센터의<br>
          <b style="color:#f1f5f9">플랫폼 &gt; Web</b> 에 등록돼 있는지 확인하세요.<br><br>
          목록 화면은 그대로 쓸 수 있습니다.
        </div>
        <button class="okb" style="margin-top:16px;padding:12px 20px;border-radius:10px;font-weight:800"
                onclick="if(VIEW==='map')toggleView()">목록 보기</button>
      </div>
    </div>`;
}

async function boot(){
  const msg = document.getElementById('bootmsg');

  // [8_28] 오늘 첫 보안코드 통과 직후면 캐시를 비운 상태 — 안내 후 서버에서 받음
  let freshBoot = false;
  try{
    if (localStorage.getItem(FRESH_BOOT_KEY) === '1'){
      localStorage.removeItem(FRESH_BOOT_KEY);
      freshBoot = true;
    }
  }catch(e){}

  // ① 기기에 남은 데이터로 화면부터 띄운다 — 연결을 기다리지 않는다
  //    (하루 첫 입장에서는 clearStaleDayCache 로 비워 두었으므로 캐시 없음)
  const hadCache = loadCache();
  if (hadCache) hideBoot();
  else msg.textContent = freshBoot ? '오늘 작업 목록을 새로 불러오는 중…' : '불러오는 중…';
  if (freshBoot) setTimeout(()=>toast('🔄 어제 캐시를 지우고 오늘 목록을 불러옵니다'), 600);

  // ② 지도와 데이터를 동시에 시작한다. 한쪽이 늦어도 다른 쪽은 진행된다.
  loadKakaoMap().then(initMap).catch(mapFallback);

  // ③ 설정값 — 못 읽어도 기본값으로 계속 간다
  withTimeout(db.ref(DB_HOLIDAYS).once('value'), 8000).then(s=>{
    Object.entries(s.val()||{}).forEach(([k,v])=>{ customHolidays[k.replace(/_/g,'-')] = v; });
  }).catch(()=>{});

  withTimeout(db.ref(DB_COORD).once('value'), 8000).then(s=>{
    coordCache = {...coordCache, ...(s.val()||{})};
    buildRows(); render();
  }).catch(()=>{});

  startData();

  // ④ 연결이 아예 안 되고 캐시도 없으면 안내를 띄운다
  setTimeout(()=>{
    const b = document.getElementById('boot');
    if (b.style.display !== 'none'){
      msg.innerHTML = navigator.onLine
        ? '연결이 느립니다…<br><span style="font-size:12px">잠시 후에도 안 되면 새로고침하세요</span>'
        : '📴 오프라인입니다<br><span style="font-size:12px">신호가 잡히면 자동으로 불러옵니다</span>';
    }
  }, 9000);
}

// [10_1] 사용량 절감: 접수 건 전체가 아니라 "최근 7일 안에 기사앱으로 보낸 건"만 받는다.
//   (화면에 보이는 건 지금과 똑같다 — 기사앱 목록은 원래 _jiseo_app_date 가 있는 건만 쓴다)
//   Firebase 규칙에 receipt_data ".indexOn": ["_jiseo_app_date"] 가 있어야 서버에서 잘라 보낸다.
const APP_RECENT_DAYS = 7;
// [10_15] 하루 두 번(아침 첫 화면 / 17시 이후 첫 화면) 목록을 서버에서 통째로 다시 받는다.
//   일부 폰은 절전 뒤 재연결이 늦어 새로 보낸 건이 안 뜨는 일이 있었다.
//   페이지 새로고침이 아니라 목록 연결만 다시 하므로 비밀번호·지도는 다시 안 불러온다. (1회 약 1MB)
let DATA_Q = null;
const FORCE_KEY = 'work_force_slot';
function forceSlot(){ const d = new Date(); return toYMD(d) + (d.getHours() >= 17 ? '-pm' : '-am'); }
function markForceSlot(){ try{ localStorage.setItem(FORCE_KEY, forceSlot()); }catch(e){} }
function maybeForceRefresh(){
  let last = ''; try{ last = localStorage.getItem(FORCE_KEY) || ''; }catch(e){}
  if (last === forceSlot()) return false;
  markForceSlot();
  try{ if (DATA_Q) DATA_Q.off(); }catch(e){}
  startData();
  return true;
}
function startData(){
  const since = toYMD(addDays(new Date(), -APP_RECENT_DAYS));
  markForceSlot();
  DATA_Q = db.ref(DB_RECEIPT).orderByChild('_jiseo_app_date').startAt(since);
  DATA_Q.on('value', snap=>{
    receipts = snap.val() || {};
    TODAY = toYMD(new Date());
    buildRows();
    collectWorkers();
    render();
    hideBoot();
    saveCache();
    if (!WORKER) openWorker();
    fillMissingCoords();
  }, err=>{
    // 읽기 실패 — 캐시가 있으면 그대로 쓴다
    hideBoot();
    if (!ROWS.length) toast('데이터를 읽지 못했습니다');
  });
  showOffbar();
  flushQueue();
}

/* ══════════════════════════════════════════════════════════════
   폰 하드웨어 뒤로가기 — 시트/모달 열려있으면 그것만 닫고,
   맨 위 화면(지도/목록)에서는 한 번 더 눌러야 실제로 나가진다.
   ══════════════════════════════════════════════════════════════ */
let exitArmed = false, exitArmedT = null;
function armBackGuard(){
  history.replaceState({root:true}, '');
  history.pushState({root:true}, '');   // 뒤로가기 한 칸을 항상 확보해둠
  window.addEventListener('popstate', (e)=>{
    const st = e.state;
    if (st && st.sheet){ closeSheet(); return; }
    // 모달이 열려있으면 모달만 닫는다
    const modal = document.getElementById('modal');
    if (modal && modal.classList.contains('show')){ closeModal(); history.pushState({root:true},''); return; }
    const sheet = document.getElementById('sheet');
    if (sheet && sheet.classList.contains('show')){ closeSheet(); history.pushState({root:true},''); return; }
    // 맨 위 화면 — 한 번 더 눌러야 종료
    if (exitArmed){ return; }  // 두 번째 뒤로가기는 그대로 통과시켜 앱을 나감
    exitArmed = true;
    toast('한 번 더 뒤로가면 앱이 종료됩니다');
    history.pushState({root:true}, '');
    clearTimeout(exitArmedT);
    exitArmedT = setTimeout(()=>{ exitArmed = false; }, 2000);
  });
}

/* ══════════════════════════════════════════════════════════════
   접근 보안코드 — 링크만 아는 외부인 진입 차단용.
   [10_1] 직원 계정(staff@boneco.kr) 비밀번호로 Firebase 로그인.
   [8_27] 하루 1회 통과
     · 오늘 날짜(passDate)가 localStorage 에 있으면 보안창 생략
     · 뒤로가기·홈·브라우저 종료 후 재진입해도 당일에는 바로 작업 화면
     · 자정 지나 날짜가 바뀌면 다시 보안창
   [8_28] 하루 첫 보안코드 입력 시
     · work_cache(어제 작업 목록 캐시) 삭제 후 location.reload()
     · 서버에서 오늘 목록을 다시 받음 (어제 건수가 먼저 뜨는 현상 방지)
     · pending_work(미전송 큐)·수거원·구역 설정은 유지
   ══════════════════════════════════════════════════════════════ */
const GATE_PASS_KEY = 'work_gate_passDate';

function todayYMD(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function hasPassedGateToday(){
  try{ return localStorage.getItem(GATE_PASS_KEY) === todayYMD(); }
  catch(e){ return false; }
}
function markGatePassedToday(){
  try{ localStorage.setItem(GATE_PASS_KEY, todayYMD()); }catch(e){}
}

function startApp(){
  document.getElementById('gate').style.display = 'none';
  armBackGuard();
  boot();
}
async function checkGate(){
  const v = (document.getElementById('gateInput').value || '').trim();
  const err = document.getElementById('gateErr');
  if (!v){ err.textContent = '비밀번호를 입력해 주세요'; return; }
  err.textContent = '확인 중…';
  let ok = false;
  try { await firebase.auth().signInWithEmailAndPassword(STAFF_EMAIL, v); ok = true; }   // [10_1] 직원 계정 로그인
  catch(e){ err.textContent = staffLoginErrMsg(e); document.getElementById('gateInput').value = ''; }
  if (ok){
    err.textContent = '';
    // [8_28] 하루 첫 통과: 이전 작업 캐시 삭제 → 새로고침 → 서버 최신 목록
    //   당일 재진입(hasPassedGateToday)은 보안창 자체가 안 뜨므로 여기로 오지 않음
    //   → 같은 날 안의 오프라인 캐시·빠른 재실행은 그대로 유지
    markGatePassedToday();
    clearStaleDayCache();
    location.reload();
  }
}
(async function initGate(){
  document.getElementById('boot').style.display = 'none';
  // [10_1] 오늘 통과했어도 직원 로그인이 살아 있어야 자료를 읽을 수 있다 — 없으면 비밀번호 창
  if (hasPassedGateToday() && !isStaffUser(await waitAuthState())){
    try{ localStorage.removeItem(GATE_PASS_KEY); }catch(e){}
  }
  // 오늘 이미 통과했으면 보안창 생략
  if (hasPassedGateToday()){
    startApp();
    return;
  }
  setTimeout(()=>{ const el=document.getElementById('gateInput'); if(el) el.focus(); }, 150);
})();
</script>
