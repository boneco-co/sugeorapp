<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="수거앱">
<meta name="theme-color" content="#1a56db">
<title>수거 작업 앱</title>
<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=b8908c96799936ef733a0445f1bd6abc&libraries=services,clusterer,drawing"></script>
<style>
:root{
  --blue:#1a56db;--blue-d:#1344b8;--blue-l:#e8f0fe;
  --red:#dc2626;--red-l:#fee2e2;
  --yellow:#d97706;--yellow-l:#fef3c7;
  --green:#16a34a;--green-l:#dcfce7;
  --purple:#7c3aed;--purple-l:#ede9fe;
  --gray:#6b7280;--gray-l:#f3f4f6;
  --text:#111827;--text2:#6b7280;
  --white:#fff;--bg:#f0f4f8;--border:#e5e7eb;
  --font:'Noto Sans KR',-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--text);}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

/* 헤더 */
.hdr{background:var(--blue);padding:max(14px,env(safe-area-inset-top)) 14px 10px;flex-shrink:0;}
.hdr-row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.hdr-title{font-size:19px;font-weight:700;color:#fff;display:flex;align-items:center;gap:7px;}
.hdr-stats{display:flex;gap:7px;}
.stat{background:rgba(255,255,255,.18);border-radius:10px;padding:5px 12px;text-align:center;}
.stat-n{font-size:20px;font-weight:900;color:#fff;line-height:1;}
.stat-l{font-size:10px;color:rgba(255,255,255,.8);margin-top:1px;}
.filter-row{display:flex;gap:6px;}
.fb{flex:1;padding:11px 6px;border-radius:11px;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);font-family:var(--font);font-size:14px;font-weight:700;color:rgba(255,255,255,.8);cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .15s;}
.fb .fi{font-size:20px;}
.fb.on-all{background:#fff;border-color:#fff;color:var(--blue);}
.fb.on-heavy{background:var(--red);border-color:var(--red);color:#fff;}
.fb.on-light{background:var(--green);border-color:var(--green);color:#fff;}
.fb:active{transform:scale(.95);}

/* 메인 탭 */
.main-tabs{display:flex;background:var(--white);border-bottom:2px solid var(--border);flex-shrink:0;}
.main-tab{flex:1;padding:13px 8px;text-align:center;font-size:16px;font-weight:700;color:var(--gray);border-bottom:3px solid transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
.main-tab.on{color:var(--blue);border-bottom-color:var(--blue);}
.tab-cnt{font-size:11px;background:var(--red);color:#fff;padding:1px 6px;border-radius:10px;font-weight:700;}
.main-tab.on .tab-cnt{background:var(--blue);}

/* 콘텐츠 */
.content{flex:1;overflow:hidden;position:relative;}
.screen{position:absolute;inset:0;display:none;flex-direction:column;}
.screen.on{display:flex;}

/* 목록 */
.list-body{flex:1;overflow-y:auto;padding:10px;-webkit-overflow-scrolling:touch;}
.list-body::-webkit-scrollbar{display:none;}
.sec-hdr{display:flex;align-items:center;gap:8px;padding:8px 2px 5px;margin-top:6px;}
.sec-hdr:first-child{margin-top:0;}
.sbadge{font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;}
.sb-red{background:var(--red-l);color:var(--red);}
.sb-yellow{background:var(--yellow-l);color:var(--yellow);}
.sb-green{background:var(--green-l);color:var(--green);}
.sb-gray{background:var(--gray-l);color:var(--gray);}
.sb-purple{background:var(--purple-l);color:var(--purple);}
.sec-cnt{font-size:12px;color:var(--text2);}

/* 작업 카드 */
.jcard{background:var(--white);border-radius:16px;margin-bottom:10px;border:2px solid var(--border);overflow:hidden;}
.jcard.ga{border-left:5px solid var(--red);}
.jcard.gb{border-left:5px solid var(--yellow);}
.jcard.gc{border-left:5px solid var(--green);}
.jcard.gr{border-left:5px solid var(--purple);background:#faf5ff;}
.jcard.done-card{opacity:.5;}
.jc-inner{padding:14px 14px 12px;}
.jc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
.jc-seq{font-size:12px;color:var(--text2);font-weight:600;}
.gtag{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700;}
.gta{background:var(--red-l);color:var(--red);}
.gtb{background:var(--yellow-l);color:var(--yellow);}
.gtc{background:var(--green-l);color:var(--green);}
.gtr{background:var(--purple-l);color:var(--purple);}
.jc-name{font-size:22px;font-weight:900;margin-bottom:3px;}
.jc-item{font-size:17px;font-weight:700;color:var(--blue);margin-bottom:6px;}
.jc-addr{font-size:15px;color:var(--text2);line-height:1.4;margin-bottom:8px;}
.jc-memo{background:var(--gray-l);border-radius:8px;padding:8px 11px;font-size:14px;color:var(--text2);margin-bottom:10px;line-height:1.5;}
.rollover-alert{background:var(--purple-l);border-radius:8px;padding:8px 11px;font-size:13px;color:var(--purple);font-weight:600;margin-bottom:10px;}
.navi-btn{width:100%;padding:15px;border-radius:12px;border:none;background:var(--blue);color:#fff;font-family:var(--font);font-size:17px;font-weight:700;cursor:pointer;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:7px;}
.navi-btn:active{background:var(--blue-d);transform:scale(.98);}
.res-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;}
.rb{padding:13px 5px;border-radius:12px;border:2px solid;font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;user-select:none;-webkit-user-select:none;position:relative;overflow:hidden;}
.rb .ri{font-size:22px;}
.rb .hint{font-size:10px;opacity:.65;}
.rb-done{background:var(--green-l);border-color:var(--green);color:var(--green);}
.rb-partial{background:var(--yellow-l);border-color:var(--yellow);color:var(--yellow);}
.rb-absent{background:var(--red-l);border-color:var(--red);color:var(--red);}
.rb .pp{position:absolute;bottom:0;left:0;height:4px;background:currentColor;width:0%;transition:width 2s linear;opacity:.4;}
.rb.pressing .pp{width:100%;}
.delay-btn{width:100%;margin-top:7px;padding:12px;border-radius:12px;border:2px solid var(--gray);background:var(--gray-l);color:var(--gray);font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
.done-badge{background:var(--green-l);border-radius:10px;padding:10px;text-align:center;font-size:15px;font-weight:700;color:var(--green);}

/* 지도 */
.map-screen{position:relative;flex:1;}
#kakao-map{width:100%;height:100%;}
.map-filter-pill{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.72);color:#fff;border-radius:20px;padding:7px 18px;font-size:13px;font-weight:700;z-index:10;display:none;white-space:nowrap;}
.map-filter-pill.on{display:block;}
.map-legend{position:absolute;bottom:16px;left:12px;background:rgba(255,255,255,.96);border-radius:14px;padding:12px 16px;box-shadow:0 2px 16px rgba(0,0,0,.15);font-size:13px;z-index:10;}
.lg-row{display:flex;align-items:center;gap:9px;margin-bottom:6px;}
.lg-row:last-child{margin-bottom:0;}
.lg-dot{width:13px;height:13px;border-radius:50%;flex-shrink:0;border:2px solid rgba(0,0,0,.1);}
.map-zoom-btns{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;z-index:10;}
.zoom-btn{width:44px;height:44px;background:var(--white);border-radius:10px;border:1px solid var(--border);font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.12);font-weight:700;color:var(--text);}
.zoom-btn:active{background:var(--blue-l);}

/* 핀 시트 */
.pin-sheet{position:absolute;bottom:0;left:0;right:0;z-index:20;background:var(--white);border-radius:20px 20px 0 0;padding:16px 16px max(20px,env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.15);transform:translateY(100%);transition:transform .3s ease;}
.pin-sheet.open{transform:translateY(0);}
.pin-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px;}
.ps-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.ps-name{font-size:20px;font-weight:900;}
.ps-close{background:none;border:none;color:var(--gray);font-size:20px;cursor:pointer;padding:2px;}
.ps-item{font-size:16px;font-weight:700;color:var(--blue);margin-bottom:5px;}
.ps-addr{font-size:14px;color:var(--text2);margin-bottom:12px;line-height:1.4;}
.ps-navi{width:100%;padding:14px;border-radius:12px;border:none;background:var(--blue);color:#fff;font-family:var(--font);font-size:16px;font-weight:700;cursor:pointer;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:7px;}
.ps-list-btn{width:100%;padding:12px;border-radius:12px;border:2px solid var(--border);background:var(--gray-l);color:var(--gray);font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;}

/* 모달 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);}
.overlay.on{display:flex;animation:su .25s ease;}
@keyframes su{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.msheet{background:var(--white);border-radius:24px 24px 0 0;width:100%;max-height:85vh;overflow-y:auto;padding:18px 16px max(30px,env(safe-area-inset-bottom));}
.mhandle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px;}
.mtitle{font-size:20px;font-weight:700;margin-bottom:4px;}
.mitem{font-size:15px;color:var(--blue);font-weight:600;margin-bottom:14px;}
.photo-zone{border:3px dashed var(--border);border-radius:16px;padding:22px;text-align:center;margin-bottom:14px;cursor:pointer;background:var(--gray-l);transition:all .2s;}
.photo-zone.ok{border-color:var(--green);border-style:solid;background:var(--green-l);}
.pz-icon{font-size:36px;margin-bottom:6px;}
.pz-text{font-size:16px;font-weight:700;color:var(--text2);}
.pz-sub{font-size:13px;color:var(--text2);margin-top:3px;}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;justify-content:center;}
.thumb{width:65px;height:65px;border-radius:10px;background:var(--white);border:2px solid var(--green);display:flex;align-items:center;justify-content:center;font-size:26px;}
.delay-info{background:var(--yellow-l);border-radius:12px;padding:14px;margin-bottom:14px;}
.di-label{font-size:13px;font-weight:700;color:var(--yellow);margin-bottom:5px;}
.di-date{font-size:22px;font-weight:900;color:var(--yellow);}
.di-reason{font-size:12px;color:var(--yellow);margin-top:4px;opacity:.85;}
.mwarn{background:var(--red-l);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--red);font-weight:600;margin-bottom:12px;display:none;}
.mwarn.on{display:block;}
.mconfirm{width:100%;padding:17px;border-radius:14px;border:none;font-family:var(--font);font-size:17px;font-weight:700;cursor:pointer;margin-top:6px;}
.mc-partial{background:var(--yellow);color:#fff;}
.mc-absent{background:var(--red);color:#fff;}
.mc-delay{background:var(--gray);color:#fff;}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 20px;border-radius:12px;font-size:15px;font-weight:600;z-index:999;display:none;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.3);}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div class="hdr-row1">
      <div class="hdr-title">🚛 오늘 수거 작업</div>
      <div class="hdr-stats">
        <div class="stat"><div class="stat-n" id="s-remain">0</div><div class="stat-l">남은 건</div></div>
        <div class="stat"><div class="stat-n" id="s-done">0</div><div class="stat-l">완료</div></div>
      </div>
    </div>
    <div class="filter-row">
      <button class="fb on-all" id="fb-all" onclick="setFilter('all')"><span class="fi">📋</span>전체보기</button>
      <button class="fb" id="fb-heavy" onclick="setFilter('heavy')"><span class="fi">🧊</span>무거운 것</button>
      <button class="fb" id="fb-light" onclick="setFilter('light')"><span class="fi">🪑</span>가벼운 것</button>
    </div>
  </div>
  <div class="main-tabs">
    <div class="main-tab on" id="mtab-list" onclick="goTab('list')">📋 목록 <span class="tab-cnt" id="list-cnt">0</span></div>
    <div class="main-tab" id="mtab-map" onclick="goTab('map')">🗺 지도 <span class="tab-cnt" id="map-cnt">0</span></div>
  </div>
  <div class="content">
    <div class="screen on" id="sc-list"><div class="list-body" id="job-list"></div></div>
    <div class="screen" id="sc-map">
      <div class="map-screen">
        <div id="kakao-map"></div>
        <div class="map-filter-pill" id="map-pill"></div>
        <div class="map-zoom-btns">
          <button class="zoom-btn" onclick="zoomMap(1)">＋</button>
          <button class="zoom-btn" onclick="zoomMap(-1)">－</button>
        </div>
        <div class="map-legend">
          <div class="lg-row"><div class="lg-dot" style="background:#dc2626"></div> 무거운 것</div>
          <div class="lg-row"><div class="lg-dot" style="background:#d97706"></div> 중간</div>
          <div class="lg-row"><div class="lg-dot" style="background:#16a34a"></div> 가벼운 것</div>
          <div class="lg-row"><div class="lg-dot" style="background:#7c3aed"></div> 이월 건</div>
          <div class="lg-row"><div class="lg-dot" style="background:#1a56db"></div> 뭉침(숫자)</div>
        </div>
        <div class="pin-sheet" id="pin-sheet">
          <div class="pin-handle"></div>
          <div class="ps-top">
            <div>
              <div class="ps-name" id="ps-name"></div>
              <div class="ps-item" id="ps-item"></div>
              <div class="ps-addr" id="ps-addr"></div>
            </div>
            <button class="ps-close" onclick="closePinSheet()">✕</button>
          </div>
          <button class="ps-navi" id="ps-navi-btn">🗺 카카오맵으로 길찾기</button>
          <button class="ps-list-btn" onclick="goToListItem()">📋 목록에서 자세히 보기</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="ov-partial">
  <div class="msheet">
    <div class="mhandle"></div>
    <div class="mtitle">📦 일부만 있음</div>
    <div class="mitem" id="mp-item"></div>
    <div class="photo-zone" id="mp-zone" onclick="takePhoto('partial')">
      <div class="pz-icon">📷</div><div class="pz-text">현장 사진 촬영 (필수)</div>
      <div class="pz-sub">탭하여 사진 찍기</div><div class="thumbs" id="mp-thumbs"></div>
    </div>
    <div class="mwarn" id="mp-warn">📸 사진을 먼저 찍어주세요</div>
    <button class="mconfirm mc-partial" onclick="confirmModal('partial')">📦 일부 수거 확정 → 사무실 전송</button>
  </div>
</div>

<div class="overlay" id="ov-absent">
  <div class="msheet">
    <div class="mhandle"></div>
    <div class="mtitle">❌ 물건이 없음</div>
    <div class="mitem" id="ma-item"></div>
    <div style="background:var(--red-l);border-radius:12px;padding:12px;font-size:14px;color:var(--red);margin-bottom:14px;line-height:1.6;">현장 바닥/장소를 찍어주세요.<br>사무실에 바로 전송됩니다.</div>
    <div class="photo-zone" id="ma-zone" onclick="takePhoto('absent')">
      <div class="pz-icon">📷</div><div class="pz-text">현장 증빙 사진 (필수)</div>
      <div class="pz-sub">탭하여 촬영</div><div class="thumbs" id="ma-thumbs"></div>
    </div>
    <div class="mwarn" id="ma-warn">📸 사진을 먼저 찍어주세요</div>
    <button class="mconfirm mc-absent" onclick="confirmModal('absent')">❌ 물건 없음 확정 → 사무실 전송</button>
  </div>
</div>

<div class="overlay" id="ov-delay">
  <div class="msheet">
    <div class="mhandle"></div>
    <div class="mtitle">📅 내일로 미루기</div>
    <div class="mitem" id="md-item"></div>
    <div class="delay-info">
      <div class="di-label">다음 수거 예정일</div>
      <div class="di-date" id="md-date">-</div>
      <div class="di-reason" id="md-reason"></div>
    </div>
    <div style="font-size:14px;color:var(--text2);line-height:1.7;margin-bottom:14px;">위 날짜로 자동 이월됩니다.<br>사무실 캘린더에 바로 반영됩니다.</div>
    <button class="mconfirm mc-delay" onclick="confirmModal('delay')">📅 이월 확정</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CONFIG={holidays:['2026-03-01','2026-05-05','2026-06-06'],holidayWork:false,wrongAreas:['엘스','리센츠','갤러리아팰리스','파크리오','아시아선수촌']};
const GA=['냉장고','매트리스','안마의자','장롱','소파','보일러','세탁기','에어컨','피아노','금고','올갠'];
const GC_KW=['의자','이불','행거','커튼','자전거','유모차','가방','빨래건조대','아이스박스','액자','장판','카페트','선풍기','킥보드','텐트','화분','소화기','도마','베개','방석','인형'];
function getGrade(item){const n=item.replace(/\s/g,'');if(GA.some(k=>n.includes(k)))return'A';if(GC_KW.some(k=>n.includes(k)))return'C';return'B';}
function isHoliday(d){return CONFIG.holidays.includes(fmt(d));}
function isWorkday(d){return d.getDay()!==0&&!(isHoliday(d)&&!CONFIG.holidayWork);}
function nextWorkday(from){const d=new Date(from);d.setDate(d.getDate()+1);while(!isWorkday(d))d.setDate(d.getDate()+1);return d;}
function calcDelay(job){
  const today=new Date();
  if(job.addr.includes('5단지')||job.addr.includes('주공')){
    const d=new Date(today);d.setDate(d.getDate()+1);
    while(d.getDay()!==1)d.setDate(d.getDate()+1);
    while(!isWorkday(d))d.setDate(d.getDate()+7);
    return{date:d,reason:'잠실주공 5단지 — 월요일 수거 원칙'};
  }
  const next=nextWorkday(today);
  const dow=today.getDay();
  return{date:next,reason:dow===5?'금요일 → 월요일 이월':dow===6?'토요일 → 월요일 이월':'익일 수거'};
}
function fmt(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function fmtKr(d){const W=['일','월','화','수','목','금','토'];return`${d.getMonth()+1}월 ${d.getDate()}일 (${W[d.getDay()]}요일)`;}

const RAW=[
  {id:'001',name:'김영희',phone:'010-1111-2222',addr:'잠실동 88-3',item:'냉장고 300L이상',amount:7000,memo:'1층 분리수거장 앞',lat:37.5107,lng:127.0810,rollover:false},
  {id:'002',name:'이민수',phone:'010-9876-5432',addr:'삼전동 126-1',item:'매트리스 2인용',amount:8000,memo:'현관문 앞',lat:37.5063,lng:127.0899,rollover:false},
  {id:'003',name:'박지영',phone:'010-5555-7777',addr:'잠실본동 296-2',item:'소파 4인용',amount:13000,memo:'',lat:37.5091,lng:127.0875,rollover:false},
  {id:'004',name:'김철호',phone:'010-2222-8888',addr:'잠실주공5단지 515동',item:'안마의자',amount:10000,memo:'경비실에 맡겨뒀음',lat:37.5140,lng:127.0797,rollover:true},
  {id:'005',name:'최수연',phone:'010-3333-9999',addr:'문정동 150-22',item:'TV 42인치이상',amount:7000,memo:'',lat:37.4916,lng:127.1228,rollover:false},
  {id:'006',name:'정대한',phone:'010-7777-1111',addr:'삼전동 94-2',item:'장롱 100cm이상',amount:15000,memo:'3층 엘리베이터 있음',lat:37.5072,lng:127.0911,rollover:false},
  {id:'007',name:'홍길동',phone:'010-1234-5678',addr:'방이동 88-3',item:'의자 1인용',amount:2000,memo:'',lat:37.5149,lng:127.1055,rollover:false},
  {id:'008',name:'강민준',phone:'010-1111-2233',addr:'삼전동 94-2',item:'세탁기 10kg이상',amount:4000,memo:'베란다에 있음',lat:37.5071,lng:127.0912,rollover:false},
  {id:'009',name:'이서연',phone:'010-3344-5566',addr:'잠실본동 191',item:'이불 겨울용',amount:2000,memo:'쓰레기 배출장소',lat:37.5104,lng:127.0862,rollover:false},
  {id:'010',name:'박소은',phone:'010-2345-6789',addr:'삼전동 103-16',item:'에어컨 66㎡이상',amount:6000,memo:'',lat:37.5055,lng:127.0921,rollover:false},
  {id:'011',name:'윤지영',phone:'010-6677-8899',addr:'잠실본동 313-9',item:'침대 2인용 매트리스',amount:8000,memo:'',lat:37.5099,lng:127.0869,rollover:false},
  {id:'012',name:'송선애',phone:'010-5566-7788',addr:'삼전동 27-2',item:'이불 겨울용',amount:2000,memo:'',lat:37.5048,lng:127.0934,rollover:false},
];
const JOBS=RAW.filter(j=>!CONFIG.wrongAreas.some(kw=>j.addr.includes(kw))).map(j=>({...j,grade:getGrade(j.item),done:false,result:null}));

let curFilter='all',curTab='list',curJobId=null,curModal=null;
let photos={partial:[],absent:[]};
let pressTimer=null,kakaoMap=null,clusterer=null;
let customOverlays=[],selectedJobId=null;

window.addEventListener('DOMContentLoaded',()=>{
  renderJobs();updateStats();
  document.querySelectorAll('.overlay').forEach(o=>{o.addEventListener('click',e=>{if(e.target===o)closeModal();});});
  document.getElementById('pin-sheet').addEventListener('click',e=>e.stopPropagation());
});

function initMap(){
  if(kakaoMap){renderPins();return;}
  kakaoMap=new kakao.maps.Map(document.getElementById('kakao-map'),{center:new kakao.maps.LatLng(37.5091,127.0875),level:5});

  // 클러스터러
  clusterer=new kakao.maps.MarkerClusterer({
    map:kakaoMap,averageCenter:true,minLevel:4,minClusterSize:2,
    styles:[
      {width:'46px',height:'46px',background:'rgba(26,86,219,.88)',border:'3px solid #fff',borderRadius:'50%',color:'#fff',fontFamily:'Noto Sans KR,sans-serif',fontSize:'16px',fontWeight:'700',lineHeight:'40px',textAlign:'center',boxShadow:'0 3px 10px rgba(0,0,0,.3)'},
      {width:'56px',height:'56px',background:'rgba(220,38,38,.88)',border:'3px solid #fff',borderRadius:'50%',color:'#fff',fontFamily:'Noto Sans KR,sans-serif',fontSize:'17px',fontWeight:'700',lineHeight:'50px',textAlign:'center',boxShadow:'0 3px 10px rgba(0,0,0,.3)'},
      {width:'66px',height:'66px',background:'rgba(109,40,217,.88)',border:'3px solid #fff',borderRadius:'50%',color:'#fff',fontFamily:'Noto Sans KR,sans-serif',fontSize:'18px',fontWeight:'700',lineHeight:'60px',textAlign:'center',boxShadow:'0 3px 10px rgba(0,0,0,.3)'},
    ]
  });

  kakao.maps.event.addListener(kakaoMap,'click',()=>closePinSheet());
  renderPins();
}

const PIN_COLOR={A:'#dc2626',B:'#d97706',C:'#16a34a',R:'#7c3aed'};
const PIN_LABEL={A:'重',B:'中',C:'小'};

function renderPins(){
  customOverlays.forEach(o=>o.setMap(null));
  customOverlays=[];
  if(clusterer)clusterer.clear();
  const list=filteredJobs();
  const kakaoMarkers=[];

  list.forEach(job=>{
    const color=job.rollover?PIN_COLOR.R:PIN_COLOR[job.grade];
    const size=job.grade==='A'?15:job.grade==='B'?12:10;
    const pos=new kakao.maps.LatLng(job.lat,job.lng);

    // 클러스터러용 숨김 마커
    const mk=new kakao.maps.Marker({position:pos});
    mk.setMap(null);
    kakaoMarkers.push(mk);

    // 커스텀 핀
    const wrap=document.createElement('div');
    wrap.style.cssText='cursor:pointer;';
    const d=size*2+6;
    wrap.innerHTML=`<div style="width:${d}px;height:${d}px;background:${color};border:3px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:${size-1}px;color:#fff;font-weight:900;box-shadow:0 2px 10px rgba(0,0,0,.35);" data-id="${job.id}">${PIN_LABEL[job.grade]||'●'}</div>`;

    const overlay=new kakao.maps.CustomOverlay({position:pos,content:wrap,yAnchor:1.3,zIndex:3});
    overlay.setMap(kakaoMap);
    customOverlays.push(overlay);

    wrap.addEventListener('click',e=>{e.stopPropagation();openPinSheet(job.id);});
  });

  clusterer.addMarkers(kakaoMarkers);

  // 지도 범위
  if(list.length>0){
    const bounds=new kakao.maps.LatLngBounds();
    list.forEach(j=>bounds.extend(new kakao.maps.LatLng(j.lat,j.lng)));
    kakaoMap.setBounds(bounds,50);
  }
}

function zoomMap(delta){if(kakaoMap)kakaoMap.setLevel(kakaoMap.getLevel()-delta);}

function openPinSheet(id){
  selectedJobId=id;
  const j=JOBS.find(x=>x.id===id);if(!j)return;
  document.getElementById('ps-name').textContent=j.name;
  document.getElementById('ps-item').textContent=j.item;
  document.getElementById('ps-addr').textContent='📍 '+j.addr+(j.memo?' · '+j.memo:'');
  document.getElementById('ps-navi-btn').onclick=()=>openNavi(id);
  document.getElementById('pin-sheet').classList.add('open');
}
function closePinSheet(){document.getElementById('pin-sheet').classList.remove('open');selectedJobId=null;}
function goToListItem(){closePinSheet();goTab('list');setTimeout(()=>{const el=document.getElementById('jc-'+(selectedJobId||''));if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},250);}

function setFilter(f){
  curFilter=f;
  document.getElementById('fb-all').className='fb'+(f==='all'?' on-all':'');
  document.getElementById('fb-heavy').className='fb'+(f==='heavy'?' on-heavy':'');
  document.getElementById('fb-light').className='fb'+(f==='light'?' on-light':'');
  const pill=document.getElementById('map-pill');
  if(f==='heavy'){pill.textContent='🧊 무거운 것만 표시';pill.classList.add('on');}
  else if(f==='light'){pill.textContent='🪑 가벼운 것만 표시';pill.classList.add('on');}
  else pill.classList.remove('on');
  renderJobs();if(kakaoMap)renderPins();updateTabCnts();
}
function filteredJobs(){const a=JOBS.filter(j=>!j.done);if(curFilter==='heavy')return a.filter(j=>j.grade==='A');if(curFilter==='light')return a.filter(j=>j.grade==='C');return a;}

function goTab(t){
  curTab=t;
  document.getElementById('mtab-list').className='main-tab'+(t==='list'?' on':'');
  document.getElementById('mtab-map').className='main-tab'+(t==='map'?' on':'');
  document.getElementById('sc-list').className='screen'+(t==='list'?' on':'');
  document.getElementById('sc-map').className='screen'+(t==='map'?' on':'');
  if(t==='map'){if(typeof kakao!=='undefined'&&kakao.maps)initMap();else setTimeout(initMap,600);}
}

const GL={A:'🧊 무거운 것',B:'📦 중간',C:'🪑 가벼운 것'};
const GT={A:'gta',B:'gtb',C:'gtc'};
const GCM={A:'ga',B:'gb',C:'gc'};

function renderJobs(){
  const el=document.getElementById('job-list');
  const list=filteredJobs();const done=JOBS.filter(j=>j.done);
  if(!list.length&&!done.length){el.innerHTML='<div style="text-align:center;padding:60px 20px;"><div style="font-size:48px;margin-bottom:12px">🎉</div><div style="font-size:22px;font-weight:700;color:var(--green)">오늘 작업 완료!</div></div>';return;}
  let html='';
  if(curFilter==='heavy')html+=`<div style="background:var(--red-l);border-radius:12px;padding:11px 15px;margin-bottom:10px;font-size:14px;font-weight:600;color:var(--red);">🧊 무거운 것만 — 먼저 차에 실을 품목</div>`;
  else if(curFilter==='light')html+=`<div style="background:var(--green-l);border-radius:12px;padding:11px 15px;margin-bottom:10px;font-size:14px;font-weight:600;color:var(--green);">🪑 가벼운 것만 — 빈 자리에 나중에 실을 품목</div>`;
  const rolls=list.filter(j=>j.rollover);const normals=list.filter(j=>!j.rollover);
  if(rolls.length){html+=`<div class="sec-hdr"><span class="sbadge sb-purple">🔴 이월 건 (우선 처리)</span><span class="sec-cnt">${rolls.length}건</span></div>`;html+=rolls.map((j,i)=>cardHTML(j,i+1)).join('');}
  if(curFilter==='all'&&normals.length){
    const ga=normals.filter(j=>j.grade==='A'),gb=normals.filter(j=>j.grade==='B'),gc=normals.filter(j=>j.grade==='C');
    let seq=rolls.length+1;
    if(ga.length){html+=`<div class="sec-hdr"><span class="sbadge sb-red">🧊 먼저 실을 것</span><span class="sec-cnt">${ga.length}건</span></div>`;html+=ga.map((j,i)=>cardHTML(j,seq+i)).join('');seq+=ga.length;}
    if(gb.length){html+=`<div class="sec-hdr"><span class="sbadge sb-yellow">📦 중간</span><span class="sec-cnt">${gb.length}건</span></div>`;html+=gb.map((j,i)=>cardHTML(j,seq+i)).join('');seq+=gb.length;}
    if(gc.length){html+=`<div class="sec-hdr"><span class="sbadge sb-green">🪑 나중에 실을 것</span><span class="sec-cnt">${gc.length}건</span></div>`;html+=gc.map((j,i)=>cardHTML(j,seq+i)).join('');}
  } else {html+=normals.map((j,i)=>cardHTML(j,rolls.length+i+1)).join('');}
  if(done.length){
    html+=`<div class="sec-hdr" style="margin-top:14px;"><span class="sbadge sb-gray">✅ 완료 ${done.length}건</span></div>`;
    html+=done.map(j=>`<div class="jcard done-card ${j.rollover?'gr':GCM[j.grade]}"><div class="jc-inner"><div style="display:flex;justify-content:space-between;align-items:center;"><div class="jc-name" style="font-size:18px">${j.name}</div><div class="done-badge" style="padding:5px 12px;font-size:13px">${j.result==='complete'?'✅ 완료':j.result==='partial'?'📦 일부':j.result==='absent'?'❌ 없음':'📅 이월'}</div></div><div class="jc-item">${j.item}</div><div class="jc-addr">📍 ${j.addr}</div></div></div>`).join('');
  }
  el.innerHTML=html;updateTabCnts();
}

function cardHTML(j,seq){
  const cls=j.rollover?'gr':GCM[j.grade];
  const tag=j.rollover?`<span class="gtag gtr">🔴 이월</span>`:`<span class="gtag ${GT[j.grade]}">${GL[j.grade]}</span>`;
  return`<div class="jcard ${cls}" id="jc-${j.id}"><div class="jc-inner"><div class="jc-top"><span class="jc-seq">#${seq}</span>${tag}</div><div class="jc-name">${j.name}</div><div class="jc-item">${j.item}</div><div class="jc-addr">📍 ${j.addr}</div>${j.rollover?`<div class="rollover-alert">🔴 이월 건 — 오늘 우선 수거 필요</div>`:''} ${j.memo?`<div class="jc-memo">💬 ${j.memo}</div>`:''}<button class="navi-btn" onclick="openNavi('${j.id}')">🗺 카카오맵으로 길찾기</button><div class="res-grid"><button class="rb rb-done" onpointerdown="startPress('${j.id}',this)" onpointerup="cancelPress()" onpointerleave="cancelPress()"><span class="ri">✅</span><span>완료</span><span class="hint">2초 길게</span><div class="pp"></div></button><button class="rb rb-partial" onclick="openModal('${j.id}','partial')"><span class="ri">📦</span><span>일부만</span><span class="hint">있음</span><div class="pp"></div></button><button class="rb rb-absent" onclick="openModal('${j.id}','absent')"><span class="ri">❌</span><span>물건</span><span class="hint">없음</span><div class="pp"></div></button></div><button class="delay-btn" onclick="openModal('${j.id}','delay')">📅 내일로 미루기</button></div></div>`;
}

function updateTabCnts(){const n=filteredJobs().length;document.getElementById('list-cnt').textContent=n;document.getElementById('map-cnt').textContent=n;}
function updateStats(){document.getElementById('s-remain').textContent=JOBS.filter(j=>!j.done).length;document.getElementById('s-done').textContent=JOBS.filter(j=>j.done).length;}

function openNavi(id){const j=JOBS.find(x=>x.id===id);if(!j)return;const addr=encodeURIComponent(j.addr);window.location=`kakaomap://search?q=${addr}`;setTimeout(()=>window.open(`https://map.kakao.com/?q=${addr}`,'_blank'),1500);}

function startPress(id,btn){if(pressTimer)cancelPress();btn.classList.add('pressing');pressTimer=setTimeout(()=>{btn.classList.remove('pressing');markDone(id,'complete');},2000);}
function cancelPress(){if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}document.querySelectorAll('.rb.pressing').forEach(b=>b.classList.remove('pressing'));}
function markDone(id,result){const j=JOBS.find(x=>x.id===id);if(!j)return;j.done=true;j.result=result;const msg=result==='complete'?`✅ ${j.name}님 수거 완료!`:result==='partial'?`📦 ${j.name}님 일부 수거 전송됨`:result==='absent'?`❌ ${j.name}님 물건없음 전송됨`:`📅 ${j.name}님 이월 처리됨`;showToast(msg);renderJobs();updateStats();if(kakaoMap)renderPins();}

function openModal(id,type){
  curJobId=id;curModal=type;photos={partial:[],absent:[]};
  const j=JOBS.find(x=>x.id===id);
  if(type==='partial'){document.getElementById('mp-item').textContent=j.item+' — '+j.addr;document.getElementById('mp-thumbs').innerHTML='';document.getElementById('mp-zone').className='photo-zone';document.getElementById('mp-warn').classList.remove('on');document.getElementById('ov-partial').classList.add('on');}
  else if(type==='absent'){document.getElementById('ma-item').textContent=j.item+' — '+j.addr;document.getElementById('ma-thumbs').innerHTML='';document.getElementById('ma-zone').className='photo-zone';document.getElementById('ma-warn').classList.remove('on');document.getElementById('ov-absent').classList.add('on');}
  else if(type==='delay'){document.getElementById('md-item').textContent=j.item+' — '+j.addr;const{date,reason}=calcDelay(j);document.getElementById('md-date').textContent=fmtKr(date);document.getElementById('md-reason').textContent=reason;document.getElementById('ov-delay').classList.add('on');}
}
function closeModal(){['ov-partial','ov-absent','ov-delay'].forEach(id=>document.getElementById(id).classList.remove('on'));curJobId=null;curModal=null;}
const EMOJIS=['📸','🖼️','📷','🗃️'];
function takePhoto(type){const emoji=EMOJIS[photos[type].length%4];const ts=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});photos[type].push({emoji,ts});const el=document.getElementById(type==='partial'?'mp-thumbs':'ma-thumbs');const d=document.createElement('div');d.className='thumb';d.innerHTML=`<div style="text-align:center"><div>${emoji}</div><div style="font-size:9px;color:#6b7280">${ts}</div></div>`;el.appendChild(d);const zone=document.getElementById(type==='partial'?'mp-zone':'ma-zone');zone.className='photo-zone ok';zone.querySelector('.pz-text').textContent=`사진 ${photos[type].length}장 촬영됨`;zone.querySelector('.pz-sub').textContent='탭하여 추가 촬영';document.getElementById(type==='partial'?'mp-warn':'ma-warn').classList.remove('on');showToast(`📸 ${photos[type].length}장 저장됨`);}
function confirmModal(type){if((type==='partial'||type==='absent')&&photos[type].length===0){document.getElementById(type==='partial'?'mp-warn':'ma-warn').classList.add('on');return;}const id=curJobId;closeModal();markDone(id,type);}

let tt;
function showToast(msg,dur=2500){const el=document.getElementById('toast');el.textContent=msg;el.style.display='block';clearTimeout(tt);tt=setTimeout(()=>el.style.display='none',dur);}
</script>
