<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>단지별 좌표 추출기</title>
<script type="text/javascript"
  src="//dapi.kakao.com/v2/maps/sdk.js?appkey=b8908c96799936ef733a0445f1bd6abc&libraries=services">
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:#f0f4f8;padding:20px;}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
h2{font-size:16px;font-weight:700;margin-bottom:12px;color:#1e40af;}
.prog-bar{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin:8px 0;}
.prog-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#60a5fa);transition:width .3s;}
.status{font-size:12px;color:#6b7280;margin-top:4px;}
.log{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;max-height:200px;overflow-y:auto;font-size:11px;font-family:monospace;color:#334155;margin-top:10px;}
.result-area{background:#1e293b;color:#94a3b8;border-radius:8px;padding:14px;font-size:11px;font-family:monospace;max-height:350px;overflow-y:auto;margin-top:10px;white-space:pre;}
.btn{padding:10px 20px;border-radius:8px;border:none;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:700;cursor:pointer;margin-right:8px;transition:all .15s;}
.btn-blue{background:#1e40af;color:#fff;}
.btn-blue:hover{background:#1d4ed8;}
.btn-green{background:#dcfce7;border:1px solid #22c55e;color:#166534;}
.btn-green:hover{background:#bbf7d0;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.apt-stat{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
.as-item{background:#f1f5f9;border-radius:8px;padding:8px 12px;font-size:12px;}
.as-name{font-weight:700;color:#1e40af;}
.as-cnt{color:#6b7280;margin-top:2px;}
</style>
</head>
<body>

<div class="card">
  <h2>🗺 단지별 동 좌표 자동 추출기</h2>
  <p style="font-size:12px;color:#6b7280;margin-bottom:14px;">
    트리지움(301~333동) · 레이크팰리스(101~132동) · 잠실주공5단지(501~529동)<br>
    총 94개 동의 정확한 좌표를 카카오맵 API로 자동 추출합니다.
  </p>

  <div class="apt-stat">
    <div class="as-item"><div class="as-name">트리지움</div><div class="as-cnt" id="st-tri">대기중</div></div>
    <div class="as-item"><div class="as-name">레이크팰리스</div><div class="as-cnt" id="st-lake">대기중</div></div>
    <div class="as-item"><div class="as-name">잠실주공5단지</div><div class="as-cnt" id="st-jamsil">대기중</div></div>
  </div>

  <div>
    <div style="display:flex;justify-content:space-between;font-size:12px;color:#6b7280;margin-bottom:4px;">
      <span id="prog-txt">시작 전</span>
      <span id="prog-pct">0 / 94</span>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  </div>

  <div style="margin-top:12px;">
    <button class="btn btn-blue" id="start-btn" onclick="startExtract()">🚀 좌표 추출 시작</button>
    <button class="btn btn-green" id="copy-btn" onclick="copyResult()" disabled>📋 결과 복사</button>
  </div>

  <div class="log" id="log">추출 시작 버튼을 누르세요...</div>
</div>

<div class="card">
  <h2>📋 추출된 좌표 DB (기사앱에 붙여넣기용)</h2>
  <p style="font-size:12px;color:#6b7280;margin-bottom:10px;">추출 완료 후 아래 코드를 기사앱 APT_COORDS 변수에 교체하세요.</p>
  <div class="result-area" id="result">// 추출 완료 후 여기에 좌표 DB가 생성됩니다</div>
</div>

<script>
const GEOCODER = new kakao.maps.services.Geocoder();

// 추출할 단지 정의
const APTS = [
  {
    name: '트리지움',
    key: 'tri',
    statEl: 'st-tri',
    dongs: Array.from({length:33}, (_,i) => 301+i),
    queries: dong => [
      `서울 송파구 잠실로 62 트리지움 ${dong}동`,
      `서울 송파구 트리지움아파트 ${dong}동`,
      `서울 송파구 잠실동 트리지움 ${dong}동`,
    ]
  },
  {
    name: '레이크팰리스',
    key: 'lake',
    statEl: 'st-lake',
    dongs: Array.from({length:32}, (_,i) => 101+i),
    queries: dong => [
      `서울 송파구 잠실로 88 레이크팰리스 ${dong}동`,
      `서울 송파구 레이크팰리스아파트 ${dong}동`,
      `서울 송파구 잠실동 레이크팰리스 ${dong}동`,
    ]
  },
  {
    name: '잠실주공',
    key: 'jamsil',
    statEl: 'st-jamsil',
    dongs: Array.from({length:29}, (_,i) => 501+i),
    queries: dong => [
      `서울 송파구 송파대로 567 잠실주공5단지 ${dong}동`,
      `서울 송파구 잠실동 잠실주공5단지 ${dong}동`,
      `서울 송파구 잠실주공아파트 ${dong}동`,
    ]
  },
];

const TOTAL = APTS.reduce((s,a) => s+a.dongs.length, 0);
let done = 0;
let results = {};
let logEl, resultEl, progFill, progTxt, progPct;

function log(msg, color='#94a3b8') {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  line.style.color = color;
  line.textContent = msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

// 단일 주소 지오코딩 (여러 쿼리 시도)
function geocodeWithFallback(queries, idx=0) {
  return new Promise((resolve) => {
    if(idx >= queries.length) {
      resolve(null); return;
    }
    GEOCODER.addressSearch(queries[idx], (result, status) => {
      if(status === kakao.maps.services.Status.OK && result.length > 0) {
        resolve({lat: parseFloat(result[0].y), lng: parseFloat(result[0].x), query: queries[idx]});
      } else {
        // 다음 쿼리로 시도
        setTimeout(() => {
          geocodeWithFallback(queries, idx+1).then(resolve);
        }, 150);
      }
    });
  });
}

// 딜레이
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

async function startExtract() {
  document.getElementById('start-btn').disabled = true;
  log('▶ 좌표 추출 시작...', '#60a5fa');
  results = {};
  done = 0;

  for(const apt of APTS) {
    const aptResult = {};
    document.getElementById(apt.statEl).textContent = '추출 중...';
    let aptDone = 0;

    for(const dong of apt.dongs) {
      const queries = apt.queries(dong);
      const coord = await geocodeWithFallback(queries);
      await delay(200); // API 과부하 방지

      if(coord) {
        aptResult[dong+'동'] = {lat: coord.lat, lng: coord.lng};
        aptDone++;
        log(`✓ ${apt.name} ${dong}동 → (${coord.lat.toFixed(4)}, ${coord.lng.toFixed(4)})`, '#4ade80');
      } else {
        // 좌표 못 찾으면 단지 중심 좌표 사용
        log(`✗ ${apt.name} ${dong}동 → 좌표 미발견 (기본값 사용)`, '#f87171');
      }

      done++;
      const pct = Math.round(done/TOTAL*100);
      document.getElementById('prog-fill').style.width = pct+'%';
      document.getElementById('prog-pct').textContent = `${done} / ${TOTAL}`;
      document.getElementById('prog-txt').textContent = `${apt.name} ${dong}동 처리 중...`;
    }

    results[apt.name] = aptResult;
    document.getElementById(apt.statEl).textContent = `${aptDone}/${apt.dongs.length}개 완료`;
    log(`━━ ${apt.name} 완료: ${aptDone}/${apt.dongs.length}개 ━━`, '#fbbf24');
  }

  document.getElementById('prog-txt').textContent = '✅ 추출 완료!';
  generateCode();
  document.getElementById('copy-btn').disabled = false;
  log('🎉 전체 완료! 아래 코드를 기사앱에 붙여넣으세요.', '#4ade80');
}

// 결과 코드 생성
function generateCode() {
  let code = '// ══ 단지별 동 좌표 DB (카카오맵 지오코딩으로 자동 추출) ══\n';
  code += 'const APT_COORDS = {\n';

  for(const [aptName, dongs] of Object.entries(results)) {
    code += `  '${aptName}': {\n`;
    for(const [dong, coord] of Object.entries(dongs)) {
      code += `    '${dong}': {lat:${coord.lat.toFixed(6)}, lng:${coord.lng.toFixed(6)}},\n`;
    }
    code += '  },\n';
  }

  code += '};\n\n';
  code += '// 사용법: getAptCoord("트리지움", "304동") → {lat, lng}\n';
  code += 'function getAptCoord(aptName, dong) {\n';
  code += '  return APT_COORDS[aptName]?.[dong] || null;\n';
  code += '}\n';

  document.getElementById('result').textContent = code;
  window._coordCode = code;
}

function copyResult() {
  const text = document.getElementById('result').textContent;
  navigator.clipboard.writeText(text).then(() => {
    document.getElementById('copy-btn').textContent = '✅ 복사됨!';
    setTimeout(() => document.getElementById('copy-btn').textContent = '📋 결과 복사', 2000);
  });
}
</script>
</body>
</html>
