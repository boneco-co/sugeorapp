const KAKAO_JS_KEY = 'b8908c96799936ef733a0445f1bd6abc';
function loadKakaoMap(){ return new Promise((ok, fail) => { const s = document.createElement('script'); s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + KAKAO_JS_KEY + '&autoload=false'; s.onload = () => kakao.maps.load(ok); s.onerror = () => fail('load'); document.head.appendChild(s); }); }
let _tT = null; function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(_tT); _tT = setTimeout(() => t.style.display = 'none', 2600); }
// 새 미처리 민원이 늘면 소리·진동 (폰은 화면을 한 번 만진 뒤부터 소리)
let _ac = null, _lastN = -1; ['pointerdown','touchstart'].forEach(ev => document.addEventListener(ev, () => { try { if (!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)(); if (_ac.state === 'suspended') _ac.resume(); } catch(e){} }, { passive:true }));
function _beep(){ try { if (_ac && _ac.state === 'running' && !document.hidden) [0,.25,.5].forEach(o => { const g = _ac.createGain(), os = _ac.createOscillator(); os.frequency.value = 1100; os.connect(g); g.connect(_ac.destination); g.gain.setValueAtTime(.25, _ac.currentTime + o); os.start(_ac.currentTime + o); os.stop(_ac.currentTime + o + .15); }); } catch(e){} try { if (navigator.vibrate && !document.hidden) navigator.vibrate([200,100,200,100,200]); } catch(e){} }
function _mwFeed(v){ const n = Object.keys(v || {}).length; if (_lastN >= 0 && n > _lastN) { _beep(); toast('🔔 새 민원이 들어왔습니다'); } _lastN = n; document.title = (n ? '(' + n + ') ' : '') + '본에코 민원'; }

<script>
// ══ [11_13] 현장 민원 — 종합예방관리대장(부장님 저장소 minwon-c29c2 report/recs)의 민원을 실시간으로 받아 사진·메모·처리완료 ══
(function(){
  const BOSS = { apiKey:'AIzaSyCrJaARREMDXFfhicjUwWFyqkyTbVMRsYk', authDomain:'minwon-c29c2.firebaseapp.com', databaseURL:'https://minwon-c29c2-default-rtdb.asia-southeast1.firebasedatabase.app', projectId:'minwon-c29c2' };
  const TEAMS = ['전체','기동반','야간 생활팀','야간 음식물팀','야간 재활용팀'];
  const COL = { 생활:'#16a34a', 음식물:'#facc15', 재활용:'#2563eb', 공용용기:'#a16207', 특수마대:'#db2777', 기타:'#64748b' };
  const E = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const lsG = (k, d) => { try { return localStorage.getItem(k) || d; } catch(e){ return d; } }, lsS = (k, v) => { try { localStorage.setItem(k, v); } catch(e){} };
  const ymd = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  const nowS = () => { const d = new Date(); return ymd(d) + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
  const who = () => { try { return (localStorage.getItem('worker') || '').trim() || '현장'; } catch(e){ return '현장'; } };
  // [11_13j] 분류: 공용용기는 음식물, 특수마대·기타 등은 생활 (대장과 같음)
  const cat = t => { t = String(t || ''); return t === '음식물' || t === '공용용기' ? '음식물' : t === '재활용' ? '재활용' : '생활'; };
  const catL = t => { const c = cat(t); return t && t !== c ? c + '·' + t : c; };
  const col = r => COL[cat(r.subtype)], done = r => r.status === '처리완료';
  const posOf = r => r.pos && r.pos.lat ? r.pos : (r.addrPos && r.addrPos.lat ? r.addrPos : null);
  let app = null, REF = null, RECS = {}, team = lsG('mwx_team', '전체'), flt = 'open', map = null, pins = [], rows = [], sel = null, ph = {}, phWhich = '';
  function db(){ if (!app) app = firebase.apps.find(a => a.name === 'boss') || firebase.initializeApp(BOSS, 'boss'); return app; }
  // 실시간 구독 — 버튼 알림(숫자·깜빡임)도 이 자료로
  async function sub(){
    if (REF) return; const a = db();
    try { if (!a.auth().currentUser) await a.auth().signInAnonymously(); } catch(e){}
    REF = a.database().ref('report/recs');
    REF.orderByChild('recType').equalTo('minwon').on('value', sn => {
      const v = sn.val() || {}; RECS = {}; Object.keys(v).forEach(k => { const r = v[k]; if (r && !r.del) RECS[k] = Object.assign({ id:k }, r); });
      const un = {}; Object.values(RECS).forEach(r => { if (!done(r)) { const t = Date.parse(String(r.date||'') + 'T' + (r.time || '00:00')); un[r.id] = { recvAt: isNaN(t) ? 0 : t, workDate: r.date || '' }; } });
      if (typeof _mwFeed === 'function') _mwFeed(un);
      if (document.getElementById('mwx-pane').classList.contains('on')) render();
      if (sel && RECS[sel.id]) { sel = RECS[sel.id]; }
    }, e => { if (typeof toast === 'function') toast('⚠️ 민원 자료를 못 읽었습니다'); REF = null; });
  }
  window.mwxOpen = async function(){
    document.getElementById('mwx-pane').classList.add('on'); bindFile();
    renderTeam(); await sub(); render();
    if (!map){
      if (!(window.kakao && kakao.maps && kakao.maps.Map) && typeof loadKakaoMap === 'function'){ try { await loadKakaoMap(); } catch(e){} }
      if (window.kakao && kakao.maps && kakao.maps.Map){ map = new kakao.maps.Map(document.getElementById('mwx-map'), { center: new kakao.maps.LatLng(37.5068, 127.0885), level: 5 }); kakao.maps.event.addListener(map, 'idle', drawPins); }

  };
  window.mwxClose = () => { document.getElementById('mwx-pane').classList.remove('on'); document.getElementById('mwx-card').classList.remove('on'); };
  function renderTeam(){
    const b = document.getElementById('mwx-team');
    b.innerHTML = TEAMS.map(t => '<button type="button" data-t="' + t + '"' + (t === team ? ' class="on"' : '') + '>' + t.replace('야간 ', '야간 ').replace('팀','') + '</button>').join('');
    b.querySelectorAll('button').forEach(x => x.onclick = () => { team = x.dataset.t; lsS('mwx_team', team); renderTeam(); render(true); });
  }
  document.addEventListener('click', e => { const f = e.target.closest && e.target.closest('#mwx-seg button'); if (!f) return; flt = f.dataset.f; document.querySelectorAll('#mwx-seg button').forEach(x => x.classList.toggle('on', x === f)); render(true); });
  function render(fit){
    const t = ymd(new Date());
    let all = Object.values(RECS).filter(r => team === '전체' || (r.team || '') === team);
    const openN = all.filter(r => !done(r)).length, todayN = all.filter(r => done(r) && String(r.doneAt || r.updatedAt || '').slice(0,10) === t).length;
    document.querySelector('#mwx-seg [data-f="open"]').textContent = '미처리 ' + openN; document.querySelector('#mwx-seg [data-f="today"]').textContent = '오늘 처리 ' + todayN;
    document.getElementById('mwx-ttl').textContent = '📋 민원 · ' + (team === '전체' ? '전체 팀' : team);
    rows = all.filter(r => flt === 'open' ? !done(r) : flt === 'today' ? (done(r) && String(r.doneAt || r.updatedAt || '').slice(0,10) === t) : true)
      .sort((a, b) => String((b.date||'') + (b.time||'')).localeCompare(String((a.date||'') + (a.time||''))));
    const L = document.getElementById('mwx-list');
    L.innerHTML = rows.slice(0, 300).map((r, i) => '<div class="mwx-it" data-i="' + i + '" style="border-left-color:' + col(r) + '"><div class="r1"><b>' + E(r.addr || '주소 없음') + '</b><span class="mwx-st ' + (done(r) ? 'd">처리완료' : 'w">미처리') + '</span></div>'
      + '<div class="tx"><span class="mwx-tag" style="background:' + col(r) + ';color:' + (col(r) === '#facc15' ? '#422006' : '#fff') + '">' + E(catL(r.subtype)) + '</span>' + E(String(r.content || r.category || '').slice(0, 80)) + '</div>'
      + '<div class="mt"><span>' + E(String(r.date || '').slice(5)) + ' ' + E(r.time || '') + ' 접수</span><span>' + E(r.team || '') + '</span></div></div>').join('')
      || '<div style="padding:14px;color:#6b7280;font-size:14px">' + (flt === 'open' ? '미처리 민원이 없습니다 ✅' : '해당하는 민원이 없습니다') + '</div>';
    L.querySelectorAll('.mwx-it').forEach(el => el.onclick = () => { const r = rows[+el.dataset.i]; card(r); const p = posOf(r); if (map && p) map.panTo(new kakao.maps.LatLng(p.lat, p.lng)); });
    if (map){ if (fit){ const pts = rows.filter(posOf); if (pts.length){ const bd = new kakao.maps.LatLngBounds(); pts.forEach(r => { const p = posOf(r); bd.extend(new kakao.maps.LatLng(p.lat, p.lng)); }); if (pts.length === 1){ const p = posOf(pts[0]); map.setCenter(new kakao.maps.LatLng(p.lat, p.lng)); map.setLevel(3); } else map.setBounds(bd); } } drawPins(); }
  }
  function donut(cols, total){
    const size = total >= 50 ? 64 : total >= 10 ? 56 : 48, dpr = window.devicePixelRatio || 1, cv = document.createElement('canvas');
    cv.width = size * dpr; cv.height = size * dpr; cv.style.width = size + 'px'; cv.style.height = size + 'px';
    const g = cv.getContext('2d'); g.scale(dpr, dpr); const c = size / 2, R = c - 2, ring = Math.max(6, size * .17);
    g.beginPath(); g.arc(c, c, R, 0, Math.PI * 2); g.fillStyle = 'rgba(15,23,42,.30)'; g.fill();

    g.beginPath(); g.arc(c, c, R - ring, 0, Math.PI * 2); g.fillStyle = '#fff'; g.fill();
    g.fillStyle = '#0f172a'; g.font = '800 ' + (total >= 100 ? 15 : total >= 10 ? 17 : 19) + 'px -apple-system,sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(total), c, c + .5);
    return cv;
  }
  // 50곳 이상이면 멀리서 원+숫자로 뭉치고, 가까이는 주소 핀 (종합예방관리대장과 같은 규칙)
  function drawPins(){
    if (!map) return; pins.forEach(o => o.setMap(null)); pins = [];
    const pts = rows.filter(posOf); if (!pts.length) return;
    const pin = r => { const p = posOf(r), el = document.createElement('div'); el.className = 'mwx-pin'; el.style.borderColor = col(r); el.style.color = col(r) === '#facc15' ? '#854d0e' : col(r);
      el.textContent = String(r.addr || '').replace(/서울(특별시)?\s*|송파구\s*/g, '').slice(0, 14) || '민원'; el.onclick = () => card(r);
      pins.push(new kakao.maps.CustomOverlay({ map, position: new kakao.maps.LatLng(p.lat, p.lng), content: el, yAnchor: 1 })); };
    const b = map.getBounds(), sw = b.getSouthWest(), ne = b.getNorthEast(), el = document.getElementById('mwx-map'), lv = map.getLevel();
    const inView = pts.filter(r => { const p = posOf(r); return p.lat >= sw.getLat() && p.lat <= ne.getLat() && p.lng >= sw.getLng() && p.lng <= ne.getLng(); }).length;
    if (pts.length < 50 || lv <= 2 || (lv === 3 && inView <= 40)) { pts.forEach(pin); return; }
    const dLat = (ne.getLat() - sw.getLat()) / (el.clientHeight || 600), dLng = (ne.getLng() - sw.getLng()) / (el.clientWidth || 600);
    if (!(dLat > 0 && dLng > 0)) { pts.forEach(pin); return; }
    const bins = {}; pts.forEach(r => { const p = posOf(r), k = Math.floor(p.lat / (dLat * 95)) + '_' + Math.floor(p.lng / (dLng * 95)); (bins[k] = bins[k] || []).push(r); });
    const cen = g => { const n = g.rows.length; g.lat = g.rows.reduce((s, r) => s + (+posOf(r).lat), 0) / n; g.lng = g.rows.reduce((s, r) => s + (+posOf(r).lng), 0) / n; return g; };
    const merged = []; Object.values(bins).map(r => cen({ rows: r })).sort((a, b) => b.rows.length - a.rows.length).forEach(g => {
      const near = merged.find(m => Math.hypot((m.lat - g.lat) / dLat, (m.lng - g.lng) / dLng) < 78); if (near) { near.rows = near.rows.concat(g.rows); cen(near); } else merged.push(g); });
    merged.forEach(g => {
      if (g.rows.length === 1) { pin(g.rows[0]); return; }
      const cols = {}; g.rows.forEach(r => { cols[col(r)] = (cols[col(r)] || 0) + 1; });
      const box = document.createElement('div'); box.style.cssText = 'cursor:pointer;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))'; box.appendChild(donut(cols, g.rows.length));
      box.onclick = () => map.setLevel(Math.max(2, map.getLevel() - 2), { anchor: new kakao.maps.LatLng(g.lat, g.lng) });
      pins.push(new kakao.maps.CustomOverlay({ map, position: new kakao.maps.LatLng(g.lat, g.lng), content: box, xAnchor: .5, yAnchor: .5, zIndex: 4 }));
    });
  }
  // 한 건 — 처리 전·후 사진, 한 줄 메모, [✅ 처리완료] → 종합예방관리대장에 바로 보임
  function card(r){
    sel = r; ph = {};
    const c = document.getElementById('mwx-card'), p = posOf(r);
    c.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b style="font-size:17px">' + E(r.addr || '주소 없음') + '</b><button type="button" id="mwx-x" style="border:0;background:#f1f5f9;border-radius:50%;width:32px;height:32px;font-size:16px">✕</button></div>'
      + '<div class="kv"><b>민원</b><div><span class="mwx-tag" style="background:' + col(r) + ';color:' + (col(r) === '#facc15' ? '#422006' : '#fff') + '">' + E(catL(r.subtype)) + '</span>' + E(r.content || r.category || '') + '</div></div>'
      + (r.tel ? '<div class="kv"><b>연락처</b><div>' + E(r.tel) + '</div></div>' : '')
      + '<div class="kv"><b>접수</b><div>' + E(r.date || '') + ' ' + E(r.time || '') + ' · ' + E(r.team || '') + (r.no ? ' · ' + E(r.no) : '') + '</div></div>'
      + (p ? '<div class="kv"><b>위치</b><div><a href="https://map.kakao.com/link/to/' + encodeURIComponent(r.addr || '민원') + ',' + p.lat + ',' + p.lng + '" target="_blank" rel="noopener" style="color:#0f7a86;font-weight:800">🗺️ 길찾기</a></div></div>' : '')
      + (r.fieldMemo ? '<div class="kv"><b>메모</b><div style="white-space:pre-line">' + E(r.fieldMemo) + '</div></div>' : '')
      + '<div class="mwx-phs"><div class="mwx-pb" data-w="before"><span>처리 전</span>📷 찍기</div><div class="mwx-pb" data-w="after"><span>처리 후</span>📷 찍기</div></div>'
      + '<input id="mwx-memo" placeholder="한 줄 메모 (예: 수거 완료, 봉투 3개)" autocomplete="off">'
      + '<button type="button" id="mwx-done">' + (done(r) ? '💾 사진·메모 저장 (처리완료 유지)' : '✅ 처리완료') + '</button>';
    c.classList.add('on');
    document.getElementById('mwx-x').onclick = () => c.classList.remove('on');
    c.querySelectorAll('.mwx-pb').forEach(b => b.onclick = () => { phWhich = b.dataset.w; document.getElementById('mwx-file').click(); });
    document.getElementById('mwx-done').onclick = save;
    db().database().ref('report/photos/' + r.id).once('value').then(sn => { const v = sn.val() || {}; ['before','after'].forEach(w => { if (v[w] && sel && sel.id === r.id) showPh(w, v[w]); }); }).catch(() => {});
  }
  function showPh(w, src){ const b = document.querySelector('#mwx-card .mwx-pb[data-w="' + w + '"]'); if (b) b.innerHTML = '<span>' + (w === 'before' ? '처리 전' : '처리 후') + '</span><img alt="" src="' + src + '">'; }
  function shrink(file){ return new Promise((ok, no) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => { const m = 1280, r = Math.min(1, m / Math.max(im.width, im.height)), cv = document.createElement('canvas');
    cv.width = Math.round(im.width * r); cv.height = Math.round(im.height * r); cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); URL.revokeObjectURL(u); ok(cv.toDataURL('image/jpeg', .6)); }; im.onerror = () => { URL.revokeObjectURL(u); no(new Error('사진을 못 읽었습니다')); }; im.src = u; }); }
  function bindFile(){ const fi = document.getElementById('mwx-file'); if (!fi || fi._b) return; fi._b = 1; fi.addEventListener('change', async e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f || !phWhich) return;
    try { const d = await shrink(f); ph[phWhich] = d; showPh(phWhich, d); } catch(err){ if (typeof toast === 'function') toast('⚠️ ' + err.message); } }); }
  async function save(){
    const r = sel; if (!r) return; if (!navigator.onLine) { toast('📴 오프라인이에요 — 인터넷이 연결되면 다시 눌러 주세요'); return; } const btn = document.getElementById('mwx-done'); btn.disabled = true; btn.textContent = '저장 중…';
    try {
      const a = db(), memo = (document.getElementById('mwx-memo').value || '').trim(), t = nowS();
      for (const w of Object.keys(ph)) await a.database().ref('report/photos/' + r.id + '/' + w).set(ph[w]);
      const up = { status: '처리완료', updatedAt: t };
      if (!done(r)) { up.doneAt = t; up.doneBy = who(); }
      if (memo) up.fieldMemo = (r.fieldMemo ? r.fieldMemo + '\n' : '') + t.slice(5) + ' ' + who() + ': ' + memo;
      await a.database().ref('report/recs/' + r.id).update(up);
      if (typeof toast === 'function') toast('✅ 처리완료 — 종합예방관리대장에 바로 보입니다');
      document.getElementById('mwx-card').classList.remove('on');
    } catch(e){ if (typeof toast === 'function') toast('❌ 저장 실패: ' + e.message); btn.disabled = false; btn.textContent = '✅ 처리완료'; }
  }
  // [11_13d] 대형수거앱 규칙: 자정 넘으면 '오늘 처리' 다시 계산, 오래 꺼뒀다 켜면 연결 다시 붙이기
  window.mwxRefresh = () => { try { if (document.getElementById('mwx-pane').classList.contains('on')) render(); } catch(e){} };
  window.mwxReconnect = () => { try { const d = db().database(); d.goOffline(); d.goOnline(); } catch(e){} };
  window.mwxCardOpen = () => document.getElementById('mwx-card').classList.contains('on');
  window.mwxCardClose = () => document.getElementById('mwx-card').classList.remove('on');
  // 알림(숫자·깜빡임)은 화면을 안 열어도 받는다
  setTimeout(() => { try { sub(); } catch(e){} }, 1500);
})();
</script>
<script>
// [11_13] 시작: 대형수거앱처럼 직원 비밀번호(하루 한 번) → 팀 + 차량번호 뒤 4자리 → 민원 화면
(function(){
  const WJ = { apiKey:"AIzaSyD4hPKN8cdtnsVACdvBxDfoR33mAOYEuco", authDomain:"boneco-wonjang.firebaseapp.com", databaseURL:"https://boneco-wonjang-default-rtdb.asia-southeast1.firebasedatabase.app", projectId:"boneco-wonjang", appId:"1:463413861191:web:c6a68b67fe000baae64a62" };
  if (!firebase.apps.find(a => a.name === '[DEFAULT]')) firebase.initializeApp(WJ);
  const STAFF_EMAIL = 'staff@boneco.kr', GATE = 'mw_gate_passDate', TEAMS = ['기동반','야간 생활팀','야간 음식물팀','야간 재활용팀'];
  const $ = id => document.getElementById(id), ymd = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const lsG = (k, d) => { try { return localStorage.getItem(k) || d; } catch(e){ return d; } }, lsS = (k, v) => { try { localStorage.setItem(k, v); } catch(e){} };
  const top = document.querySelector('#mwx-top button'); if (top) top.classList.add('hide');
  const chg = document.createElement('button'); chg.id = 'who-chg'; chg.type = 'button'; $('mwx-top').appendChild(chg);
  const car = () => lsG('worker', '').trim();
  const showCar = () => chg.textContent = '🚛 ' + (car() || '차량 선택');
  const errMsg = e => { const c = (e && e.code) || ''; return /wrong-password|invalid-credential|invalid-login|invalid-password/.test(c) ? '비밀번호가 올바르지 않습니다' : /too-many-requests/.test(c) ? '여러 번 틀려 잠시 막혔습니다. 몇 분 뒤 다시 해 주세요' : /network/.test(c) ? '인터넷 연결을 확인해 주세요' : '로그인하지 못했습니다 (' + (c || '알 수 없음') + ')'; };
  let selTeam = lsG('mwx_team', '');
  function openCar(){
    let recent = []; try { recent = JSON.parse(lsG('mw_cars', '[]')) || []; } catch(e){}
    $('car-recent').innerHTML = recent.length ? recent.slice(0, 6).map(c => '<button type="button" data-t="' + c.t + '" data-d="' + c.d + '">' + c.t.replace('야간 ', '') + ' ' + c.d + '</button>').join('') : '';
    $('car-recent').querySelectorAll('button').forEach(b => b.onclick = () => { selTeam = b.dataset.t; $('car-in').value = b.dataset.d; paintTeam(); });
    if (!TEAMS.includes(selTeam)) selTeam = '';
    const m = car().match(/(\d{4})$/); if (m && !$('car-in').value) $('car-in').value = m[1];
    paintTeam(); $('car-err').textContent = ''; $('car-ov').classList.add('on');
  }
  function paintTeam(){ $('car-team').innerHTML = TEAMS.map(t => '<button type="button" data-t="' + t + '"' + (t === selTeam ? ' class="on"' : '') + '>' + t + '</button>').join(''); $('car-team').querySelectorAll('button').forEach(b => b.onclick = () => { selTeam = b.dataset.t; $('car-err').textContent = ''; paintTeam(); }); }
  function saveCar(){
    const d = ($('car-in').value || '').replace(/\D/g, '');
    if (!selTeam) { $('car-err').textContent = '팀을 골라 주세요'; return; }
    if (d.length !== 4) { $('car-err').textContent = '차량번호 뒤 4자리를 입력해 주세요'; return; }
    const label = selTeam + ' ' + d; lsS('worker', label); lsS('mwx_team', selTeam);
    let recent = []; try { recent = JSON.parse(lsG('mw_cars', '[]')) || []; } catch(e){}
    recent = [{ t: selTeam, d }].concat(recent.filter(c => !(c.t === selTeam && c.d === d))).slice(0, 6); lsS('mw_cars', JSON.stringify(recent));
    $('car-ov').classList.remove('on'); showCar(); location.reload();   // 고른 팀으로 화면을 새로 연다
  }
  async function checkGate(){
    const v = ($('gate-in').value || '').trim(), err = $('gate-err');
    if (!v) { err.textContent = '비밀번호를 입력해 주세요'; return; }
    err.textContent = '확인 중…';
    try { await firebase.auth().signInWithEmailAndPassword(STAFF_EMAIL, v); }
    catch(e){ err.textContent = errMsg(e); $('gate-in').value = ''; return; }
    // 하루 첫 통과: 새로고침 → 서버에서 최신 민원 목록을 다시 받음 (차량·팀은 유지)
    lsS(GATE, ymd()); err.textContent = ''; location.reload();
  }
  function start(){ showCar(); armBackGuard(); mwxOpen(); }
  $('gate-go').onclick = checkGate; $('gate-in').addEventListener('keydown', e => { if (e.key === 'Enter') checkGate(); });
  $('car-go').onclick = saveCar; $('car-in').addEventListener('keydown', e => { if (e.key === 'Enter') saveCar(); });
  chg.onclick = openCar;
  showCar();
  const off = firebase.auth().onAuthStateChanged(function(u){ off();
    const staff = !!(u && !u.isAnonymous && u.email === STAFF_EMAIL);
    if (!staff) { try { localStorage.removeItem(GATE); } catch(e){} }   // 로그인이 풀렸으면 오늘 통과도 무효 → 비밀번호 창
    if (lsG(GATE, '') === ymd() && staff) { if (car()) start(); else openCar(); }
    else { $('gate-ov').classList.add('on'); setTimeout(() => $('gate-in').focus(), 150); }
  });

  // ── 대형수거앱과 같은 규칙 ──
  // 뒤로가기: 처리 창이 열려 있으면 그것만 닫고, 맨 위 화면에서는 한 번 더 눌러야 종료
  let exitArmed = false, exitT = null, armed = false;
  function armBackGuard(){
    if (armed) return; armed = true;
    history.replaceState({ root:true }, ''); history.pushState({ root:true }, '');
    window.addEventListener('popstate', () => {
      if ($('car-ov').classList.contains('on') && car()) { $('car-ov').classList.remove('on'); history.pushState({ root:true }, ''); return; }
      if (window.mwxCardOpen && mwxCardOpen()) { mwxCardClose(); history.pushState({ root:true }, ''); return; }
      if (exitArmed) return;
      exitArmed = true; toast('한 번 더 뒤로가면 앱이 종료됩니다'); history.pushState({ root:true }, '');
      clearTimeout(exitT); exitT = setTimeout(() => { exitArmed = false; }, 2000);
    });
  }
  // 오프라인 표시
  const offbar = () => { $('offbar').style.display = navigator.onLine ? 'none' : 'block'; };
  window.addEventListener('online', () => { offbar(); if (window.mwxReconnect) mwxReconnect(); });
  window.addEventListener('offline', offbar); offbar();
  // 자정을 넘기면 '오늘 처리' 다시 계산
  let day = ymd();
  function refreshDay(){ const n = ymd(); if (n !== day) { day = n; if (window.mwxRefresh) mwxRefresh(); } }
  setInterval(refreshDay, 60000);
  // 화면을 다시 켜면: 날짜 확인, 20분 넘게 꺼져 있었으면 연결 다시 붙여 최신 자료 받기
  let hiddenAt = 0, lastVis = 0;
  function onAppVisible(){
    const now = Date.now(); if (now - lastVis < 3000) return; lastVis = now;
    refreshDay();
    const longAway = hiddenAt && (now - hiddenAt > 20 * 60000); hiddenAt = 0;
    if (longAway && window.mwxReconnect) mwxReconnect();
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden) hiddenAt = Date.now(); else onAppVisible(); });
  window.addEventListener('focus', onAppVisible);
  window.addEventListener('pageshow', onAppVisible);
})();
</script>
